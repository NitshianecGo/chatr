<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>СС·ЧАТ</title>
<style>
/* ── Общие сбросы ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090b;--surface:#18181b;--surface2:#27272a;--border:#3f3f46;
  --text:#fafafa;--muted:#a1a1aa;--dim:#71717a;
  --amber:#f59e0b;--amber-light:#fbbf24;--red:#dc2626;--red-light:#ef4444;
  --emerald:#10b981;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--amber)}
::selection{background:rgba(245,158,11,.3)}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;outline:none}
.hidden{display:none!important}

/* ── Welcome ── */
.welcome{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;position:relative;overflow:hidden}
.welcome::before{content:'';position:absolute;inset:0;opacity:.04;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.welcome-glow1{position:absolute;top:-160px;left:-160px;width:384px;height:384px;background:rgba(245,158,11,.1);border-radius:50%;filter:blur(80px)}
.welcome-glow2{position:absolute;bottom:-160px;right:-160px;width:384px;height:384px;background:rgba(220,38,38,.1);border-radius:50%;filter:blur(80px)}
.welcome-wrap{position:relative;width:100%;max-width:448px}
.logo-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:32px}
.logo-icon{position:relative;width:80px;height:80px;border-radius:16px;background:linear-gradient(135deg,#fbbf24,#ef4444,#b91c1c);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(245,158,11,.2);margin-bottom:16px}
.logo-icon::before{content:'';position:absolute;inset:0;background:rgba(245,158,11,.3);filter:blur(20px);border-radius:50%;z-index:-1}
.logo-icon svg{width:40px;height:40px;fill:#09090b}
.logo-title{font-size:30px;font-weight:900;letter-spacing:-.02em;background:linear-gradient(90deg,#fde68a,#f87171);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:11px;color:#71717a;margin-top:4px;letter-spacing:.3em;text-transform:uppercase}
.card{background:rgba(24,24,27,.7);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 16px 48px rgba(0,0,0,.4)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:rgba(9,9,11,.6);border-radius:12px;margin-bottom:24px}
.tab{padding:10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);transition:all .2s}
.tab.active{background:linear-gradient(90deg,#f59e0b,#dc2626);color:#09090b;box-shadow:0 4px 12px rgba(220,38,38,.2)}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.field input{width:100%;background:rgba(9,9,11,.6);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);font-size:15px;transition:border-color .2s}
.field input:focus{border-color:rgba(245,158,11,.5);box-shadow:0 0 0 1px rgba(245,158,11,.15)}
.field input::placeholder{color:#52525b}
.btn-primary{width:100%;padding:14px;border-radius:12px;background:linear-gradient(90deg,#f59e0b,#dc2626);color:#09090b;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.btn-primary:hover{box-shadow:0 8px 24px rgba(220,38,38,.3);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.error{font-size:14px;color:var(--red-light);margin-bottom:12px}
.hint{margin-top:20px;padding-top:20px;border-top:1px solid rgba(63,63,70,.8);display:flex;gap:10px;font-size:12px;color:var(--dim)}
.hint svg{width:16px;height:16px;fill:rgba(245,158,11,.7);flex-shrink:0;margin-top:2px}
.features{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:24px}
.feature{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--dim)}
.feature svg{width:18px;height:18px;fill:rgba(245,158,11,.6)}
.feature span{font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.auth-buttons{display:flex;gap:8px;margin-bottom:16px}
.auth-btn{padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px;background:var(--surface2);color:var(--text);transition:all .15s;flex:1}
.auth-btn:hover{background:var(--border)}
.auth-btn.primary{background:linear-gradient(90deg,#f59e0b,#dc2626);color:#09090b}

/* ── Chat ── */
.chat{height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(24,24,27,.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);flex-shrink:0}
.header-avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#fbbf24,#dc2626);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#09090b;flex-shrink:0}
.header-info{flex:1;min-width:0}
.header-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.status-dot{width:6px;height:6px;border-radius:50%}
.status-dot.online{background:var(--emerald)}
.status-dot.offline{background:#52525b}
.header-btn{padding:8px;border-radius:8px;color:var(--muted);transition:all .15s;display:flex;align-items:center;justify-content:center}
.header-btn:hover{color:var(--amber);background:var(--surface2)}
.header-btn:disabled{opacity:.3;cursor:not-allowed}
.header-btn svg{width:20px;height:20px;fill:currentColor}
.header-divider{width:1px;height:24px;background:var(--border)}
.chat-body{flex:1;display:flex;overflow:hidden}
.messages-wrap{flex:1;display:flex;flex-direction:column;min-width:0}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.spinner-wrap{display:flex;align-items:center;justify-content:center;height:100%}
.spinner{width:32px;height:32px;border:2px solid rgba(245,158,11,.3);border-top-color:var(--amber);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:32px}
.empty-icon{width:64px;height:64px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.empty-icon svg{width:28px;height:28px;fill:#52525b}
.empty-text{color:var(--muted);font-size:14px}
.empty-code{color:#52525b;font-size:12px;margin-top:4px}
.empty-code span{font-family:monospace;color:rgba(245,158,11,.7)}
.load-more{text-align:center;padding:8px;color:var(--amber);cursor:pointer;font-size:13px;border-radius:8px;transition:background .15s}
.load-more:hover{background:var(--surface2)}

.msg{display:flex;position:relative}
.msg.mine{justify-content:flex-end}
.msg-content{display:flex;flex-direction:column;gap:2px;max-width:80%}
.msg.mine .msg-content{align-items:flex-end}
.msg-name{font-size:12px;color:rgba(245,158,11,.7);padding:0 4px}
.msg-bubble{border-radius:16px;padding:8px 14px;word-break:break-word;white-space:pre-wrap;font-size:14px;line-height:1.5}
.msg.mine .msg-bubble{background:linear-gradient(135deg,#f59e0b,#dc2626);color:#09090b;font-weight:500;border-bottom-right-radius:4px}
.msg.other .msg-bubble{background:var(--surface2);color:var(--text);border-bottom-left-radius:4px}
.msg-time{font-size:10px;color:#52525b;padding:0 4px}
.msg-delete{position:absolute;top:-4px;right:-4px;background:var(--surface);border:1px solid var(--border);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--dim);transition:all .15s;opacity:0}
.msg.mine:hover .msg-delete{opacity:1}
.msg-delete:hover{color:var(--red);border-color:var(--red)}
.msg-delete svg{width:14px;height:14px;fill:currentColor}

.msg-image{border-radius:16px;overflow:hidden;border:1px solid var(--border)}
.msg.mine .msg-image{border-color:rgba(245,158,11,.2)}
.msg-image img{max-width:100%;max-height:288px;object-fit:cover;cursor:pointer;display:block}
.msg-image .img-error{width:192px;height:128px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#52525b}
.msg-image .img-error svg{width:24px;height:24px;fill:#52525b}
.msg-audio{border-radius:16px;padding:8px 12px}
.msg.mine .msg-audio{background:linear-gradient(135deg,#f59e0b,#dc2626);border-bottom-right-radius:4px}
.msg.other .msg-audio{background:var(--surface2);border-bottom-left-radius:4px}
.msg-audio audio{height:36px;width:208px;filter:invert(.85) hue-rotate(180deg)}
.msg.mine .msg-audio audio{filter:invert(.1)}
.typing-indicator{font-size:13px;color:var(--dim);padding:4px 16px;font-style:italic}

.composer{padding:12px;background:rgba(24,24,27,.8);backdrop-filter:blur(16px);border-top:1px solid var(--border);flex-shrink:0}
.composer-inner{display:flex;align-items:flex-end;gap:6px;background:rgba(9,9,11,.6);border:1px solid var(--border);border-radius:16px;padding:6px;transition:border-color .2s}
.composer-inner:focus-within{border-color:rgba(245,158,11,.3)}
.composer-btn{padding:8px;border-radius:8px;color:var(--muted);transition:all .15s;display:flex;align-items:center;justify-content:center;position:relative}
.composer-btn:hover{color:var(--amber);background:var(--surface2)}
.composer-btn svg{width:22px;height:22px;fill:currentColor}
.composer-input{flex:1;background:transparent;border:none;color:var(--text);resize:none;font-size:15px;padding:8px 4px;max-height:96px;min-width:0}
.composer-input::placeholder{color:#52525b}
.composer-send{padding:10px;border-radius:12px;background:linear-gradient(135deg,#f59e0b,#dc2626);color:#09090b;flex-shrink:0;transition:all .15s}
.composer-send:disabled{opacity:.3;cursor:not-allowed}
.composer-send svg{width:20px;height:20px;fill:currentColor}
.composer-send:not(:disabled):hover{transform:scale(1.05)}

/* Emoji picker */
.emoji-picker{position:absolute;bottom:100%;margin-bottom:8px;left:0;z-index:50;width:288px;background:var(--surface);border:1px solid rgba(245,158,11,.3);border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.5);overflow:hidden}
.emoji-tabs{display:flex;border-bottom:1px solid var(--border)}
.emoji-tab{flex:1;font-size:12px;padding:8px 4px;color:var(--dim);transition:all .15s}
.emoji-tab.active{color:var(--amber);background:rgba(39,39,42,.6)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;max-height:192px;overflow-y:auto}
.emoji-grid button{font-size:20px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:background .1s}
.emoji-grid button:hover{background:var(--surface2)}

/* Recording */
.recording{display:flex;align-items:center;gap:12px;background:rgba(127,29,29,.4);border:1px solid rgba(239,68,68,.3);border-radius:12px;padding:8px 12px}
.rec-dot{position:relative;display:flex;width:12px;height:12px}
.rec-dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:#ef4444;animation:ping 1s infinite}
.rec-dot::before{content:'';position:absolute;inset:0;border-radius:50%;background:#ef4444;opacity:.75;animation:ping 1s infinite}
@keyframes ping{75%,100%{transform:scale(2);opacity:0}}
.rec-time{font-size:14px;color:#fca5a5;font-variant-numeric:tabular-nums}
.rec-cancel{padding:6px;border-radius:8px;color:var(--muted);transition:all .15s}
.rec-cancel:hover{color:var(--red-light);background:var(--surface2)}
.rec-cancel svg{width:18px;height:18px;fill:currentColor}
.rec-stop{padding:8px;border-radius:8px;background:var(--surface2);color:var(--text);transition:all .15s}
.rec-stop:hover{background:#3f3f46}
.rec-stop svg{width:18px;height:18px;fill:currentColor}
.rec-preview{display:flex;align-items:center;gap:8px;background:rgba(9,9,11,.6);border:1px solid var(--border);border-radius:12px;padding:8px 12px}
.rec-preview audio{flex:1;min-width:0;height:36px;filter:invert(.85) hue-rotate(180deg)}
.rec-preview .rec-dur{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.rec-send{padding:8px;border-radius:8px;background:linear-gradient(135deg,#f59e0b,#dc2626);color:#09090b;transition:transform .15s}
.rec-send:hover{transform:scale(1.05)}
.rec-send svg{width:18px;height:18px;fill:currentColor}

/* Participants sidebar */
.sidebar{width:256px;background:rgba(24,24,27,.6);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sidebar-header svg{width:18px;height:18px;fill:rgba(245,158,11,.7)}
.sidebar-header h2{font-size:14px;font-weight:600;color:#d4d4d8}
.sidebar-count{margin-left:auto;font-size:12px;color:#52525b}
.sidebar-list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:8px;border-radius:8px;transition:background .15s}
.sidebar-item:hover{background:rgba(39,39,42,.5)}
.sidebar-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#09090b;flex-shrink:0}
.sidebar-info{flex:1;min-width:0}
.sidebar-name{font-size:14px;color:#d4d4d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-status{font-size:12px;color:#52525b}
.sidebar-dot{width:8px;height:8px;border-radius:50%;background:var(--emerald);flex-shrink:0}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.sidebar-invite{width:100%;padding:10px;border-radius:12px;background:var(--surface2);color:#d4d4d8;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.sidebar-invite:hover{background:#3f3f46}
.sidebar-invite svg{width:16px;height:16px;fill:currentColor}

/* Modal overlay */
.overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid rgba(245,158,11,.3);border-radius:16px;padding:24px;width:100%;max-width:384px;box-shadow:0 16px 48px rgba(245,158,11,.1)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.modal-title-wrap{display:flex;align-items:center;gap:12px}
.modal-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#f59e0b,#dc2626);display:flex;align-items:center;justify-content:center}
.modal-icon svg{width:20px;height:20px;fill:#09090b}
.modal-title{font-size:18px;font-weight:700;color:var(--text)}
.modal-sub{font-size:12px;color:var(--dim)}
.modal-close{padding:6px;border-radius:8px;color:var(--dim);transition:all .15s}
.modal-close:hover{color:#d4d4d8;background:var(--surface2)}
.modal-close svg{width:20px;height:20px;fill:currentColor}
.modal-label{display:block;font-size:11px;color:var(--dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.code-display{width:100%;background:rgba(9,9,11,.6);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;align-items:center;justify-content:center;gap:12px;transition:border-color .15s;cursor:pointer}
.code-display:hover{border-color:rgba(245,158,11,.4)}
.code-display .code{font-size:30px;font-weight:900;letter-spacing:.3em;color:var(--amber);font-family:monospace}
.code-display svg{width:18px;height:18px;fill:var(--dim)}
.code-display .check{fill:var(--emerald)}
.code-hint{font-size:12px;color:#52525b;text-align:center;margin-top:8px}
.link-row{display:flex;gap:8px;margin-bottom:16px}
.link-input{flex:1;min-width:0;background:rgba(9,9,11,.6);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);font-family:monospace}
.link-input:focus{border-color:rgba(245,158,11,.4)}
.link-copy{padding:0 12px;border-radius:12px;background:var(--surface2);color:#d4d4d8;transition:background .15s;display:flex;align-items:center;justify-content:center}
.link-copy:hover{background:#3f3f46}
.link-copy svg{width:18px;height:18px;fill:currentColor}
.btn-share{width:100%;padding:12px;border-radius:12px;background:linear-gradient(90deg,#f59e0b,#dc2626);color:#09090b;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.btn-share:hover{box-shadow:0 8px 24px rgba(220,38,38,.3)}
.btn-share svg{width:18px;height:18px;fill:currentColor}
.modal-foot{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:#52525b}
.modal-foot svg{width:14px;height:14px;fill:currentColor}

/* Call modal */
.call-modal{position:fixed;inset:0;z-index:100;background:rgba(9,9,11,.95);backdrop-filter:blur(16px);display:flex;flex-direction:column}
.call-video-area{position:relative;flex:1;background:#000;overflow:hidden}
.call-remote-video{width:100%;height:100%;object-fit:cover}
.call-local-video{position:absolute;top:16px;right:16px;width:128px;height:176px;border-radius:12px;overflow:hidden;border:2px solid rgba(245,158,11,.4);background:var(--surface)}
.call-local-video video{width:100%;height:100%;object-fit:cover}
.call-video-off{position:absolute;top:16px;right:16px;width:128px;height:176px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center}
.call-video-off svg{width:28px;height:28px;fill:#52525b}
.call-info{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px}
.call-avatar{position:relative;width:112px;height:112px}
.call-avatar-ring{position:absolute;inset:0;border-radius:50%;background:rgba(245,158,11,.2);animation:ping 1.5s infinite}
.call-avatar-ring2{position:absolute;inset:-16px;border-radius:50%;border:2px solid rgba(245,158,11,.2);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.call-avatar-inner{position:relative;width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#dc2626,#b91c1c);display:flex;align-items:center;justify-content:center;box-shadow:0 16px 48px rgba(245,158,11,.3)}
.call-avatar-inner svg{width:48px;height:48px;fill:#09090b}
.call-name{font-size:24px;font-weight:700;color:var(--text);text-align:center}
.call-status-text{color:var(--dim);margin-top:4px;text-align:center}
.call-controls{display:flex;align-items:center;gap:16px;margin-top:16px}
.call-ctrl-btn{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .15s}
.call-ctrl-btn.muted{background:var(--surface2);color:#d4d4d8}
.call-ctrl-btn.muted:hover{background:#3f3f46}
.call-ctrl-btn.unmuted{background:var(--surface2);color:var(--text)}
.call-ctrl-btn.unmuted:hover{background:#3f3f46}
.call-ctrl-btn svg{width:24px;height:24px;fill:currentColor}
.call-bottom{display:flex;align-items:center;justify-content:center;gap:24px;padding:32px;background:rgba(9,9,11,.8);border-top:1px solid var(--border)}
.call-end{width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(220,38,38,.3);transition:all .15s}
.call-end:hover{background:var(--red-light);transform:scale(1.05)}
.call-end:active{transform:scale(.95)}
.call-end svg{width:28px;height:28px;fill:currentColor}
.call-accept{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#10b981);color:#09090b;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(16,185,129,.3);transition:all .15s}
.call-accept:hover{transform:scale(1.05)}
.call-accept:active{transform:scale(.95)}
.call-accept svg{width:28px;height:28px;fill:currentColor}

/* Toast */
#toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:rgba(0,0,0,.85);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);animation:slideDown .3s ease;pointer-events:auto}
.toast.error{border-left:4px solid var(--red)}
.toast.success{border-left:4px solid var(--emerald)}
.toast.info{border-left:4px solid var(--amber)}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}

/* Responsive */
@media(max-width:640px){
  .sidebar{display:none}
  .features span{font-size:9px}
}

// ── TURN от Xirsys (ваш appName) ──
const XIRSYS_APP = 'f86f4918-8fb8-11f1-8821-0242ac130002';

async function getIceServers() {
  try {
    const resp = await fetch(`https://global.xirsys.net/_turn/${XIRSYS_APP}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ format: 'urls' })
    });
    if (!resp.ok) throw new Error(`Xirsys ошибка: ${resp.status}`);
    const data = await resp.json();
    return data.v.iceServers;
  } catch (e) {
    console.warn('Xirsys не доступен, используем STUN:', e);
    return [{ urls: 'stun:stun.l.google.com:19302' }];
  }
}

async function generateUniqueCode() {
  let code, exists, attempts = 0;
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  do {
    let c = ''; for (let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
    code = c;
    const { data } = await supabase.from('chat_rooms').select('id').eq('invite_code', code).maybeSingle();
    exists = !!data;
    attempts++;
  } while (exists && attempts < 20);
  if (exists) throw new Error('Не удалось сгенерировать уникальный код');
  return code;
}
function avatarColor(s) {
  const cs = ['from-amber-400 to-red-500','from-cyan-400 to-blue-500','from-emerald-400 to-teal-500','from-fuchsia-400 to-pink-500','from-rose-400 to-orange-500','from-lime-400 to-green-500','from-sky-400 to-indigo-500','from-violet-400 to-purple-500'];
  let h = 0; for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) & 0xffffffff;
  return cs[Math.abs(h) % cs.length];
}

function showToast(text, type = 'info') {

function playNotificationSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 800; osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.2);
  } catch {}
}

}

// ── Call Manager ──
class CallManager {
  constructor(me, roomId, handlers) {
    this.me = me; this.roomId = roomId; this.handlers = handlers;
    this.pending = null; this.channel = null; this.state = 'idle';
    this.signalQueue = []; this.channelReady = false;
  }
  async start() {
    this.channel = supabase.channel(`call-${this.roomId}-${this.me}`);
    this.channel.on('postgres_changes',
      { event:'INSERT', schema:'public', table:'call_signals', filter:`to_peer=eq.${this.me}` },
      (p) => this.handleSignal(p.new));
    this.channel.subscribe((s) => { if (s==='SUBSCRIBED') { this.channelReady=true; this.flushQueue(); } });
  }
  setState(s) { this.state=s; this.handlers.onStateChange(s); }
  async sendSignal(to, kind, payload) {
    const row = { room_id:this.roomId, from_peer:this.me, to_peer:to, kind, payload };
    if (this.channelReady) await supabase.from('call_signals').insert(row);
    else this.signalQueue.push({ ...row, id:'', created_at:'' });
  }
  async flushQueue() {
    if (!this.channelReady || !this.signalQueue.length) return;
    const q = this.signalQueue; this.signalQueue = [];
    for (const s of q) await supabase.from('call_signals').insert({ room_id:s.room_id, from_peer:s.from_peer, to_peer:s.to_peer, kind:s.kind, payload:s.payload });
  }
  async initiateCall(peerId, name, withVideo) {
    if (this.pending) return;
    const iceServers = await getIceServers();
    const pc = new RTCPeerConnection({ iceServers });
    let ls;
    try { ls = await navigator.mediaDevices.getUserMedia({ audio:true, video: withVideo?{width:640,height:480}:false }); }
    catch { this.handlers.onCallEnded('Нет доступа к камере/микрофону'); pc.close(); return; }
    this.handlers.onLocalStream(ls);
    this.pending = { peerId, displayName:name, isInitiator:true, withVideo, pc, localStream:ls, remoteStream:new MediaStream(), pendingCandidates:[], remoteDescriptionSet:false, callTimer:setTimeout(()=>{ if(this.pending?.isInitiator&&this.state!=='connected') this.cleanup('Нет ответа'); },45000) };
    this.setupPc(pc);
    ls.getTracks().forEach(t => pc.addTrack(t, ls));
    try {
      const offer = await pc.createOffer({ offerToReceiveAudio:true, offerToReceiveVideo:withVideo });
      await pc.setLocalDescription(offer);
      await this.sendSignal(peerId, 'offer', { sdp:offer.sdp, video:withVideo });
      this.setState('calling');
    } catch { this.cleanup('Ошибка создания вызова'); }
  }
  async handleSignal(sig) {
    const p = sig.payload;
    if (sig.from_peer === this.me) return;
    if (sig.kind === 'offer') {
      if (this.pending) { await this.sendSignal(sig.from_peer,'reject',{reason:'busy'}); return; }
      const withVideo = !!p.video;
      const iceServers = await getIceServers();
      const pc = new RTCPeerConnection({ iceServers });
      this.pending = { peerId:sig.from_peer, displayName:'Участник', isInitiator:false, withVideo, pc, localStream:null, remoteStream:new MediaStream(), pendingCandidates:[], remoteDescriptionSet:false, offerSdp:p.sdp, callTimer:null };
      this.setupPc(pc);
      window.dispatchEvent(new CustomEvent('incoming-call',{ detail:{ from:sig.from_peer, video:withVideo } }));
      this.setState('ringing'); return;
    }
    if (!this.pending || this.pending.peerId !== sig.from_peer) return;
    const pc = this.pending.pc;
    if (sig.kind === 'reject') { this.cleanup('Звонок отклонён'); return; }
    if (sig.kind === 'hangup') { this.cleanup('Собеседник завершил звонок'); return; }
    if (sig.kind === 'answer') {
      try { await pc.setRemoteDescription({ type:'answer', sdp:p.sdp }); this.pending.remoteDescriptionSet=true; await this.flushCandidates(); if(this.pending.callTimer){clearTimeout(this.pending.callTimer);this.pending.callTimer=null;} }
      catch { this.cleanup('Ошибка подключения'); }
      return;
    }
    if (sig.kind === 'ice') {
      const c = { candidate:p.candidate, sdpMid:p.sdpMid??null, sdpMLineIndex:p.sdpMLineIndex??null };
      if (this.pending.remoteDescriptionSet) { try { await pc.addIceCandidate(c); } catch {} }
      else this.pending.pendingCandidates.push(c);
    }
  }
  async flushCandidates() {
    if (!this.pending) return;
    const cs = this.pending.pendingCandidates; this.pending.pendingCandidates = [];
    for (const c of cs) { try { await this.pending.pc.addIceCandidate(c); } catch {} }
  }
  setupPc(pc) {
    let dt = null;
    pc.onicecandidate = (e) => { if (e.candidate && this.pending) this.sendSignal(this.pending.peerId,'ice',{ candidate:e.candidate.candidate, sdpMid:e.candidate.sdpMid, sdpMLineIndex:e.candidate.sdpMLineIndex }); };
    pc.ontrack = (e) => { if (this.pending) { this.pending.remoteStream.addTrack(e.track); this.handlers.onRemoteStream(this.pending.remoteStream); } };
    pc.oniceconnectionstatechange = () => {
      const s = pc.iceConnectionState;
      if (s==='connected'||s==='completed') { if(dt){clearTimeout(dt);dt=null;} if(this.state!=='connected') this.setState('connected'); }
      else if (s==='disconnected') { if(!dt) dt=setTimeout(()=>{ if(this.pending&&pc.iceConnectionState==='disconnected') this.cleanup('Соединение потеряно'); },10000); }
      else if (s==='failed') { if(dt){clearTimeout(dt);dt=null;} this.cleanup('Соединение потеряно'); }
    };
    pc.onconnectionstatechange = () => { if (pc.connectionState==='failed') this.cleanup('Соединение потеряно'); };
  }
  async acceptCall(withVideo) {
    if (!this.pending || this.pending.isInitiator) return;
    this.pending.withVideo = withVideo;
    const pc = this.pending.pc;
    try {
      const s = await navigator.mediaDevices.getUserMedia({ audio:true, video: withVideo?{width:640,height:480}:false });
      this.pending.localStream = s; this.handlers.onLocalStream(s);
      s.getTracks().forEach(t => pc.addTrack(t, s));
      if (this.pending.offerSdp) { await pc.setRemoteDescription({ type:'offer', sdp:this.pending.offerSdp }); this.pending.remoteDescriptionSet=true; }
      const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
      await this.sendSignal(this.pending.peerId, 'answer', { sdp:ans.sdp });
      await this.flushCandidates();
    } catch { this.cleanup('Нет доступа к камере/микрофону'); }
  }
  rejectCall() { if (this.pending && !this.pending.isInitiator) this.sendSignal(this.pending.peerId,'reject',{reason:'declined'}); this.cleanup('Звонок отклонён'); }
  endCall() { if (this.pending) this.sendSignal(this.pending.peerId,'hangup',{}); this.cleanup('Звонок завершён'); }
  cleanup(reason) {
    if (this.pending) { if(this.pending.callTimer) clearTimeout(this.pending.callTimer); this.pending.pc.close(); this.pending.localStream?.getTracks().forEach(t=>t.stop()); this.pending.remoteStream.getTracks().forEach(t=>t.stop()); this.pending=null; }
    this.setState('idle'); this.handlers.onCallEnded(reason);
  }
  stop() { this.endCall(); if (this.channel) { supabase.removeChannel(this.channel); this.channel=null; } }
}

async function enterChat(name, inviteCode, password) {
  let room = null;
  if (inviteCode) {
    const { data } = await supabase.from('chat_rooms').select('*').eq('invite_code', inviteCode).maybeSingle();
    room = data;
    if (!room) {
      showToast('Комната не найдена, создаём новую', 'info');
      const newCode = await generateUniqueCode();
      const { data: created } = await supabase.from('chat_rooms').insert({ name:`Чат ${newCode}`, invite_code:newCode, is_private:!!password, password_hash:password || null }).select('*').single();
      room = created;
    }
  } else {
    const code = await generateUniqueCode();
    const { data } = await supabase.from('chat_rooms').insert({ name:`Чат ${code}`, invite_code:code, is_private:!!password, password_hash:password || null }).select('*').single();
    room = data;
  }
  if (room) {
    currentRoom = room; displayName = name;
    sessionStorage.setItem('ssha_session', JSON.stringify({ room, displayName:name }));
    renderChat();
    initChat();
  } else {
    showToast('Не удалось создать/найти комнату', 'error');
  }
}

async function loadMessages(force = false) {
  if (isLoading || (!hasMore && !force)) return;
  isLoading = true;
  try {
    const { data, error } = await supabase
      .from('chat_messages')
      .select('*')
      .eq('room_id', currentRoom.id)
      .order('created_at', { ascending: false })
      .range(offset, offset + LIMIT - 1);
    if (error) throw error;
    if (data.length < LIMIT) hasMore = false;
    const newMsgs = data.reverse();
    if (force) { messages = newMsgs; } else { messages = [...newMsgs, ...messages]; }
    offset += data.length;
    renderMessages();
  } catch (e) {
    showToast('Ошибка загрузки сообщений: ' + e.message, 'error');
  } finally {
    isLoading = false;
  }
}

function leaveChat() {
  channels.forEach(c => supabase.removeChannel(c));
  channels = [];
  if (callManager) { callManager.stop(); callManager = null; }
  supabase.from('chat_participants').delete().eq('room_id', currentRoom.id).eq('peer_id', me);
  supabase.from('typing_indicators').delete().eq('room_id', currentRoom.id).eq('peer_id', me);
  sessionStorage.removeItem('ssha_session');
  currentRoom = null; displayName = ''; messages = []; participants = [];
  renderWelcome();
}

async function initChat() {
  await updateParticipants();
  const hb = setInterval(async () => {
    const { data } = await supabase.from('chat_participants').select('id').eq('room_id', currentRoom.id).eq('peer_id', me).maybeSingle();
    if (data) await supabase.from('chat_participants').update({ last_seen:new Date().toISOString() }).eq('id', data.id);
    else await supabase.from('chat_participants').insert({ room_id:currentRoom.id, display_name:displayName, peer_id:me });
  }, 15000);
  const onUnload = () => {
    supabase.from('chat_participants').delete().eq('room_id', currentRoom.id).eq('peer_id', me);
  };
  window.addEventListener('beforeunload', onUnload);

  const msgCh = supabase.channel(`msg-${currentRoom.id}-${me}`).on('postgres_changes',
    { event:'INSERT', schema:'public', table:'chat_messages', filter:`room_id=eq.${currentRoom.id}` },
    (p) => {
      const m = p.new;
      if (!messages.find(x=>x.id===m.id)) {
        messages.push(m);
        renderMessages();
        if (document.hidden) playNotificationSound();
      }
    }
  ).subscribe();
  channels.push(msgCh);

  const partCh = supabase.channel(`part-${currentRoom.id}-${me}`)
    .on('postgres_changes',{ event:'INSERT', schema:'public', table:'chat_participants', filter:`room_id=eq.${currentRoom.id}` }, updateParticipants)
    .on('postgres_changes',{ event:'DELETE', schema:'public', table:'chat_participants', filter:`room_id=eq.${currentRoom.id}` }, updateParticipants)
    .on('postgres_changes',{ event:'UPDATE', schema:'public', table:'chat_participants', filter:`room_id=eq.${currentRoom.id}` }, updateParticipants)
    .subscribe();
  channels.push(partCh);

  const typingCh = supabase.channel(`typing-${currentRoom.id}`)
    .on('postgres_changes', { event:'*', schema:'public', table:'typing_indicators', filter:`room_id=eq.${currentRoom.id}` }, (p) => {
      const event = p.eventType;
      const newRow = p.new;
      if (event === 'INSERT' || event === 'UPDATE') {
        if (newRow.peer_id !== me) {
          typingPeers[newRow.peer_id] = newRow.display_name;
          updateTypingIndicator();
        }
      } else if (event === 'DELETE') {
        const old = p.old;
        if (old && old.peer_id !== me) {
          delete typingPeers[old.peer_id];
          updateTypingIndicator();
        }
      }
    }).subscribe();
  channels.push(typingCh);

  callManager = new CallManager(me, currentRoom.id, {
    onRemoteStream: (s) => { remoteStream = s; renderCall(); },
    onLocalStream: (s) => { localStream = s; renderCall(); },
    onCallEnded: (reason) => { callState='idle'; callPeer=null; localStream=null; remoteStream=null; clearCallTimer(); renderCall(); if(reason) showToast(reason, 'info'); },
    onStateChange: (st) => { callState = st; if (st==='connected') startCallTimer(); renderCall(); },
  });
  callManager.start();
  window.addEventListener('incoming-call', onIncomingCall);
}

async function updateParticipants() {
  const { data } = await supabase.from('chat_participants').select('*').eq('room_id', currentRoom.id).order('created_at',{ascending:true});
  participants = data || [];
  renderParticipants();
}

function updateTypingIndicator() {
  const el = document.getElementById('typing-indicator');
  if (!el) return;
  const names = Object.values(typingPeers);
  if (names.length === 0) {
    el.classList.add('hidden');
    el.textContent = '';
  } else {
    el.classList.remove('hidden');
    el.textContent = names.join(', ') + (names.length === 1 ? ' печатает...' : ' печатают...');
  }
}

async function sendText() {
  const input = document.getElementById('msg-input');

function renderMessages() {
  const el = document.getElementById('messages');
  if (!el) return;
  if (!messages.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">${IC.send}</div><div class="empty-text">Нет сообщений. Напишите первым!</div><div class="empty-code">Код приглашения: <span>${escapeHtml(currentRoom.invite_code)}</span></div></div>`;
    return;
  }
  let html = '';
  if (hasMore) {
    html += `<div class="load-more" id="load-more">Загрузить ещё</div>`;
  }
  html += messages.map(msg => {
    const mine = msg.peer_id === me;
    const time = fmtTimeStr(msg.created_at);
    let contentHtml = '';
    if (msg.kind === 'image') {
      contentHtml = `<div class="msg-image"><img src="${escapeHtml(msg.content)}" alt="Фото" onclick="window.open('${escapeHtml(msg.content)}','_blank')" onerror="this.parentElement.innerHTML='<div class=\\'img-error\\'>${IC.alert}<span>Не удалось загрузить</span></div>'"></div>`;
    } else if (msg.kind === 'audio') {
      contentHtml = `<div class="msg-audio"><audio src="${escapeHtml(msg.content)}" controls></audio></div>`;
    } else {
      contentHtml = `<div class="msg-bubble">${escapeHtml(msg.content)}</div>`;
    }
    return `<div class="msg ${mine?'mine':'other'}">
      <div class="msg-content">
        ${!mine?`<span class="msg-name">${escapeHtml(msg.display_name)}</span>`:''}
        ${contentHtml}
        <span class="msg-time">${time}</span>
        ${mine ? `<button class="msg-delete" data-id="${msg.id}">${IC.trash}</button>` : ''}
      </div>
    </div>`;
  }).join('');
  el.innerHTML = html;
  el.querySelectorAll('.msg-delete').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      try {
        const { error } = await supabase.from('chat_messages').delete().eq('id', id).eq('peer_id', me);
        if (error) throw error;
        messages = messages.filter(m => m.id !== id);
        renderMessages();
        showToast('Сообщение удалено', 'success');
      } catch (e) { showToast('Не удалось удалить: ' + e.message, 'error'); }
    };
  });
  const loadMoreBtn = document.getElementById('load-more');
  if (loadMoreBtn) loadMoreBtn.onclick = () => loadMessages(false);
  el.scrollTop = el.scrollHeight;
}

function renderParticipants() {
  const others = participants.filter(p => p.peer_id !== me);
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  if (statusDot) { statusDot.className = `status-dot ${others.length>0?'online':'offline'}`; }
  if (statusText) statusText.textContent = others.length>0 ? `${others.length} в сети` : 'Один в чате';

}

    document.getElementById('rec-cancel').onclick = cancelRecording;

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const mr = new MediaRecorder(stream);
    const chunks = [];
    mr.ondataavailable = (e) => { if (e.data.size>0) chunks.push(e.data); };
    mr.onstop = () => {
      const blob = new Blob(chunks, { type:'audio/webm' });
      previewUrl = URL.createObjectURL(blob);
      renderAudioRecorder();
      stream.getTracks().forEach(t=>t.stop());
    };
    mr.start();
    recording = { mr, stream, seconds:0, start:Date.now(), chunks };
    const timer = setInterval(() => { recording.seconds = Math.floor((Date.now()-recording.start)/1000); const t=document.querySelector('.rec-time'); if(t) t.textContent=fmtTime(recording.seconds); }, 250);
    recording.timer = timer;
    renderAudioRecorder();
  } catch {}
}
function stopRecording() {
  if (recording?.mr && recording.mr.state !== 'inactive') recording.mr.stop();
  if (recording?.timer) clearInterval(recording.timer);
  recording = recording ? { ...recording, mr:null, stream:null } : null;
  renderAudioRecorder();
}
function cancelRecording() {
  if (recording?.mr && recording.mr.state !== 'inactive') recording.mr.stop();
  if (recording?.stream) recording.stream.getTracks().forEach(t=>t.stop());
  if (recording?.timer) clearInterval(recording.timer);
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  recording = null; previewUrl = null;
  renderAudioRecorder();
}
async function sendRecording() {
  if (!previewUrl) return;
  try {
    const blob = await (await fetch(previewUrl)).blob();
    const reader = new FileReader();
    reader.onloadend = async () => {
      await supabase.from('chat_messages').insert({ room_id:currentRoom.id, peer_id:me, display_name:displayName, kind:'audio', content:reader.result });
      cancelRecording();
    };
    reader.readAsDataURL(blob);
  } catch { cancelRecording(); }
}

// ── Изображения ──
async function handleImageUpload(e) {
  const file = e.target.files?.[0]; e.target.value='';
  if (!file || !file.type.startsWith('image/')) return;
  uploading = true;
  const imgBtn = document.getElementById('img-btn');
  imgBtn.innerHTML = `<div class="spinner" style="width:22px;height:22px;border-width:2px"></div>`;
  try {
    const path = `${currentRoom.id}/${me}-${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.]/g,'_')}`;
    const { error } = await supabase.storage.from('chat-media').upload(path, file);
    if (!error) {
      const { data } = supabase.storage.from('chat-media').getPublicUrl(path);
      await supabase.from('chat_messages').insert({ room_id:currentRoom.id, peer_id:me, display_name:displayName, kind:'image', content:data.publicUrl });
    } else if (file.size <= 4000000) {
      const reader = new FileReader();
      reader.onloadend = async () => {
        await supabase.from('chat_messages').insert({ room_id:currentRoom.id, peer_id:me, display_name:displayName, kind:'image', content:reader.result });
      };
      reader.readAsDataURL(file);
    }
  } finally {
    uploading = false;
    imgBtn.innerHTML = IC.img;
  }
}

// ── Приглашение ──
function showInvite() {
  const area = document.getElementById('modal-area');
  const url = `${window.location.origin}${window.location.pathname}?join=${currentRoom.invite_code}`;
  let copied = false;
  area.innerHTML = `
    <div class="overlay" id="invite-overlay">
      <div class="modal" id="invite-modal">
        <div class="modal-head">
          <div class="modal-title-wrap"><div class="modal-icon">${IC.link}</div><div><div class="modal-title">Пригласить друзей</div><div class="modal-sub">${participants.length} в чате</div></div></div>
          <button class="modal-close" id="invite-close">${IC.x}</button>
        </div>
        <label class="modal-label">Код приглашения</label>
        <button class="code-display" id="code-copy"><span class="code">${currentRoom.invite_code}</span>${IC.copy}</button>
        <p class="code-hint">Нажмите на код, чтобы скопировать</p>
        <div style="margin-top:16px"></div>
        <label class="modal-label">Ссылка</label>
        <div class="link-row"><input class="link-input" id="link-input" value="${url}" readonly><button class="link-copy" id="link-copy">${IC.copy}</button></div>
        <button class="btn-share" id="share-btn">${IC.share} Поделиться</button>
        <div class="modal-foot">${IC.users}<span>Друзья введут код на стартовом экране</span></div>
      </div>
    </div>`;
  const close = () => area.innerHTML = '';
  document.getElementById('invite-overlay').onclick = (e) => { if (e.target.id==='invite-overlay') close(); };
  document.getElementById('invite-close').onclick = close;
  const copyText = (text) => { navigator.clipboard.writeText(text); document.querySelector('.code-display').innerHTML = `<span class="code">${currentRoom.invite_code}</span><span class="check">${IC.check}</span>`; setTimeout(close, 1500); };
  document.getElementById('code-copy').onclick = () => copyText(currentRoom.invite_code);
  document.getElementById('link-copy').onclick = () => { navigator.clipboard.writeText(url); document.getElementById('link-copy').innerHTML = `<span class="check">${IC.check}</span>`; };
  document.getElementById('share-btn').onclick = async () => {
    if (navigator.share) { try { await navigator.share({ title:`Чат: ${currentRoom.name}`, text:'Присоединяйся к моему чату', url }); } catch {} }
    else { navigator.clipboard.writeText(url); close(); }
  };
}

// ── Вызовы ──
function startCall(withVideo) {
  const others = participants.filter(p => p.peer_id !== me);
  if (!others.length) return;
  const target = others[0];
  callPeer = { id:target.peer_id, name:target.display_name };
  callWithVideo = withVideo; callIsInitiator = true;
  callManager.initiateCall(target.peer_id, target.display_name, withVideo);
}
function onIncomingCall(e) {
  const d = e.detail;
  incomingCall = { from:d.from, video:d.video };
  callPeer = { id:d.from, name:'Входящий звонок' };
  callWithVideo = d.video;
  callIsInitiator = false;
  callState = 'ringing';
  renderCall();
}
function acceptCall() { incomingCall = null; callManager.acceptCall(callWithVideo); }
function rejectCall() { incomingCall = null; callManager.rejectCall(); }
function endCall() { callManager.endCall(); }
function toggleMute() { muted = !muted; localStream?.getAudioTracks().forEach(t => t.enabled = !muted); renderCall(); }
function toggleVideo() { videoOff = !videoOff; localStream?.getVideoTracks().forEach(t => t.enabled = !videoOff); renderCall(); }
function startCallTimer() {
  clearCallTimer();
  const start = Date.now();
  callTimer = setInterval(() => { callSeconds = Math.floor((Date.now()-start)/1000); const el = document.querySelector('.call-status-text'); if (el) el.textContent = fmtTime(callSeconds); }, 500);
}
function clearCallTimer() { if (callTimer) { clearInterval(callTimer); callTimer = null; } callSeconds = 0; }
function renderCall() {
  const area = document.getElementById('call-area');
  if (!area) return;
  if (callState === 'idle') { area.innerHTML = ''; return; }
  const isRinging = callState === 'ringing' && !callIsInitiator;
  const isCalling = callState === 'calling' && callIsInitiator;
  const statusText = callState==='connected' ? fmtTime(callSeconds) : isCalling ? 'Вызов...' : isRinging ? 'Входящий звонок...' : '';
  const showControls = callState === 'connected';
  let html = `<div class="call-modal">`;
  html += `<audio id="remote-audio" autoplay class="hidden"></audio>`;
  if (callWithVideo && callState === 'connected') {
    html += `<div class="call-video-area"><video id="remote-video" autoplay class="call-remote-video"></video><div class="call-local-video"><video id="local-video" autoplay muted></video></div>${videoOff?`<div class="call-video-off">${IC.videoOff}</div>`:''}</div>`;
  } else {
    html += `<div class="call-info"><div class="call-avatar">${(isRinging||isCalling)?'<div class="call-avatar-ring"></div><div class="call-avatar-ring2"></div>':''}<div class="call-avatar-inner">${callWithVideo?IC.video:IC.phone}</div></div><div><div class="call-name">${callPeer?.name||'Собеседник'}</div><div class="call-status-text">${statusText}</div></div>${showControls?`<div class="call-controls"><button class="call-ctrl-btn ${muted?'muted':'unmuted'}" id="mute-btn">${muted?IC.micOff:IC.mic}</button>${callWithVideo?`<button class="call-ctrl-btn ${videoOff?'muted':'unmuted'}" id="vid-btn">${videoOff?IC.videoOff:IC.video}</button>`:''}</div>`:''}</div>`;
  }
  html += `<div class="call-bottom">`;
  if (isRinging) {
    html += `<button class="call-end" id="reject-btn">${IC.phoneOff}</button><button class="call-accept" id="accept-btn">${IC.userCheck}</button>`;
  } else {
    html += `<button class="call-end" id="end-btn">${IC.phoneOff}</button>`;
  }
  html += `</div></div>`;
  area.innerHTML = html;
  const ra = document.getElementById('remote-audio');
  const rv = document.getElementById('remote-video');
  const lv = document.getElementById('local-video');
  if (ra && remoteStream) { ra.srcObject = remoteStream; ra.volume = 1.0; ra.setSinkId?.('default'); ra.play().catch(()=>{}); }
  if (rv && remoteStream) rv.srcObject = remoteStream;
  if (lv && localStream) lv.srcObject = localStream;
  const acceptBtn = document.getElementById('accept-btn');
  const rejectBtn = document.getElementById('reject-btn');
  const endBtn = document.getElementById('end-btn');
  const muteBtn = document.getElementById('mute-btn');
  const vidBtn = document.getElementById('vid-btn');
  if (acceptBtn) acceptBtn.onclick = acceptCall;
  if (rejectBtn) rejectBtn.onclick = rejectCall;
  if (endBtn) endBtn.onclick = endCall;
  if (muteBtn) muteBtn.onclick = toggleMute;
  if (vidBtn) vidBtn.onclick = toggleVideo;
}

// ── Инициализация ──
async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) { /* авторизован */ }
  const params = new URLSearchParams(window.location.search);
  const joinCode = params.get('join');
  if (joinCode) {
    const url = new URL(window.location.href);
    url.searchParams.delete('join');
    window.history.replaceState({}, '', url.toString());
  }
  const sessionChat = sessionStorage.getItem('ssha_session');
  if (sessionChat) {
    try {
      const parsed = JSON.parse(sessionChat);
      if (parsed.room?.id && parsed.displayName) {
        currentRoom = parsed.room; displayName = parsed.displayName;
        renderChat(); initChat();
        return;
      }
    } catch {}
  }
  renderWelcome();
  if (joinCode) {
    setTimeout(() => {
      document.getElementById('tab-join')?.click();
      const ci = document.getElementById('code-input');
      if (ci) ci.value = joinCode.toUpperCase();
    }, 100);
  }
}

window.onerror = (msg) => { showToast('Ошибка: ' + msg, 'error'); return true; };
window.addEventListener('unhandledrejection', (e) => {
  showToast('Ошибка: ' + (e.reason?.message || 'Неизвестная ошибка'), 'error');
});

init();
</script>
