<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chat App</title>
  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <!-- simple-peer -->
  <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
  <style>
    :root {
      --bg-body: #0f172a;
      --bg-app: #1e293b;
      --bg-messages: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --msg-sent: #2563eb;
      --msg-sent-text: #ffffff;
      --msg-received: #334155;
      --msg-received-text: #f8fafc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #app {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 800px;
      background: var(--bg-app);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }
    #home {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      text-align: center;
    }
    #home h1 { font-size: 2rem; margin-bottom: 10px; }
    #home p { color: var(--text-muted); margin-bottom: 25px; font-size: 0.95rem; }
    
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover { background: var(--primary-hover); }

    #chat { display: none; flex-direction: column; height: 100%; }
    #header {
      padding: 12px 16px;
      background: var(--bg-app);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    #header h2 { font-size: 1rem; font-weight: 600; }
    #header-actions { display: flex; gap: 6px; align-items: center; }
    #header-actions button {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: var(--text-main);
    }
    #header-actions button:hover { background: var(--border-color); }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg-messages);
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      word-wrap: break-word;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .msg-sent {
      align-self: flex-end;
      background: var(--msg-sent);
      color: var(--msg-sent-text);
      border-bottom-right-radius: 4px;
    }
    .msg-received {
      align-self: flex-start;
      background: var(--msg-received);
      color: var(--msg-received-text);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }
    .msg-name { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
    .msg-sent .msg-name { color: #bfdbfe; }
    .msg-time { font-size: 0.65rem; opacity: 0.7; margin-top: 4px; text-align: right; }
    .msg-audio audio { max-width: 200px; height: 36px; }

    .msg-video-note video {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      background: #000;
      border: 2px solid var(--primary);
      display: block;
    }

    #emoji-picker {
      display: none;
      padding: 8px;
      background: var(--bg-app);
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 8px;
      max-height: 110px;
      overflow-y: auto;
    }
    #emoji-picker span { font-size: 1.3rem; cursor: pointer; padding: 4px; }

    #input-area {
      padding: 10px 12px;
      background: var(--bg-app);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    #input-area input {
      flex: 1;
      border: 1px solid var(--border-color);
      background: var(--bg-body);
      color: var(--text-main);
      border-radius: 24px;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
    }
    .icon-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      color: var(--text-main);
    }
    #sendBtn {
      background: var(--primary);
      border: none;
      color: white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    #video-note-preview-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 20;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #video-note-preview {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--primary);
      margin-bottom: 15px;
      background: #000;
    }

    /* Звонки */
    #call-container {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }
    #call-container video {
      width: 100%; max-width: 360px;
      background: #1e293b;
      border-radius: 12px;
    }
    #call-controls button {
      background: #ef4444; border: none; color: white;
      border-radius: 50%; width: 56px; height: 56px;
      font-size: 1.4rem; cursor: pointer; margin-top: 20px;
    }
    .call-info { color: white; font-size: 1.1rem; margin-bottom: 15px; font-weight: 600; }

    /* Окно входящего звонка */
    #incoming-call-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 40;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .call-modal-box {
      background: var(--bg-app);
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid var(--border-color);
    }
    .call-modal-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 20px;
    }
    .btn-accept { background: #22c55e; color: white; }
    .btn-reject { background: #ef4444; color: white; }
  </style>
</head>
<body>
<div id="app">
  <div id="home">
    <h1>💬 Quick Chat</h1>
    <p>Быстрые комнаты и онлайн-звонки</p>
    <button class="btn" id="createRoomBtn">➕ Создать комнату</button>
  </div>

  <div id="chat">
    <div id="header">
      <h2 id="roomTitle">Комната</h2>
      <div id="header-actions">
        <button id="copyLinkBtn" title="Скопировать ссылку">🔗</button>
        <button id="audioCallBtn" title="Аудиозвонок">📞</button>
        <button id="videoCallBtn" title="Видеозвонок">📹</button>
        <button id="leaveRoomBtn" title="Выйти">✕</button>
      </div>
    </div>
    <div id="messages"></div>

    <div id="emoji-picker">
      <span>😀</span><span>😂</span><span>😍</span><span>👍</span><span>❤️</span>
      <span>🔥</span><span>🎉</span><span>😎</span><span>🙏</span><span>💩</span>
      <span>🙈</span><span>🚀</span><span>🤔</span><span>😊</span><span>👋</span>
    </div>

    <div id="input-area">
      <button class="icon-btn" id="emojiBtn">😀</button>
      <button class="icon-btn" id="recordBtn" title="Голосовое сообщение">🎤</button>
      <button class="icon-btn" id="videoNoteBtn" title="Видеокружок">📹</button>
      <input id="msgInput" placeholder="Сообщение..." autocomplete="off">
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <div id="video-note-preview-modal">
    <video id="video-note-preview" autoplay playsinline muted></video>
    <div id="videoNoteTimer" style="color:white; font-size:1.2rem; margin-bottom:15px; font-weight:600;">00:15</div>
    <button class="btn" id="stopVideoNoteBtn" style="background:#ef4444;">⏹ Отправить кружок</button>
  </div>

  <div id="call-container">
    <div class="call-info" id="callInfo">Звонок...</div>
    <video id="remoteVideo" autoplay playsinline style="width:90%; height:auto; max-height:50vh;"></video>
    <video id="localVideo" autoplay playsinline muted style="width:100px; position:absolute; bottom:90px; right:20px; border-radius:10px; background:#1e293b;"></video>
    <audio id="remoteAudio" autoplay></audio>
    <div id="call-controls">
      <button id="hangupBtn">📴</button>
    </div>
  </div>

  <div id="incoming-call-modal">
    <div class="call-modal-box">
      <h3 id="incomingCallText" style="margin-bottom:10px;">Входящий звонок</h3>
      <div class="call-modal-actions">
        <button class="btn btn-accept" id="acceptCallBtn">📞 Ответить</button>
        <button class="btn btn-reject" id="rejectCallBtn">📴 Отклонить</button>
      </div>
    </div>
  </div>
</div>

<script>
window.global = window;

// ============================ FIREBASE CONFIG ============================
const firebaseConfig = {
  apiKey: "AIzaSyDYRkGlyl5ySs4AyCuJEM39M-4FPok9sKA",
  authDomain: "chatt-6d410.firebaseapp.com",
  projectId: "chatt-6d410",
  storageBucket: "chatt-6d410.firebasestorage.app",
  messagingSenderId: "901741126959",
  appId: "1:901741126959:web:97734153fa537a5ab16dda"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

// ============================ СОСТОЯНИЯ ЧАТА ============================
let roomId = '';
let myName = '';
let myUserId = '';

let roomRef = null;
let messagesRef = null;
let participantsRef = null;
let signalRef = null;

let unsubscribeMessages = null;
let unsubscribeParticipants = null;
let unsubscribeSignals = null;

const processedMsgIds = new Set();
let participants = {};

let peer = null;
let localStream = null;
let isCallActive = false;
let pendingCallData = null;

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

let videoNoteRecorder = null;
let videoNoteChunks = [];
let videoNoteStream = null;
let videoNoteTimerInterval = null;
let videoNoteSecondsLeft = 15;

// DOM
const home = document.getElementById('home');
const chat = document.getElementById('chat');
const messagesDiv = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const createRoomBtn = document.getElementById('createRoomBtn');
const roomTitle = document.getElementById('roomTitle');
const leaveRoomBtn = document.getElementById('leaveRoomBtn');
const audioCallBtn = document.getElementById('audioCallBtn');
const videoCallBtn = document.getElementById('videoCallBtn');
const recordBtn = document.getElementById('recordBtn');
const videoNoteBtn = document.getElementById('videoNoteBtn');
const emojiBtn = document.getElementById('emojiBtn');
const emojiPicker = document.getElementById('emoji-picker');
const copyLinkBtn = document.getElementById('copyLinkBtn');

const callContainer = document.getElementById('call-container');
const remoteVideo = document.getElementById('remoteVideo');
const localVideo = document.getElementById('localVideo');
const remoteAudio = document.getElementById('remoteAudio');
const hangupBtn = document.getElementById('hangupBtn');
const callInfo = document.getElementById('callInfo');

const incomingCallModal = document.getElementById('incoming-call-modal');
const incomingCallText = document.getElementById('incomingCallText');
const acceptCallBtn = document.getElementById('acceptCallBtn');
const rejectCallBtn = document.getElementById('rejectCallBtn');

const videoNoteModal = document.getElementById('video-note-preview-modal');
const videoNotePreview = document.getElementById('video-note-preview');
const videoNoteTimer = document.getElementById('videoNoteTimer');
const stopVideoNoteBtn = document.getElementById('stopVideoNoteBtn');

// ============================ ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ============================
function generateRandomName() {
  const adjs = ['Быстрый', 'Тихий', 'Умный', 'Сильный', 'Весёлый', 'Смелый'];
  const nouns = ['Лис', 'Волк', 'Заяц', 'Сокол', 'Дельфин', 'Тигр'];
  return adjs[Math.floor(Math.random() * adjs.length)] + ' ' + nouns[Math.floor(Math.random() * nouns.length)];
}

function generateUserId() {
  return 'usr_' + Math.random().toString(36).substring(2, 9);
}

function formatTime(timestamp) {
  if (!timestamp) return '';
  const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

// ============================ ВХОД И ВЫХОД ============================
async function enterRoom(roomIdParam) {
  roomId = roomIdParam;
  myUserId = generateUserId();
  myName = generateRandomName();

  roomRef = db.collection('rooms').doc(roomId);
  messagesRef = roomRef.collection('messages');
  participantsRef = roomRef.collection('participants');
  signalRef = roomRef.collection('signals');

  await participantsRef.doc(myUserId).set({
    name: myName,
    joinedAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  unsubscribeParticipants = participantsRef.onSnapshot(snapshot => {
    participants = {};
    snapshot.forEach(doc => {
      participants[doc.id] = doc.data();
    });
    const count = Object.keys(participants).length;
    roomTitle.textContent = `Комната (${count})`;
  });

  unsubscribeMessages = messagesRef.orderBy('createdAt', 'asc').onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === 'added') {
        const msgDoc = change.doc;
        if (!processedMsgIds.has(msgDoc.id)) {
          processedMsgIds.add(msgDoc.id);
          renderSingleMessage(msgDoc.id, msgDoc.data());
        }
      }
    });
  });

  unsubscribeSignals = signalRef.where('target', '==', myUserId).onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === 'added') {
        const data = change.doc.data();
        change.doc.ref.delete().catch(() => {});
        handleIncomingSignal(data);
      }
    });
  });

  window.location.hash = `${roomId}`;

  home.style.display = 'none';
  chat.style.display = 'flex';
  msgInput.focus();
}

window.addEventListener('beforeunload', () => {
  if (participantsRef && myUserId) {
    participantsRef.doc(myUserId).delete();
  }
});

function leaveRoom() {
  if (participantsRef && myUserId) {
    participantsRef.doc(myUserId).delete().catch(() => {});
  }
  if (unsubscribeMessages) unsubscribeMessages();
  if (unsubscribeParticipants) unsubscribeParticipants();
  if (unsubscribeSignals) unsubscribeSignals();

  processedMsgIds.clear();
  participants = {};
  roomId = '';
  myUserId = '';

  hangupCall();

  home.style.display = 'flex';
  chat.style.display = 'none';
  window.location.hash = '';
}

leaveRoomBtn.addEventListener('click', leaveRoom);

createRoomBtn.addEventListener('click', () => {
  const newRoomId = Math.random().toString(36).substring(2, 8);
  enterRoom(newRoomId);
});

copyLinkBtn.addEventListener('click', () => {
  const fullLink = `${window.location.origin}${window.location.pathname}#${roomId}`;
  navigator.clipboard.writeText(fullLink);
  alert('Ссылка на комнату скопирована!');
});

// ============================ ОТРИСОВКА СООБЩЕНИЙ ============================
function renderSingleMessage(id, msg) {
  const isOwn = msg.senderId === myUserId;
  const div = document.createElement('div');
  div.className = `msg ${isOwn ? 'msg-sent' : 'msg-received'}`;

  const nameSpan = document.createElement('div');
  nameSpan.className = 'msg-name';
  nameSpan.textContent = isOwn ? 'Вы' : (msg.senderName || 'Участник');
  div.appendChild(nameSpan);

  const content = msg.content || '';

  if (msg.type === 'audio') {
    const audioContainer = document.createElement('div');
    audioContainer.className = 'msg-audio';
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.src = content;
    audioContainer.appendChild(audio);
    div.appendChild(audioContainer);
  } else if (msg.type === 'videoNote') {
    const videoContainer = document.createElement('div');
    videoContainer.className = 'msg-video-note';
    const video = document.createElement('video');
    video.controls = true;
    video.playsInline = true;
    video.src = content;
    videoContainer.appendChild(video);
    div.appendChild(videoContainer);
  } else {
    const textSpan = document.createElement('div');
    textSpan.textContent = content;
    div.appendChild(textSpan);
  }

  const timeSpan = document.createElement('div');
  timeSpan.className = 'msg-time';
  timeSpan.textContent = formatTime(msg.createdAt);
  div.appendChild(timeSpan);

  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// ============================ ОТПРАВКА СООБЩЕНИЙ ============================
async function sendTextMessage(text) {
  if (!text.trim() || !roomId) return;

  await messagesRef.add({
    senderId: myUserId,
    senderName: myName,
    content: text,
    type: 'text',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  msgInput.value = '';
  emojiPicker.style.display = 'none';
  msgInput.focus();
}

async function sendMediaMessage(base64Data, type) {
  if (!roomId) return;

  await messagesRef.add({
    senderId: myUserId,
    senderName: myName,
    content: base64Data,
    type: type,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

sendBtn.addEventListener('click', () => sendTextMessage(msgInput.value));
msgInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendTextMessage(msgInput.value); });

emojiBtn.addEventListener('click', () => {
  emojiPicker.style.display = emojiPicker.style.display === 'flex' ? 'none' : 'flex';
});
emojiPicker.addEventListener('click', e => {
  if (e.target.tagName === 'SPAN') {
    msgInput.value += e.target.textContent;
    msgInput.focus();
  }
});

// ============================ ГОЛОСОВЫЕ СООБЩЕНИЯ ============================
recordBtn.addEventListener('click', async () => {
  if (isRecording) {
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    isRecording = false;
    recordBtn.textContent = '🎤';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onload = () => sendMediaMessage(reader.result, 'audio');
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start();
    isRecording = true;
    recordBtn.textContent = '⏹️';
  } catch (e) {
    alert('Микрофон недоступен');
  }
});

// ============================ ВИДЕО КРУЖКИ ============================
async function startVideoNoteRecording() {
  closeVideoNoteModal();

  try {
    videoNoteStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: { width: 240, height: 240, frameRate: 15 }
    });
  } catch (e) {
    alert('Не удалось запустить камеру/микрофон.');
    return;
  }

  videoNotePreview.srcObject = videoNoteStream;
  videoNoteModal.style.display = 'flex';

  const options = { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 250000 };
  try {
    videoNoteRecorder = new MediaRecorder(videoNoteStream, options);
  } catch(e) {
    videoNoteRecorder = new MediaRecorder(videoNoteStream);
  }

  videoNoteChunks = [];
  videoNoteRecorder.ondataavailable = e => { if (e.data.size > 0) videoNoteChunks.push(e.data); };

  videoNoteRecorder.onstop = () => {
    const blob = new Blob(videoNoteChunks, { type: videoNoteRecorder.mimeType || 'video/webm' });
    const reader = new FileReader();
    reader.onload = () => sendMediaMessage(reader.result, 'videoNote');
    reader.readAsDataURL(blob);
    closeVideoNoteModal();
  };

  videoNoteRecorder.start(500);
  videoNoteSecondsLeft = 15;
  videoNoteTimer.textContent = '00:15';

  if (videoNoteTimerInterval) clearInterval(videoNoteTimerInterval);
  videoNoteTimerInterval = setInterval(() => {
    videoNoteSecondsLeft--;
    const sec = videoNoteSecondsLeft < 10 ? `0${videoNoteSecondsLeft}` : videoNoteSecondsLeft;
    videoNoteTimer.textContent = `00:${sec}`;

    if (videoNoteSecondsLeft <= 0) {
      stopVideoNoteRecording();
    }
  }, 1000);
}

function closeVideoNoteModal() {
  if (videoNoteStream) {
    videoNoteStream.getTracks().forEach(t => t.stop());
    videoNoteStream = null;
  }
  videoNoteModal.style.display = 'none';
  if (videoNoteTimerInterval) clearInterval(videoNoteTimerInterval);
}

function stopVideoNoteRecording() {
  if (videoNoteRecorder && videoNoteRecorder.state !== 'inactive') {
    videoNoteRecorder.stop();
  } else {
    closeVideoNoteModal();
  }
}

videoNoteBtn.addEventListener('click', startVideoNoteRecording);
stopVideoNoteBtn.addEventListener('click', stopVideoNoteRecording);

// ============================ WEBRTC ЗВОНКИ ============================
function handleIncomingSignal(data) {
  const { signal, from, fromName, callType } = data;

  if (!isCallActive && !peer) {
    pendingCallData = data;
    const isVideo = callType === 'video';
    incomingCallText.textContent = `Входящий ${isVideo ? 'видеозвонок' : 'аудиозвонок'} от ${fromName || 'участника'}`;
    incomingCallModal.style.display = 'flex';
  } else if (peer) {
    try { peer.signal(signal); } catch(e) {}
  }
}

acceptCallBtn.addEventListener('click', () => {
  incomingCallModal.style.display = 'none';
  if (pendingCallData) {
    const { from, callType, signal } = pendingCallData;
    startPeerConnection(false, from, callType === 'video', signal);
    pendingCallData = null;
  }
});

rejectCallBtn.addEventListener('click', () => {
  incomingCallModal.style.display = 'none';
  pendingCallData = null;
});

async function startPeerConnection(isInitiator, targetUserId, wantVideo, incomingSignal = null) {
  if (peer) hangupCall();

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: wantVideo ? { width: 480, height: 360 } : false
    });
  } catch (e) {
    alert('Ошибка доступа к камере или микрофону.');
    return;
  }

  localVideo.srcObject = localStream;

  peer = new SimplePeer({
    initiator: isInitiator,
    trickle: true,
    stream: localStream,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }
  });

  peer.on('signal', signal => {
    signalRef.add({
      from: myUserId,
      fromName: myName,
      target: targetUserId,
      callType: wantVideo ? 'video' : 'audio',
      signal: signal,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  });

  peer.on('stream', rStream => {
    remoteVideo.srcObject = rStream;
    remoteAudio.srcObject = rStream;
    remoteVideo.play().catch(() => {});
    remoteAudio.play().catch(() => {});
  });

  peer.on('error', err => console.error('Peer error:', err));
  peer.on('close', () => hangupCall());

  if (incomingSignal) {
    peer.signal(incomingSignal);
  }

  isCallActive = true;
  callContainer.style.display = 'flex';
  callInfo.textContent = isInitiator ? 'Звоним собеседнику...' : 'Идет разговор';
}

function hangupCall() {
  isCallActive = false;
  incomingCallModal.style.display = 'none';
  pendingCallData = null;

  if (peer) {
    try { peer.destroy(); } catch(e){}
    peer = null;
  }
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  remoteVideo.srcObject = null;
  remoteAudio.srcObject = null;
  localVideo.srcObject = null;
  callContainer.style.display = 'none';
}

audioCallBtn.addEventListener('click', () => {
  const targetId = Object.keys(participants).find(id => id !== myUserId);
  if (!targetId) return alert('Ожидайте входа второго участника!');
  startPeerConnection(true, targetId, false);
});

videoCallBtn.addEventListener('click', () => {
  const targetId = Object.keys(participants).find(id => id !== myUserId);
  if (!targetId) return alert('Ожидайте входа второго участника!');
  startPeerConnection(true, targetId, true);
});

hangupBtn.addEventListener('click', hangupCall);

// ============================ АВТО-ВХОД ПО ССЫЛКЕ ============================
window.addEventListener('load', () => {
  const hash = window.location.hash.replace('#', '').trim();
  if (hash) {
    enterRoom(hash);
  }
});
</script>
