<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Secure Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tweetnacl-util@0.15.1/nacl-util.min.js"></script>
  <style>
    /* (стили те же) */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    #splashScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #1a0f0a 0%, #0a0505 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 1.2s ease;
      font-family: 'Times New Roman', serif;
    }
    #splashScreen.hidden { opacity: 0; pointer-events: none; }
    .splash-content {
      text-align: center;
      animation: fadeInUp 2s ease;
      padding: 20px;
    }
    .splash-content .logo {
      font-size: 5rem;
      color: #d4af37;
      text-shadow: 0 0 40px #b8860b, 0 0 80px #8b6508;
      letter-spacing: 8px;
      border: 3px double #b8860b;
      padding: 20px 40px;
      border-radius: 20px;
      background: rgba(0,0,0,0.4);
      display: inline-block;
    }
    .splash-content .logo span { display: block; font-size: 1.8rem; letter-spacing: 4px; margin-top: 8px; color: #b8860b; }
    .splash-content .subtitle {
      font-size: 1.6rem;
      color: #d4af37;
      margin-top: 20px;
      text-shadow: 0 0 20px #8b6508;
      border-top: 2px solid #b8860b;
      border-bottom: 2px solid #b8860b;
      padding: 8px 20px;
      display: inline-block;
      letter-spacing: 2px;
    }
    .splash-content .ornament { font-size: 3rem; color: #b8860b; margin: 10px 0; }
    .splash-content .loading-bar {
      width: 240px;
      height: 4px;
      background: #2a1a1a;
      border-radius: 4px;
      margin: 20px auto 0;
      overflow: hidden;
      border: 1px solid #b8860b;
    }
    .splash-content .loading-bar .fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #b8860b, #f5d742);
      animation: load 2.5s ease-in-out forwards;
    }
    @keyframes load { 0% { width: 0; } 100% { width: 100%; } }
    @keyframes fadeInUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }

    #app {
      width: 100%;
      max-width: 1100px;
      background: rgba(20, 25, 40, 0.9);
      border-radius: 30px;
      padding: 20px 15px;
      box-shadow: 0 0 60px rgba(59, 130, 246, 0.15);
      border: 1px solid #2a3a5a;
      backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity 1s ease;
    }
    #app.visible { opacity: 1; }
    .header { text-align: center; margin-bottom: 15px; }
    .header h1 { font-size: 2.2rem; font-weight: 700; color: #3b82f6; text-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
    .header .subtitle { color: #94a3b8; font-size: 1rem; border-top: 1px solid #2a3a5a; border-bottom: 1px solid #2a3a5a; padding: 6px 0; }
    .btn {
      background: #3b82f6; border: none; color: white; font-weight: 600;
      padding: 12px 24px; border-radius: 60px; cursor: pointer; transition: all 0.2s;
      font-size: 1rem; display: inline-flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 0 #1e40af; touch-action: manipulation; min-height: 48px;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1e40af; }
    .btn-secondary { background: #475569; box-shadow: 0 4px 0 #1e293b; }
    .btn-success { background: #22c55e; box-shadow: 0 4px 0 #15803d; }
    .btn-danger { background: #ef4444; box-shadow: 0 4px 0 #b91c1c; }
    .btn-sm { padding: 8px 16px; font-size: 0.9rem; min-height: 40px; }
    .flex-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; margin: 10px 0; }
    .video-grid { display: none; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 15px 0; }
    .video-grid.active { display: flex; }
    .video-box {
      flex: 1 1 200px; min-width: 140px; background: #0a0505; border: 2px solid #3b82f6;
      border-radius: 16px; overflow: hidden; position: relative; aspect-ratio: 4/3; cursor: pointer;
    }
    .video-box video { width: 100%; height: 100%; object-fit: cover; background: #111; display: block; }
    #localVideo { transform: scaleX(-1); }
    .video-box .label {
      position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.7);
      padding: 2px 12px; border-radius: 30px; font-size: 0.8rem; color: #f8fafc;
      border: 1px solid #3b82f6; pointer-events: none;
    }
    .chat-area { display: none; margin-top: 15px; border-top: 1px solid #2a3a5a; padding-top: 12px; }
    .chat-area.active { display: block; }
    .chat-messages {
      max-height: 300px; overflow-y: auto; background: rgba(0,0,0,0.3);
      border-radius: 12px; padding: 8px; margin-bottom: 8px; border: 1px solid #2a3a5a;
    }
    .chat-messages .msg {
      background: rgba(20, 30, 50, 0.6); border-radius: 10px; padding: 5px 10px;
      margin-bottom: 5px; color: #e0e0e0; word-break: break-word; font-size: 0.95rem;
    }
    .chat-messages .msg .sender { color: #60a5fa; font-weight: bold; }
    .chat-messages .msg .time { color: #94a3b8; font-size: 0.7rem; margin-left: 8px; }
    .chat-messages .msg img, .chat-messages .msg video {
      max-width: 120px; border-radius: 8px; margin-top: 4px; border: 1px solid #3b82f6;
    }
    .chat-input-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .chat-input-row input[type="text"] {
      flex: 1; background: #0f172a; border: 1px solid #2a3a5a; color: #e0e0e0;
      padding: 10px 14px; border-radius: 60px; font-size: 1rem; min-width: 120px; min-height: 44px;
    }
    .chat-input-row input[type="text"]::placeholder { color: #64748b; }
    .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; }
    .file-input-wrapper input[type="file"] {
      position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
    }
    .call-controls { display: none; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
    .call-controls.active { display: flex; }
    .invite-area {
      display: none; background: #1a2530; border: 1px dashed #3b82f6;
      border-radius: 16px; padding: 12px; margin: 12px 0; font-size: 0.9rem; color: #94a3b8;
    }
    .invite-area.active { display: block; }
    .invite-area .link-label { font-weight: bold; color: #3b82f6; }
    .invite-area .link-url { display: none; }
    .status {
      text-align: center; font-size: 1rem; padding: 10px; border-radius: 60px;
      background: rgba(0,0,0,0.3); margin: 10px 0; color: #e0e0e0;
    }
    .block-init { display: block; }
    .block-call { display: none; }
    .emoji-picker {
      display: none; padding: 8px; background: #1e293b; border: 1px solid #2a3a5a;
      border-radius: 16px; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
    }
    .emoji-picker.active { display: flex; }
    .emoji-picker span {
      font-size: 1.8rem; cursor: pointer; transition: transform 0.1s;
      padding: 4px; border-radius: 8px;
    }
    .emoji-picker span:hover { background: #2a3a5a; transform: scale(1.2); }
    .exit-btn-wrapper { display: flex; justify-content: flex-end; margin-top: 8px; }
    .input-field {
      background: #0f172a; border: 1px solid #2a3a5a; color: #e0e0e0;
      padding: 12px 18px; border-radius: 60px; font-size: 1rem; min-width: 140px; flex: 1; min-height: 44px;
    }
    .input-field::placeholder { color: #64748b; }
    @media (max-width: 600px) {
      .header h1 { font-size: 1.8rem; }
      .video-box { flex: 1 1 130px; min-width: 100px; }
      .btn { font-size: 0.9rem; padding: 12px 18px; min-height: 48px; }
      .btn-sm { padding: 8px 14px; min-height: 40px; font-size: 0.85rem; }
      .splash-content .logo { font-size: 3rem; padding: 15px 25px; }
      .splash-content .logo span { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

<!-- ЭКРАН ЗАГРУЗКИ -->
<div id="splashScreen">
  <div class="splash-content">
    <div class="ornament">⚔️</div>
    <div class="logo">🛡️<span>Secure Chat</span></div>
    <div class="subtitle">Добро пожаловать, путник</div>
    <div class="ornament">★</div>
    <div class="loading-bar"><div class="fill"></div></div>
  </div>
</div>

<!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
<div id="app">
  <div class="header">
    <h1>🔒 Secure Chat</h1>
    <div class="subtitle">Шифрование • Звонки • Файлы</div>
  </div>

  <div id="initBlock" class="block-init">
    <div class="flex-row">
      <button class="btn btn-success" id="createRoomBtn">➕ Создать комнату</button>
      <button class="btn btn-secondary" id="joinRoomBtn">🔗 Присоединиться</button>
      <button class="btn btn-secondary" id="testDeviceBtn">🎤 Проверить устройства</button>
    </div>
    <div id="joinPanel" style="display: none; margin-top: 15px;">
      <div class="flex-row">
        <input class="input-field" id="roomInput" placeholder="ID комнаты" />
        <button class="btn btn-secondary btn-sm" id="doJoinBtn">Войти</button>
      </div>
      <div style="text-align:center;color:#94a3b8;font-size:0.9rem;margin-top:5px;">
        <i>Введите ID комнаты, который вам дали.</i>
      </div>
    </div>
    <div id="statusInit" class="status" style="margin-top:20px; background:transparent;">Готов к связи</div>
  </div>

  <div id="callBlock" class="block-call">
    <div class="video-grid" id="videoGrid">
      <div class="video-box" id="localVideoBox">
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="label">Я</div>
      </div>
      <div class="video-box" id="remoteVideoBox">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="label">Товарищ</div>
      </div>
    </div>

    <div class="call-controls" id="callControls">
      <button class="btn btn-sm" id="toggleAudioBtn">🔇 Заглушить</button>
      <button class="btn btn-sm" id="toggleVideoBtn">📷 Выключить</button>
      <button class="btn btn-danger btn-sm" id="hangupBtn">⛔ Прервать</button>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="emoji-picker" id="emojiPicker">
        <span>😀</span><span>😂</span><span>😍</span><span>👍</span><span>❤️</span>
        <span>🔥</span><span>🎉</span><span>😎</span><span>🙏</span><span>💩</span>
        <span>🙈</span><span>🚀</span><span>🤔</span><span>😊</span><span>👋</span>
        <span>👀</span><span>🤣</span><span>🥳</span><span>💪</span><span>✨</span>
        <span>🌟</span><span>⭐</span><span>🌙</span><span>☀️</span><span>⚡</span>
        <span>❄️</span><span>💧</span><span>🌊</span><span>🌈</span>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row">
        <button class="btn btn-secondary btn-sm" id="emojiToggleBtn">😀</button>
        <input type="text" id="chatInput" placeholder="Введите сообщение..." />
        <button class="btn btn-sm" id="sendChatBtn">Отправить</button>
        <div class="file-input-wrapper">
          <button class="btn btn-sm btn-secondary">📎 Файл</button>
          <input type="file" id="fileInput" accept="image/*,video/*" multiple />
        </div>
      </div>
    </div>

    <div class="invite-area" id="inviteArea">
      <div><span class="link-label">🔗 Пригласительная ссылка:</span></div>
      <div class="link-url"><a id="inviteLink" href="#" target="_blank">Ссылка</a></div>
      <div class="flex-row" style="gap:8px; margin-top:6px;">
        <button class="btn btn-secondary btn-sm" id="copyLinkBtn">📋 Копировать ссылку</button>
      </div>
    </div>

    <!-- Дополнительные кнопки звонков -->
    <div class="flex-row" id="callButtons">
      <button class="btn btn-success btn-sm" id="audioCallBtn">📞 Аудиозвонок</button>
      <button class="btn btn-success btn-sm" id="videoCallBtn">📹 Видеозвонок</button>
    </div>

    <div class="status" id="statusDisplay">⏳ Ожидание соединения...</div>

    <div class="exit-btn-wrapper">
      <button class="btn btn-danger btn-sm" id="exitRoomBtn">🚪 Выйти из комнаты</button>
    </div>
  </div>
</div>

<script>
// ======================================================================
// 1. КОНФИГУРАЦИЯ
// ======================================================================
const PEER_OPTIONS = {
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'stun:stun3.l.google.com:19302' },
      { urls: 'stun:stun4.l.google.com:19302' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  }
};

// ======================================================================
// 2. СОСТОЯНИЕ ПРИЛОЖЕНИЯ
// ======================================================================
let currentRoom = null;
let peer = null;
let conn = null;          // DataConnection для чата
let call = null;          // MediaConnection для звонка
let localStream = null;
let remoteStream = null;
let isInitiator = false;
let hasVideo = false, hasAudio = false;
let myKeyPair = null;

// DOM
const splash = document.getElementById('splashScreen');
const app = document.getElementById('app');
const initBlock = document.getElementById('initBlock');
const callBlock = document.getElementById('callBlock');
const statusInit = document.getElementById('statusInit');
const statusDisplay = document.getElementById('statusDisplay');
const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const sendChatBtn = document.getElementById('sendChatBtn');
const fileInput = document.getElementById('fileInput');
const inviteLink = document.getElementById('inviteLink');
const createRoomBtn = document.getElementById('createRoomBtn');
const joinRoomBtn = document.getElementById('joinRoomBtn');
const joinPanel = document.getElementById('joinPanel');
const roomInput = document.getElementById('roomInput');
const doJoinBtn = document.getElementById('doJoinBtn');
const testDeviceBtn = document.getElementById('testDeviceBtn');
const toggleAudioBtn = document.getElementById('toggleAudioBtn');
const toggleVideoBtn = document.getElementById('toggleVideoBtn');
const hangupBtn = document.getElementById('hangupBtn');
const copyLinkBtn = document.getElementById('copyLinkBtn');
const exitRoomBtn = document.getElementById('exitRoomBtn');
const emojiToggleBtn = document.getElementById('emojiToggleBtn');
const emojiPicker = document.getElementById('emojiPicker');
const audioCallBtn = document.getElementById('audioCallBtn');
const videoCallBtn = document.getElementById('videoCallBtn');

// ======================================================================
// 3. ВСПОМОГАТЕЛЬНЫЕ
// ======================================================================
function addMessage(sender, content, mediaType = 'text', timestamp = Date.now()) {
  const div = document.createElement('div');
  div.className = 'msg';
  const timeStr = new Date(timestamp).toLocaleTimeString();
  let displayContent = content;
  if (mediaType === 'image') displayContent = `<img src="${content}" alt="Изображение" />`;
  else if (mediaType === 'video') displayContent = `<video src="${content}" controls style="max-width:120px;max-height:120px;"></video>`;
  div.innerHTML = `<span class="sender">${sender}</span> <span class="time">${timeStr}</span><br>${displayContent}`;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

// ======================================================================
// 4. ПРОВЕРКА УСТРОЙСТВ
// ======================================================================
async function testDevices() {
  statusInit.textContent = '🔍 Проверка устройств...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
    stream.getTracks().forEach(t => t.stop());
    statusInit.textContent = '✅ Все устройства работают!';
  } catch (e) {
    statusInit.textContent = '⚠️ Частичная ошибка: ' + e.message + '. Попробуйте войти без видео.';
    console.warn(e);
  }
}

// ======================================================================
// 5. ЗАПУСК МЕДИА
// ======================================================================
async function getMedia() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
    hasVideo = true; hasAudio = true;
    return stream;
  } catch (e1) {
    console.warn('Видео+аудио не доступны, пробуем только аудио:', e1.message);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      hasVideo = false; hasAudio = true;
      return stream;
    } catch (e2) {
      console.warn('Аудио не доступно, пробуем только видео:', e2.message);
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
        hasVideo = true; hasAudio = false;
        return stream;
      } catch (e3) {
        console.warn('Ничего не доступно, создаём пустой поток:', e3.message);
        return new MediaStream();
      }
    }
  }
}

// ======================================================================
// 6. ПОКАЗАТЬ/СКРЫТЬ БЛОКИ
// ======================================================================
function showCallBlock() {
  initBlock.style.display = 'none';
  callBlock.style.display = 'block';
  document.getElementById('videoGrid').classList.add('active');
  document.getElementById('callControls').classList.add('active');
  document.getElementById('chatArea').classList.add('active');
  document.getElementById('inviteArea').classList.add('active');
  if (!hasVideo) { localVideo.style.display = 'none'; remoteVideo.style.display = 'none'; }
  else { localVideo.style.display = 'block'; remoteVideo.style.display = 'block'; }
}
function hideCallBlock() {
  initBlock.style.display = 'block';
  callBlock.style.display = 'none';
  document.getElementById('videoGrid').classList.remove('active');
  document.getElementById('callControls').classList.remove('active');
  document.getElementById('chatArea').classList.remove('active');
  document.getElementById('inviteArea').classList.remove('active');
  localVideo.style.display = 'block';
  remoteVideo.style.display = 'block';
}

// ======================================================================
// 7. СОЗДАНИЕ КОМНАТЫ (без автоматического звонка)
// ======================================================================
async function createRoom() {
  try {
    statusInit.textContent = '🛠 Создаём комнату...';
    const roomId = 'chat-' + Math.random().toString(36).substring(2, 10);
    currentRoom = roomId;
    isInitiator = true;

    const stream = await getMedia();
    localStream = stream;
    if (hasVideo) localVideo.srcObject = stream;
    console.log('Локальный поток создан, треков:', localStream.getTracks().length);

    peer = new Peer(roomId, PEER_OPTIONS);
    await new Promise((resolve, reject) => {
      peer.on('open', () => resolve());
      peer.on('error', reject);
    });
    console.log('Peer создан с ID:', roomId);

    // Обработка входящего DataConnection (чат)
    peer.on('connection', (dataConn) => {
      if (conn) { dataConn.close(); return; }
      conn = dataConn;
      conn.on('open', () => {
        console.log('DataConnection открыто (создатель)');
        statusDisplay.textContent = '✅ Соединение для чата установлено!';
        // Отправляем приветственное сообщение для теста
        conn.send(JSON.stringify({ type: 'text', content: 'Привет!' }));
      });
      conn.on('data', (data) => handleIncomingData(data));
      conn.on('close', () => {
        console.warn('DataConnection закрыто (создатель)');
        conn = null;
        statusDisplay.textContent = '⚠️ Соединение чата разорвано.';
      });
      conn.on('error', (err) => {
        console.error('DataConnection error:', err);
        statusDisplay.textContent = '❌ Ошибка соединения: ' + err.message;
      });
    });

    // Обработка входящих звонков (медиа)
    peer.on('call', (incomingCall) => {
      console.log('Входящий звонок от:', incomingCall.peer);
      if (call) {
        console.warn('Звонок уже активен, отклоняем новый');
        incomingCall.answer();
        return;
      }
      if (!localStream || localStream.getTracks().length === 0) {
        console.error('Нет локального потока для ответа');
        incomingCall.answer();
        return;
      }
      call = incomingCall;
      call.answer(localStream);
      call.on('stream', (remote) => {
        console.log('Получен удалённый поток, треков:', remote.getTracks().length);
        remoteStream = remote;
        remoteVideo.srcObject = remote;
        statusDisplay.textContent = '📞 Товарищ на связи!';
        if (remote.getAudioTracks().length === 0) statusDisplay.textContent += ' (без аудио)';
        if (remote.getVideoTracks().length === 0) statusDisplay.textContent += ' (без видео)';
      });
      call.on('close', () => {
        console.log('Звонок закрыт');
        remoteVideo.srcObject = null;
        statusDisplay.textContent = '🔴 Сеанс завершён.';
        call = null;
      });
      call.on('error', (err) => {
        console.error('Ошибка звонка:', err);
        statusDisplay.textContent = '❌ Ошибка звонка: ' + err.message;
        call = null;
      });
    });

    // Ссылка для приглашения
    const link = window.location.origin + window.location.pathname + '?room=' + encodeURIComponent(roomId);
    inviteLink.href = link;
    inviteLink.textContent = link;

    showCallBlock();
    statusDisplay.textContent = '⏳ Ожидаем подключения товарища...';
    statusInit.textContent = 'Готов к связи';
    // Показываем кнопки звонков (они будут активны, когда второй участник подключится)
    document.getElementById('callButtons').style.display = 'flex';

  } catch (err) {
    console.error(err);
    statusInit.textContent = '❌ Ошибка: ' + err.message;
  }
}

// ======================================================================
// 8. ПРИСОЕДИНЕНИЕ К КОМНАТЕ (без автоматического звонка)
// ======================================================================
async function joinRoom(roomId) {
  try {
    if (!roomId) {
      statusInit.textContent = '❌ Введите ID комнаты.';
      return;
    }
    currentRoom = roomId;
    isInitiator = false;

    const stream = await getMedia();
    localStream = stream;
    if (hasVideo) localVideo.srcObject = stream;
    console.log('Локальный поток создан, треков:', localStream.getTracks().length);

    peer = new Peer(PEER_OPTIONS);
    await new Promise((resolve, reject) => {
      peer.on('open', () => resolve());
      peer.on('error', reject);
    });
    console.log('Peer создан со случайным ID');

    // DataConnection к комнате
    conn = peer.connect(roomId);
    conn.on('open', () => {
      console.log('DataConnection открыто (входящий)');
      statusDisplay.textContent = '✅ Соединение с комнатой установлено.';
    });
    conn.on('data', (data) => handleIncomingData(data));
    conn.on('close', () => {
      console.warn('DataConnection закрыто (входящий)');
      conn = null;
      statusDisplay.textContent = '⚠️ Соединение чата разорвано.';
    });
    conn.on('error', (err) => {
      console.error('DataConnection error:', err);
      statusDisplay.textContent = '❌ Ошибка соединения: ' + err.message;
    });

    showCallBlock();
    document.getElementById('inviteArea').classList.remove('active');
    // Показываем кнопки звонков
    document.getElementById('callButtons').style.display = 'flex';
    statusDisplay.textContent = '⏳ Ожидание, нажмите "Аудиозвонок" или "Видеозвонок"';
    statusInit.textContent = 'Готов к связи';

  } catch (err) {
    console.error(err);
    statusInit.textContent = '❌ Ошибка: ' + err.message;
  }
}

// ======================================================================
// 9. ОБРАБОТКА ВХОДЯЩИХ ДАННЫХ (чат)
// ======================================================================
function handleIncomingData(data) {
  try {
    console.log('Получены данные:', data);
    if (typeof data === 'string') {
      // Если это просто текст, показываем
      addMessage('Товарищ', data, 'text');
      return;
    }
    // Если объект
    const parsed = data;
    if (parsed.type === 'text') {
      addMessage('Товарищ', parsed.content, 'text');
    } else if (parsed.type === 'message') {
      addMessage(parsed.sender || 'Товарищ', parsed.content, parsed.mediaType || 'text', parsed.timestamp);
    } else {
      // Попробуем показать как есть
      addMessage('Товарищ', JSON.stringify(parsed), 'text');
    }
  } catch (e) {
    console.error('Ошибка обработки данных:', e);
    // Если не удалось распарсить, показываем как текст
    addMessage('Товарищ', String(data), 'text');
  }
}

// ======================================================================
// 10. ОТПРАВКА СООБЩЕНИЯ (чат)
// ======================================================================
function sendMessage(text, mediaType = 'text', fileData = null) {
  if (!conn || !conn.open) {
    statusDisplay.textContent = '⚠️ Нет открытого соединения для чата.';
    console.warn('Попытка отправить сообщение без открытого соединения');
    return;
  }
  let content = fileData || text;
  const msg = { 
    type: 'message', 
    sender: 'Я', 
    content: content, 
    mediaType: mediaType, 
    timestamp: Date.now()
  };
  try {
    conn.send(JSON.stringify(msg));
    console.log('Сообщение отправлено:', msg);
    addMessage('Я', fileData || text, mediaType, msg.timestamp);
  } catch (e) {
    console.error('Ошибка при отправке сообщения:', e);
    statusDisplay.textContent = '❌ Ошибка отправки: ' + e.message;
  }
}

// ======================================================================
// 11. ЗВОНКИ (по кнопкам)
// ======================================================================
async function startCall(wantVideo) {
  if (call) {
    statusDisplay.textContent = '⚠️ Звонок уже активен';
    return;
  }
  if (!conn || !conn.open) {
    statusDisplay.textContent = '⚠️ Нет соединения для чата. Убедитесь, что вы подключены к комнате.';
    return;
  }
  if (!localStream || localStream.getTracks().length === 0) {
    statusDisplay.textContent = '⚠️ Нет медиа-потока. Проверьте устройства.';
    return;
  }
  // Получаем ID собеседника (это ID комнаты, так как при создании комнаты peer имеет ID комнаты)
  const targetId = currentRoom;
  if (!targetId) {
    statusDisplay.textContent = '❌ Неизвестный ID комнаты';
    return;
  }
  console.log('Инициируем звонок к:', targetId, 'с видео:', wantVideo);
  try {
    const callObj = peer.call(targetId, localStream);
    call = callObj;
    call.on('stream', (remote) => {
      console.log('Получен удалённый поток, треков:', remote.getTracks().length);
      remoteStream = remote;
      remoteVideo.srcObject = remote;
      statusDisplay.textContent = '📞 Товарищ на связи!';
      if (remote.getAudioTracks().length === 0) statusDisplay.textContent += ' (без аудио)';
      if (remote.getVideoTracks().length === 0) statusDisplay.textContent += ' (без видео)';
    });
    call.on('close', () => {
      console.log('Звонок закрыт');
      remoteVideo.srcObject = null;
      statusDisplay.textContent = '🔴 Сеанс завершён.';
      call = null;
    });
    call.on('error', (err) => {
      console.error('Ошибка звонка:', err);
      statusDisplay.textContent = '❌ Ошибка звонка: ' + err.message;
      call = null;
    });
  } catch (e) {
    console.error('Ошибка инициации звонка:', e);
    statusDisplay.textContent = '❌ Ошибка звонка: ' + e.message;
  }
}

// ======================================================================
// 12. ВЫХОД ИЗ КОМНАТЫ
// ======================================================================
function exitRoom() {
  if (call) { call.close(); call = null; }
  if (conn) { conn.close(); conn = null; }
  if (peer) { peer.destroy(); peer = null; }
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  remoteVideo.srcObject = null;
  localVideo.srcObject = null;
  hideCallBlock();
  chatMessages.innerHTML = '';
  currentRoom = null;
  statusDisplay.textContent = '';
  statusInit.textContent = 'Вы вышли из комнаты.';
  document.getElementById('callButtons').style.display = 'none';
}

// ======================================================================
// 13. ПОЛНОЭКРАННЫЙ РЕЖИМ
// ======================================================================
function toggleFullscreen(videoElement) {
  if (!document.fullscreenElement) {
    videoElement.requestFullscreen().catch(err => {
      if (videoElement.webkitRequestFullscreen) videoElement.webkitRequestFullscreen();
    });
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}
localVideo.addEventListener('dblclick', () => toggleFullscreen(localVideo));
remoteVideo.addEventListener('dblclick', () => toggleFullscreen(remoteVideo));

// ======================================================================
// 14. ОБРАБОТЧИКИ ИНТЕРФЕЙСА
// ======================================================================
createRoomBtn.addEventListener('click', createRoom);

joinRoomBtn.addEventListener('click', () => {
  joinPanel.style.display = joinPanel.style.display === 'none' ? 'flex' : 'none';
});

doJoinBtn.addEventListener('click', () => {
  const room = roomInput.value.trim();
  joinRoom(room);
});

testDeviceBtn.addEventListener('click', testDevices);

toggleAudioBtn.addEventListener('click', () => {
  if (localStream) {
    const tracks = localStream.getAudioTracks();
    if (tracks.length) {
      const en = !tracks[0].enabled;
      tracks[0].enabled = en;
      toggleAudioBtn.textContent = en ? '🔇 Заглушить' : '🔊 Включить';
    }
  }
});

toggleVideoBtn.addEventListener('click', () => {
  if (localStream) {
    const tracks = localStream.getVideoTracks();
    if (tracks.length) {
      const en = !tracks[0].enabled;
      tracks[0].enabled = en;
      toggleVideoBtn.textContent = en ? '📷 Выключить' : '📷 Включить';
    }
  }
});

hangupBtn.addEventListener('click', exitRoom);

copyLinkBtn.addEventListener('click', () => {
  const link = inviteLink.href;
  if (link) {
    navigator.clipboard.writeText(link).then(() => {
      statusDisplay.textContent = '✅ Ссылка скопирована!';
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = link;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      statusDisplay.textContent = '✅ Ссылка скопирована!';
    });
  }
});

exitRoomBtn.addEventListener('click', exitRoom);

sendChatBtn.addEventListener('click', () => {
  const text = chatInput.value.trim();
  if (text) {
    sendMessage(text);
    chatInput.value = '';
  }
});

chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChatBtn.click();
});

fileInput.addEventListener('change', (e) => {
  const files = e.target.files;
  for (let file of files) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const base64 = ev.target.result;
      let mediaType = 'image';
      if (file.type.startsWith('video/')) mediaType = 'video';
      sendMessage(base64, mediaType);
    };
    reader.readAsDataURL(file);
  }
  fileInput.value = '';
});

emojiToggleBtn.addEventListener('click', () => {
  emojiPicker.classList.toggle('active');
});

emojiPicker.addEventListener('click', (e) => {
  if (e.target.tagName === 'SPAN') {
    chatInput.value += e.target.textContent;
    chatInput.focus();
    emojiPicker.classList.remove('active');
  }
});

// Кнопки звонков
audioCallBtn.addEventListener('click', () => startCall(false));
videoCallBtn.addEventListener('click', () => startCall(true));

// ======================================================================
// 15. АВТОВХОД ПО ССЫЛКЕ И ЗАГРУЗКА
// ======================================================================
window.addEventListener('load', () => {
  setTimeout(() => {
    splash.classList.add('hidden');
    app.classList.add('visible');
  }, 3000);

  const params = new URLSearchParams(window.location.search);
  const room = params.get('room');
  if (room) {
    setTimeout(() => joinRoom(room), 800);
  }
});

console.log('Secure Chat загружен. Создайте комнату или перейдите по ссылке с параметром ?room=ID');
</script>
