<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🔒 Secure Chat</title>
  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <!-- tweetnacl + util -->
  <script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tweetnacl-util@0.15.1/nacl-util.min.js"></script>
  <!-- simple-peer -->
  <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
  <style>
    :root {
      --bg-body: #f5f7fa;
      --bg-app: #ffffff;
      --bg-messages: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --msg-sent: #3b82f6;
      --msg-sent-text: #ffffff;
      --msg-received: #ffffff;
      --msg-received-text: #1e293b;
    }

    [data-theme="dark"] {
      --bg-body: #0f172a;
      --bg-app: #1e293b;
      --bg-messages: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --msg-sent: #2563eb;
      --msg-sent-text: #ffffff;
      --msg-received: #334155;
      --msg-received-text: #f8fafc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.3s;
    }
    #app {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 800px;
      background: var(--bg-app);
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }
    #home {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      text-align: center;
    }
    #home h1 { font-size: 2rem; margin-bottom: 10px; }
    #home p { color: var(--text-muted); margin-bottom: 30px; }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;

      display: inline-flex;
      align-items: center;
      gap: 8px;

    .btn-secondary { background: var(--border-color); color: var(--text-main); }

    #chat { display: none; flex-direction: column; height: 100%; }
    #header {

      background: var(--bg-app);
      border-bottom: 1px solid var(--border-color);

      align-items: center;
      flex-shrink: 0;

    #header h2 { font-size: 1rem; font-weight: 600; }
    #header-actions { display: flex; gap: 4px; align-items: center; }
    #header-actions button {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: var(--text-main);

    #header-actions button:hover { background: var(--border-color); }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg-messages);

      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;

    .msg-sent {
      align-self: flex-end;
      background: var(--msg-sent);
      color: var(--msg-sent-text);
      border-bottom-right-radius: 4px;
    }
    .msg-received {
      align-self: flex-start;
      background: var(--msg-received);
      color: var(--msg-received-text);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;

    .msg-name { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
    .msg-sent .msg-name { color: #bfdbfe; }
    .msg-time { font-size: 0.6rem; opacity: 0.7; margin-top: 2px; text-align: right; }
    .msg-audio audio { max-width: 180px; height: 32px; }

    #emoji-picker {
      display: none;
      padding: 8px;
      background: var(--bg-app);
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 8px;
      max-height: 120px;
      overflow-y: auto;

    #emoji-picker span {
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
    }
    #emoji-picker span:hover { background: var(--border-color); }

    #input-area {
      padding: 10px 12px;
      background: var(--bg-app);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    #input-area input {
      flex: 1;
      border: 1px solid var(--border-color);
      background: var(--bg-body);
      color: var(--text-main);
      border-radius: 24px;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
    }
    #input-area .icon-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      color: var(--text-main);
    }
    #sendBtn {
      background: var(--primary);
      border: none;
      color: white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #call-container {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #call-container video {
      width: 100%; max-width: 400px;
      background: #1e293b;
      border-radius: 12px; margin: 10px;
    }
    #call-controls button {
      background: #ef4444; border: none; color: white;
      border-radius: 50%; width: 56px; height: 56px;
      font-size: 1.4rem; cursor: pointer;
    }
    .call-info { color: white; font-size: 1.1rem; margin-bottom: 15px; }

    @media (max-width: 480px) {
      #app { border-radius: 0; max-height: 100vh; }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="home">
    <h1>🔒 Secure Chat</h1>
    <p>Анонимный чат с шифрованием и звонками</p>
    <button class="btn" id="createRoomBtn">➕ Создать комнату</button>
    <div style="margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
      Или введите ID комнаты:
      <input id="roomIdInput" placeholder="например, abc123" style="margin-top: 8px; padding: 8px; border-radius: 20px; border:1px solid var(--border-color); width:200px; background:var(--bg-body); color:var(--text-main); text-align:center;">
      <button class="btn btn-secondary" id="joinRoomBtn" style="margin-top: 8px;">Войти</button>
    </div>
  </div>

  <div id="chat">
    <div id="header">
      <h2 id="roomTitle">Комната</h2>
      <div id="header-actions">
        <button id="copyLinkBtn" title="Скопировать ссылку">🔗</button>
        <button id="audioCallBtn" title="Аудиозвонок">📞</button>
        <button id="videoCallBtn" title="Видеозвонок">📹</button>
        <button id="themeToggleBtn" title="Сменить тему">🌙</button>
        <button id="leaveRoomBtn" title="Выйти">✕</button>
      </div>
    </div>
    <div id="messages"></div>

    <div id="emoji-picker">
      <span>😀</span><span>😂</span><span>😍</span><span>👍</span><span>❤️</span>
      <span>🔥</span><span>🎉</span><span>😎</span><span>🙏</span><span>💩</span>
      <span>🙈</span><span>🚀</span><span>🤔</span><span>😊</span><span>👋</span>
    </div>

    <div id="input-area">
      <button class="icon-btn" id="emojiBtn" title="Смайлики">😀</button>
      <button class="icon-btn" id="recordBtn" title="Голосовое сообщение">🎤</button>
      <input id="msgInput" placeholder="Сообщение..." autocomplete="off">
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <div id="call-container">
    <div class="call-info" id="callInfo">Звонок...</div>
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted style="width:110px; position:absolute; bottom:90px; right:20px; border-radius:10px; background:#1e293b;"></video>
    <div id="call-controls">
      <button id="hangupBtn">📴</button>
    </div>
  </div>
</div>

<script>
// Полифил для simple-peer
window.global = window;

// ============================ НАСТРОЙКА FIREBASE ============================
const firebaseConfig = {
  apiKey: "AIzaSyDYRkGlyl5ySs4AyCuJEM39M-4FPok9sKA",
  authDomain: "chatt-6d410.firebaseapp.com",
  projectId: "chatt-6d410",
  storageBucket: "chatt-6d410.firebasestorage.app",
  messagingSenderId: "901741126959",
  appId: "1:901741126959:web:97734153fa537a5ab16dda",
  measurementId: "G-H616TJEYXC"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

// ============================ ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ============================
let roomId = '';
let myName = '';
let myKeyPair = null;
let participants = {};      
let messages = [];
let localPlainMessages = {}; 
let peer = null;
let localStream = null;
let isCallActive = false;
let callType = null;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let myUserId = '';          
let roomRef = null;         
let messagesRef = null;     
let participantsRef = null; 
let signalRef = null;       
let unsubscribeMessages = null;
let unsubscribeParticipants = null;
let unsubscribeSignals = null;

// DOM Элементы
const home = document.getElementById('home');
const chat = document.getElementById('chat');
const messagesDiv = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const createRoomBtn = document.getElementById('createRoomBtn');
const joinRoomBtn = document.getElementById('joinRoomBtn');
const roomIdInput = document.getElementById('roomIdInput');
const roomTitle = document.getElementById('roomTitle');
const leaveRoomBtn = document.getElementById('leaveRoomBtn');
const audioCallBtn = document.getElementById('audioCallBtn');
const videoCallBtn = document.getElementById('videoCallBtn');
const recordBtn = document.getElementById('recordBtn');
const emojiBtn = document.getElementById('emojiBtn');
const emojiPicker = document.getElementById('emoji-picker');
const themeToggleBtn = document.getElementById('themeToggleBtn');
const copyLinkBtn = document.getElementById('copyLinkBtn');
const callContainer = document.getElementById('call-container');
const remoteVideo = document.getElementById('remoteVideo');
const localVideo = document.getElementById('localVideo');
const hangupBtn = document.getElementById('hangupBtn');
const callInfo = document.getElementById('callInfo');

// ============================ ТЕМА (DARK / LIGHT) ============================
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeToggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', theme);
}
themeToggleBtn.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  setTheme(current === 'dark' ? 'light' : 'dark');
});
setTheme(localStorage.getItem('theme') || 'light');

// ============================ СМАЙЛИКИ ============================
emojiBtn.addEventListener('click', () => {
  emojiPicker.style.display = emojiPicker.style.display === 'flex' ? 'none' : 'flex';
});
emojiPicker.addEventListener('click', (e) => {
  if (e.target.tagName === 'SPAN') {
    msgInput.value += e.target.textContent;
    msgInput.focus();
  }
});

// ============================ ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ============================
function generateRandomName() {
  const adjs = ['Быстрый', 'Смелый', 'Тихий', 'Умный', 'Добрый', 'Сильный', 'Весёлый', 'Спокойный'];
  const nouns = ['Лис', 'Волк', 'Медведь', 'Заяц', 'Сокол', 'Дельфин', 'Тигр', 'Панда'];
  return adjs[Math.floor(Math.random() * adjs.length)] + ' ' + nouns[Math.floor(Math.random() * nouns.length)];
}

function generateKeyPair() {
  const pair = nacl.box.keyPair();
  return {
    publicKey: nacl.util.encodeBase64(pair.publicKey),
    secretKey: nacl.util.encodeBase64(pair.secretKey),
  };
}

function encryptMessage(message, recipientPublicKeyBase64, senderSecretKeyBase64) {
  const recipientPublicKey = nacl.util.decodeBase64(recipientPublicKeyBase64);
  const senderSecretKey = nacl.util.decodeBase64(senderSecretKeyBase64);
  const nonce = nacl.randomBytes(24);
  const msgUint8 = new TextEncoder().encode(message);
  const encrypted = nacl.box(msgUint8, nonce, recipientPublicKey, senderSecretKey);
  return {
    nonce: nacl.util.encodeBase64(nonce),
    encrypted: nacl.util.encodeBase64(encrypted),
  };
}

function decryptMessage(encryptedPackage, senderPublicKeyBase64, recipientSecretKeyBase64) {
  try {
    const { nonce, encrypted } = encryptedPackage;
    const senderPublicKey = nacl.util.decodeBase64(senderPublicKeyBase64);
    const recipientSecretKey = nacl.util.decodeBase64(recipientSecretKeyBase64);
    const nonceUint8 = nacl.util.decodeBase64(nonce);
    const encryptedUint8 = nacl.util.decodeBase64(encrypted);
    const decrypted = nacl.box.open(encryptedUint8, nonceUint8, senderPublicKey, recipientSecretKey);
    if (!decrypted) throw new Error('Decryption failed');
    return new TextDecoder().decode(decrypted);
  } catch (e) {
    return null;
  }
}

function formatTime(date) {
  if (!date) return '';
  const d = date.toDate ? date.toDate() : new Date(date);
  return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

function generateUserId() {
  return Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
}

// ============================ ВХОД В КОМНАТУ ============================
async function enterRoom(roomIdParam) {
  roomId = roomIdParam;
  myUserId = generateUserId();
  myName = generateRandomName();
  myKeyPair = generateKeyPair();

  roomRef = db.collection('rooms').doc(roomId);
  messagesRef = roomRef.collection('messages');
  participantsRef = roomRef.collection('participants');
  signalRef = roomRef.collection('signals');

  await participantsRef.doc(myUserId).set({
    name: myName,
    publicKey: myKeyPair.publicKey,
    joinedAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  unsubscribeMessages = messagesRef.orderBy('createdAt', 'asc').onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === 'added') {
        const data = change.doc.data();
        data.id = change.doc.id;
        messages.push(data);
        renderMessages();
      }
    });
  });

  unsubscribeParticipants = participantsRef.onSnapshot(snapshot => {
    participants = {};
    snapshot.forEach(doc => {
      const data = doc.data();
      participants[doc.id] = { publicKey: data.publicKey, name: data.name };
    });
    const count = Object.keys(participants).length;
    roomTitle.textContent = `Комната ${roomId} (${count})`;
  });

  unsubscribeSignals = signalRef.where('target', '==', myUserId).onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === 'added') {
        const data = change.doc.data();
        change.doc.ref.delete();
        handleSignal(data.signal, data.from, data.fromName);
      }
    });
  });

  home.style.display = 'none';
  chat.style.display = 'flex';
  msgInput.focus();

  window.history.pushState({}, '', `/?room=${roomId}`);
}

// Скопировать ссылку
copyLinkBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(window.location.href);
  alert('Ссылка на комнату скопирована в буфер обмена!');
});

// ============================ ОТОБРАЖЕНИЕ СООБЩЕНИЙ ============================
function renderMessages() {
  messagesDiv.innerHTML = '';
  messages.forEach(msg => {
    const isOwn = msg.senderId === myUserId;
    const div = document.createElement('div');
    div.className = `msg ${isOwn ? 'msg-sent' : 'msg-received'}`;

    const nameSpan = document.createElement('div');
    nameSpan.className = 'msg-name';
    nameSpan.textContent = isOwn ? 'Вы' : (msg.senderName || 'Неизвестный');
    div.appendChild(nameSpan);

    let decryptedText = null;

    if (isOwn) {
      decryptedText = localPlainMessages[msg.id];
    } else {
      try {
        const senderCryptoKey = participants[msg.senderId]?.publicKey;
        if (senderCryptoKey) {
          decryptedText = decryptMessage(
            JSON.parse(msg.encryptedMessage),
            senderCryptoKey,
            myKeyPair.secretKey
          );
        }
      } catch (e) {}
    }

    if (msg.type === 'audio') {
      const audioContainer = document.createElement('div');
      audioContainer.className = 'msg-audio';
      if (decryptedText) {
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.src = decryptedText.startsWith('data:') ? decryptedText : `data:audio/webm;base64,${decryptedText}`;
        audioContainer.appendChild(audio);
      } else {
        audioContainer.textContent = '🔒 Зашифрованное аудио';
      }
      div.appendChild(audioContainer);
    } else {
      const textSpan = document.createElement('div');
      textSpan.textContent = decryptedText || '🔒 Не удалось расшифровать';
      div.appendChild(textSpan);
    }

    const timeSpan = document.createElement('div');
    timeSpan.className = 'msg-time';
    timeSpan.textContent = formatTime(msg.createdAt);
    div.appendChild(timeSpan);

    messagesDiv.appendChild(div);
  });
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// ============================ ОТПРАВКА СООБЩЕНИЙ ============================
async function sendTextMessage(text) {
  if (!text.trim() || !roomId) return;
  const recipientId = Object.keys(participants).find(id => id !== myUserId);
  if (!recipientId) {
    alert('Ожидайте подключения второго участника!');
    return;
  }
  const recipientPublicKey = participants[recipientId]?.publicKey;
  if (!recipientPublicKey) return;

  const encrypted = encryptMessage(text, recipientPublicKey, myKeyPair.secretKey);
  
  const docRef = await messagesRef.add({
    senderId: myUserId,
    senderName: myName,
    encryptedMessage: JSON.stringify(encrypted),
    type: 'text',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  
  localPlainMessages[docRef.id] = text;
  msgInput.value = '';
  emojiPicker.style.display = 'none';
  msgInput.focus();
}

async function sendAudioMessage(base64Audio) {
  if (!roomId) return;
  const recipientId = Object.keys(participants).find(id => id !== myUserId);
  if (!recipientId) {
    alert('Ожидайте подключения второго участника!');
    return;
  }
  const recipientPublicKey = participants[recipientId]?.publicKey;
  if (!recipientPublicKey) return;

  const encrypted = encryptMessage(base64Audio, recipientPublicKey, myKeyPair.secretKey);
  const docRef = await messagesRef.add({
    senderId: myUserId,
    senderName: myName,
    encryptedMessage: JSON.stringify(encrypted),
    type: 'audio',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  localPlainMessages[docRef.id] = base64Audio;
}

// ============================ ЗАПИСЬ АУДИО И ИВЕНТЫ ============================
recordBtn.addEventListener('click', async () => {
  if (isRecording) {
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    isRecording = false;
    recordBtn.textContent = '🎤';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = event => { if (event.data.size > 0) audioChunks.push(event.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onload = () => sendAudioMessage(reader.result);
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(track => track.stop());
    };
    mediaRecorder.start();
    isRecording = true;
    recordBtn.textContent = '⏹️';
  } catch (e) {
    alert('Нет доступа к микрофону');
  }
});

sendBtn.addEventListener('click', () => sendTextMessage(msgInput.value));
msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendTextMessage(msgInput.value); });

createRoomBtn.addEventListener('click', () => {
  const newRoomId = Math.random().toString(36).substring(2, 8);
  enterRoom(newRoomId);
});

joinRoomBtn.addEventListener('click', () => {
  const id = roomIdInput.value.trim();
  if (id) enterRoom(id);
});

// Автоматический вход при переходе по ссылке
window.addEventListener('load', () => {
  const params = new URLSearchParams(window.location.search);
  const room = params.get('room');
  if (room) enterRoom(room);
});

leaveRoomBtn.addEventListener('click', () => {
  if (unsubscribeMessages) unsubscribeMessages();
  if (unsubscribeParticipants) unsubscribeParticipants();
  if (unsubscribeSignals) unsubscribeSignals();
  if (roomRef && myUserId) participantsRef.doc(myUserId).delete().catch(() => {});
  
  participants = {};
  messages = [];
  localPlainMessages = {};
  roomId = '';
  myUserId = '';
  home.style.display = 'flex';
  chat.style.display = 'none';
  window.history.pushState({}, '', '/');
  hangupCall();
});

// ============================ WEBRTC ЗВОНКИ ============================
function handleSignal(signal, from, fromName) {
  if (!isCallActive && !peer) {
    if (confirm(`Входящий звонок от ${fromName || 'собеседника'}. Принять?`)) {
      callType = 'audio';
      startPeer(false, from, signal);
    }
  } else if (peer && isCallActive) {
    peer.signal(signal);
  }
}

function startPeer(isInitiator, targetUserId, incomingSignal = null) {
  const target = participants[targetUserId];
  if (!target) {
    alert('Собеседник не найден');
    return;
  }

  const constraints = { audio: true, video: callType === 'video' };
  navigator.mediaDevices.getUserMedia(constraints)
    .then(stream => {
      localStream = stream;
      localVideo.srcObject = stream;

      peer = new SimplePeer({
        initiator: isInitiator,
        trickle: true,
        stream: stream,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:openrelay.metered.ca:80' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
          ]
        }
      });

      peer.on('signal', signal => {
        signalRef.add({
          from: myUserId,
          fromName: myName,
          target: targetUserId,
          signal: signal,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      });

      peer.on('stream', rStream => {
        remoteVideo.srcObject = rStream;
        remoteVideo.play().catch(e => console.log('Autoplay:', e));
      });

      peer.on('error', err => hangupCall());
      peer.on('close', () => hangupCall());

      if (incomingSignal) peer.signal(incomingSignal);

      isCallActive = true;
      callContainer.style.display = 'flex';
      callInfo.textContent = isInitiator ? `Звонок ${target.name}...` : `Разговор с ${target.name}`;
    })
    .catch(err => alert('Ошибка доступа к медиаустройствам: ' + err.message));
}

function hangupCall() {
  if (peer) { peer.destroy(); peer = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  remoteVideo.srcObject = null;
  localVideo.srcObject = null;
  callContainer.style.display = 'none';
  isCallActive = false;
  callType = null;
}

audioCallBtn.addEventListener('click', () => {
  if (isCallActive) return;
  const targetId = Object.keys(participants).find(id => id !== myUserId);
  if (!targetId) return alert('Нет собеседника в комнате!');
  callType = 'audio';
  startPeer(true, targetId);
});

videoCallBtn.addEventListener('click', () => {
  if (isCallActive) return;
  const targetId = Object.keys(participants).find(id => id !== myUserId);
  if (!targetId) return alert('Нет собеседника в комнате!');
  callType = 'video';
  startPeer(true, targetId);
});

hangupBtn.addEventListener('click', hangupCall);
</script>
</body>
