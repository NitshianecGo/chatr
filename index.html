<!DOCTYPE html>

<script>
// ======================================================================
// 0. ЛОГГЕР
// ======================================================================
const logBody = document.getElementById('logBody');
const logToggleBtn = document.getElementById('logToggleBtn');
const clearLogBtn = document.getElementById('clearLogBtn');
const logPanel = document.getElementById('logPanel');

function log(level, message, data = null) {
  const entry = document.createElement('div');
  entry.className = 'log-entry ' + level;
  const time = new Date().toLocaleTimeString();
  let text = `<span class="time">[${time}]</span> ${message}`;
  if (data) {
    try {
      const str = typeof data === 'object' ? JSON.stringify(data, null, 2) : String(data);
      text += ' <span style="color:#94a3b8;font-size:0.75rem;">' + str + '</span>';
    } catch(e) {}
  }
  entry.innerHTML = text;
  logBody.appendChild(entry);
  logBody.scrollTop = logBody.scrollHeight;
  console[level === 'error' ? 'error' : level === 'warn' ? 'warn' : 'log'](message, data || '');
}

logToggleBtn.addEventListener('click', () => {
  logPanel.classList.toggle('active');
  logToggleBtn.textContent = logPanel.classList.contains('active') ? '✕ Закрыть логи' : '📋 Логи';
});

clearLogBtn.addEventListener('click', () => {
  logBody.innerHTML = '';
  log('info', 'Логи очищены');
});

// ======================================================================

      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  },
  debug: 2
};

const firebaseConfig = {

// ======================================================================
// 3. ШИФРОВАНИЕ
// ======================================================================
function generateKeyPair() {
  const pair = nacl.box.keyPair();
  return { publicKey: nacl.util.encodeBase64(pair.publicKey), secretKey: nacl.util.encodeBase64(pair.secretKey) };
}
function encryptMessage(msg, recipientPubKey, senderSecKey) {
  const recipientPub = nacl.util.decodeBase64(recipientPubKey);
  const senderSec = nacl.util.decodeBase64(senderSecKey);
  const nonce = nacl.randomBytes(24);
  const msgUint8 = new TextEncoder().encode(msg);
  const encrypted = nacl.box(msgUint8, nonce, recipientPub, senderSec);
  return { nonce: nacl.util.encodeBase64(nonce), encrypted: nacl.util.encodeBase64(encrypted) };
}
function decryptMessage(pkg, senderPubKey, recipientSecKey) {
  try {
    const { nonce, encrypted } = pkg;
    const senderPub = nacl.util.decodeBase64(senderPubKey);
    const recipientSec = nacl.util.decodeBase64(recipientSecKey);
    const nonceUint8 = nacl.util.decodeBase64(nonce);
    const encryptedUint8 = nacl.util.decodeBase64(encrypted);
    const decrypted = nacl.box.open(encryptedUint8, nonceUint8, senderPub, recipientSec);
    if (!decrypted) throw new Error('Decryption failed');
    return new TextDecoder().decode(decrypted);
  } catch (e) {
    log('error', 'Ошибка расшифровки: ' + e.message);
    return null;
  }
}

// ======================================================================
// 5. ГЕНЕРАЦИЯ ФЕЙКОВОГО МЕДИА
// ======================================================================
function createFakeAudioTrack() {
  const audioCtx = new AudioContext();
  const oscillator = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  gain.gain.value = 0;
  oscillator.connect(gain);
  gain.connect(audioCtx.destination);
  oscillator.start();
  const stream = audioCtx.createMediaStreamDestination().stream;
  return stream.getAudioTracks()[0];
}

function createFakeVideoTrack(width = 160, height = 120) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = '#3b82f6';
  ctx.font = '14px sans-serif';
  ctx.fillText('🔒', width/2 - 20, height/2 + 5);
  const stream = canvas.captureStream(1);
  return stream.getVideoTracks()[0];
}

function getFakeStream() {
  const stream = new MediaStream();
  try {
    const audioTrack = createFakeAudioTrack();
    if (audioTrack) stream.addTrack(audioTrack);
    log('info', 'Добавлен фейковый аудио-трек');
  } catch (e) {
    log('warn', 'Не удалось создать фейковый аудио-трек: ' + e.message);
  }
  try {
    const videoTrack = createFakeVideoTrack();
    if (videoTrack) stream.addTrack(videoTrack);
    log('info', 'Добавлен фейковый видео-трек');
  } catch (e) {
    log('warn', 'Не удалось создать фейковый видео-трек: ' + e.message);
  }
  return stream;
}

// ======================================================================
// 6. ВСПОМОГАТЕЛЬНЫЕ
// ======================================================================
function addMessage(sender, content, mediaType = 'text', timestamp = Date.now()) {
  const div = document.createElement('div');
  div.className = 'msg';
  const timeStr = new Date(timestamp).toLocaleTimeString();
  let displayContent = content;
  if (mediaType === 'image') displayContent = `<img src="${content}" alt="Изображение" />`;
  else if (mediaType === 'video') displayContent = `<video src="${content}" controls style="max-width:120px;max-height:120px;"></video>`;
  div.innerHTML = `<span class="sender">${sender}</span> <span class="time">${timeStr}</span><br>${displayContent}`;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

// ======================================================================
// 7. ПРОВЕРКА УСТРОЙСТВ
// ======================================================================
async function testDevices() {
  statusInit.textContent = '🔍 Проверка устройств...';
  log('info', 'Проверка устройств...');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
    stream.getTracks().forEach(t => t.stop());
    statusInit.textContent = '✅ Все устройства работают!';
    log('success', 'Устройства работают');
  } catch (e) {
    statusInit.textContent = '⚠️ Частичная ошибка: ' + e.message;
    log('error', 'Ошибка проверки устройств: ' + e.message);
  }
}

// ======================================================================
// 8. ЗАПУСК МЕДИА
// ======================================================================
async function getMedia(retries = 2) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      hasVideo = true; hasAudio = true;
      log('info', 'Получен реальный поток с видео и аудио');
      return stream;
    } catch (e1) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        hasVideo = false; hasAudio = true;
        log('info', 'Получен реальный поток только с аудио');
        return stream;
      } catch (e2) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
          hasVideo = true; hasAudio = false;
          log('info', 'Получен реальный поток только с видео');
          return stream;
        } catch (e3) {
          if (attempt === retries) {
            log('error', 'Создаём фейковый поток');
            const fakeStream = getFakeStream();
            hasVideo = fakeStream.getVideoTracks().length > 0;
            hasAudio = fakeStream.getAudioTracks().length > 0;
            return fakeStream;
          }
          await new Promise(r => setTimeout(r, 1000));
        }
      }
    }
  }
  return new MediaStream();
}

// ======================================================================
// 9. НАСТРОЙКА ОБРАБОТЧИКОВ СОЕДИНЕНИЯ (ИСПРАВЛЕНО)
// ======================================================================
function setupConnectionHandlers() {
  if (!conn) return;

  sendChatBtn.disabled = true;
  chatInput.disabled = true;
  fileBtn.disabled = true;
  fileInput.disabled = true;
  chatInput.placeholder = "Установка соединения...";

  // Обработчик события успешного открытия канала
  conn.on('open', () => {
    log('success', 'DataChannel открыт!');
    statusDisplay.textContent = '✅ Соединение для чата установлено!';
    
    sendChatBtn.disabled = false;
    chatInput.disabled = false;
    fileBtn.disabled = false;
    fileInput.disabled = false;
    chatInput.placeholder = "Введите сообщение...";

    // Обмен публичным ключом шифрования
    conn.send(JSON.stringify({ type: 'key', publicKey: myKeyPair.publicKey }));
  });

  conn.on('data', handleIncomingData);

  conn.on('close', () => {
    log('warn', 'DataChannel закрыт');
    conn = null;
    sendChatBtn.disabled = true;
    chatInput.disabled = true;
    fileBtn.disabled = true;
    fileInput.disabled = true;
    chatInput.placeholder = "Соединение закрыто";
    statusDisplay.textContent = '⚠️ Соединение чата разорвано.';
  });

  conn.on('error', (err) => {
    log('error', 'DataConnection error: ' + err.message);
    statusDisplay.textContent = '❌ Ошибка соединения: ' + err.message;
  });
}

// ======================================================================
// 10. ОБРАБОТКА ВХОДЯЩИХ ДАННЫХ
// ======================================================================
function handleIncomingData(data) {
  try {
    let parsed;
    if (typeof data === 'string') {
      try {
        parsed = JSON.parse(data);
      } catch (e) {
        addMessage('Товарищ', data, 'text');
        return;
      }
    } else {
      parsed = data;
    }

    if (parsed.type === 'key') {
      peerPublicKey = parsed.publicKey;
      log('success', 'Получен публичный ключ собеседника');
      return;
    }
    if (parsed.type === 'message') {
      let decryptedContent = parsed.content;
      if (parsed.encrypted && peerPublicKey) {
        const decrypted = decryptMessage(parsed.encrypted, peerPublicKey, myKeyPair.secretKey);
        if (decrypted) decryptedContent = decrypted;
      }
      addMessage(parsed.sender || 'Товарищ', decryptedContent, parsed.mediaType || 'text', parsed.timestamp);
      log('info', 'Сообщение получено');
      return;
    }
  } catch (e) {
    log('error', 'Ошибка обработки входящих данных: ' + e.message, e);
  }
}

// ======================================================================
// 11. ОТПРАВКА СООБЩЕНИЯ (ИСПРАВЛЕНО)
// ======================================================================
function sendMessage(text, mediaType = 'text', fileData = null) {
  // Проверяем наличие соединения и флаг conn.open!
  if (!conn || !conn.open) {
    statusDisplay.textContent = '⚠️ Соединение ещё устанавливается, подождите пара секунд...';
    log('warn', 'Попытка отправки до открытия conn.open');
    return;
  }

  const rawContent = fileData || text;
  if (!rawContent && mediaType === 'text') return;

  let encrypted = null;
  let finalContent = rawContent;

  if (peerPublicKey) {
    encrypted = encryptMessage(rawContent, peerPublicKey, myKeyPair.secretKey);
    if (encrypted) finalContent = '[Encrypted]';
  }

  const msg = {
    type: 'message',
    sender: 'Я',
    content: finalContent,
    mediaType,
    timestamp: Date.now(),
    encrypted
  };

  try {
    conn.send(JSON.stringify(msg));
    addMessage('Я', rawContent, mediaType, msg.timestamp);
    log('info', 'Сообщение успешно отправлено');
  } catch (e) {
    log('error', 'Ошибка отправки: ' + e.message, e);
    statusDisplay.textContent = '❌ Ошибка отправки: ' + e.message;
  }
}

// ======================================================================
// 12. СОЗДАНИЕ КОМНАТЫ
// ======================================================================
async function createRoom() {
  try {
    statusInit.textContent = '🛠 Создаём комнату...';
    if (peer) { try { peer.destroy(); } catch(e){} peer = null; }

    const roomId = 'chat-' + Math.random().toString(36).substring(2, 10);
    currentRoom = roomId;
    isInitiator = true;

    myKeyPair = generateKeyPair();

    const stream = await getMedia(2);
    localStream = stream;
    if (hasVideo) localVideo.srcObject = stream;

    peer = new Peer(roomId, PEER_OPTIONS);
    await new Promise((resolve, reject) => {
      peer.on('open', () => resolve());
      peer.on('error', reject);
    });

    peer.on('connection', (dataConn) => {
      if (conn) { dataConn.close(); return; }
      conn = dataConn;
      log('info', 'Принято входящее подключение: ' + dataConn.peer);
      setupConnectionHandlers();
    });

    peer.on('call', (incomingCall) => {
      log('info', 'Входящий звонок');
      statusDisplay.textContent = '📞 Входящий звонок! Нажмите "Аудиозвонок" или "Видеозвонок"';
      window._pendingCall = incomingCall;
    });

    const link = window.location.origin + window.location.pathname + '?room=' + encodeURIComponent(roomId);
    inviteLink.href = link;
    inviteLink.textContent = link;

    showCallBlock();
    statusDisplay.textContent = '⏳ Ожидаем подключения собеседника...';
    statusInit.textContent = 'Готов к связи';

  } catch (err) {
    log('error', 'Ошибка создания комнаты: ' + err.message, err);
    statusInit.textContent = '❌ Ошибка: ' + err.message;
  }
}

// ======================================================================
// 13. ПРИСОЕДИНЕНИЕ К КОМНАТЕ
// ======================================================================
async function joinRoom(roomId) {
  try {
    if (!roomId) {
      statusInit.textContent = '❌ Введите ID комнаты.';
      return;
    }
    if (peer) { try { peer.destroy(); } catch(e){} peer = null; }

    currentRoom = roomId;
    isInitiator = false;

    myKeyPair = generateKeyPair();

    const stream = await getMedia(2);
    localStream = stream;
    if (hasVideo) localVideo.srcObject = stream;

    peer = new Peer(PEER_OPTIONS);
    await new Promise((resolve, reject) => {
      peer.on('open', () => resolve());
      peer.on('error', reject);
    });

    conn = peer.connect(roomId);
    setupConnectionHandlers();

    showCallBlock();
    document.getElementById('inviteArea').classList.remove('active');
    statusDisplay.textContent = '⏳ Соединение устанавливается...';
    statusInit.textContent = 'Готов к связи';

  } catch (err) {
    log('error', 'Ошибка присоединения: ' + err.message, err);
    statusInit.textContent = '❌ Ошибка соединения: ' + err.message;
  }
}

// ======================================================================
// 14. ИНИЦИАЦИЯ ЗВОНКА
// ======================================================================
function startCall(wantVideo) {
  if (!peer || !currentRoom || call) return;
  if (!localStream) return;

  log('info', 'Начало звонка...');
  const callObj = peer.call(currentRoom, localStream);
  call = callObj;

  call.on('stream', (remote) => {
    remoteStream = remote;
    remoteVideo.srcObject = remote;
    statusDisplay.textContent = '📞 На связи!';
  });
  call.on('close', () => {
    remoteVideo.srcObject = null;
    statusDisplay.textContent = '🔴 Звонок завершён.';
    call = null;
  });
  call.on('error', (err) => {
    log('error', 'Ошибка звонка: ' + err.message);
    call = null;
  });
}

// ======================================================================
// 15. УПРАВЛЕНИЕ ИНТЕРФЕЙСОМ И БЛОКАМИ
// ======================================================================
function showCallBlock() {
  initBlock.style.display = 'none';
  callBlock.style.display = 'block';
  document.getElementById('videoGrid').classList.add('active');
  document.getElementById('callControls').classList.add('active');
  document.getElementById('chatArea').classList.add('active');
  document.getElementById('inviteArea').classList.add('active');
}

function hideCallBlock() {
  initBlock.style.display = 'block';
  callBlock.style.display = 'none';
  document.getElementById('videoGrid').classList.remove('active');
  document.getElementById('callControls').classList.remove('active');
  document.getElementById('chatArea').classList.remove('active');
  document.getElementById('inviteArea').classList.remove('active');
}

function exitRoom() {
  if (call) { call.close(); call = null; }
  if (conn) { conn.close(); conn = null; }
  if (peer) { peer.destroy(); peer = null; }
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  remoteVideo.srcObject = null;
  localVideo.srcObject = null;
  hideCallBlock();
  chatMessages.innerHTML = '';
  currentRoom = null;
  peerPublicKey = null;
  statusInit.textContent = 'Вы вышли из комнаты.';
  
  sendChatBtn.disabled = true;
  chatInput.disabled = true;
  fileBtn.disabled = true;
  fileInput.disabled = true;
  chatInput.placeholder = "Соединение закрыто";
}

// ======================================================================
// 16. СОБЫТИЯ ЭЛЕМЕНТОВ
// ======================================================================
createRoomBtn.addEventListener('click', createRoom);
joinRoomBtn.addEventListener('click', () => {
  joinPanel.style.display = joinPanel.style.display === 'none' ? 'flex' : 'none';
});
doJoinBtn.addEventListener('click', () => joinRoom(roomInput.value.trim()));
testDeviceBtn.addEventListener('click', testDevices);
audioCallBtn.addEventListener('click', () => startCall(false));
videoCallBtn.addEventListener('click', () => startCall(true));
hangupBtn.addEventListener('click', exitRoom);
exitRoomBtn.addEventListener('click', exitRoom);

toggleAudioBtn.addEventListener('click', () => {
  if (localStream && localStream.getAudioTracks().length) {
    const tr = localStream.getAudioTracks()[0];
    tr.enabled = !tr.enabled;
    toggleAudioBtn.textContent = tr.enabled ? '🔇 Заглушить' : '🔊 Включить';
  }
});

toggleVideoBtn.addEventListener('click', () => {
  if (localStream && localStream.getVideoTracks().length) {
    const tr = localStream.getVideoTracks()[0];
    tr.enabled = !tr.enabled;
    toggleVideoBtn.textContent = tr.enabled ? '📷 Выключить' : '📷 Включить';
  }
});

copyLinkBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(inviteLink.href).then(() => {
    statusDisplay.textContent = '✅ Ссылка скопирована!';
  });
});

sendChatBtn.addEventListener('click', () => {
  const text = chatInput.value.trim();
  if (text) {
    sendMessage(text);
    chatInput.value = '';
  }
});

chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChatBtn.click();
});

fileInput.addEventListener('change', (e) => {
  const files = e.target.files;
  for (let file of files) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const base64 = ev.target.result;
      const mediaType = file.type.startsWith('video/') ? 'video' : 'image';
      sendMessage(base64, mediaType);
    };
    reader.readAsDataURL(file);
  }
  fileInput.value = '';
});

emojiToggleBtn.addEventListener('click', () => emojiPicker.classList.toggle('active'));
emojiPicker.addEventListener('click', (e) => {
  if (e.target.tagName === 'SPAN') {
    chatInput.value += e.target.textContent;
    chatInput.focus();
    emojiPicker.classList.remove('active');
  }
});

// ======================================================================
// 17. ИНИЦИАЛИЗАЦИЯ И АВТОВХОД
// ======================================================================
window.addEventListener('load', () => {
  setTimeout(() => {
    splash.classList.add('hidden');
    app.classList.add('visible');
  }, 2500);

  const params = new URLSearchParams(window.location.search);
  const room = params.get('room');
  if (room) {
    log('info', 'Автовход по ссылке в комнату: ' + room);
    setTimeout(() => joinRoom(room), 1500);
  }
});
