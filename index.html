<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chat App</title>
  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <!-- simple-peer -->
  <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
  <style>
    /* ===== ОСНОВНЫЕ СТИЛИ (без изменений) ===== */
    :root {
      --bg-body: #0f172a;
      --bg-app: #1e293b;
      --bg-messages: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --msg-sent: #2563eb;
      --msg-sent-text: #ffffff;
      --msg-received: #334155;
      --msg-received-text: #f8fafc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #app {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 800px;
      background: var(--bg-app);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }
    #home {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      text-align: center;
    }
    #home h1 { font-size: 2rem; margin-bottom: 10px; }
    #home p { color: var(--text-muted); margin-bottom: 25px; font-size: 0.95rem; }
    
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover { background: var(--primary-hover); }

    #chat { display: none; flex-direction: column; height: 100%; }
    #header {
      padding: 8px 12px;
      background: var(--bg-app);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    #header h2 { font-size: 0.9rem; font-weight: 600; }
    #header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }
    #header-actions button {
      background: none;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      color: var(--text-main);
      background: var(--border-color);
    }
    #header-actions button:hover { background: var(--primary); }

    /* Стили для кнопок звонков с номерами */
    .call-btn {
      font-size: 0.7rem !important;
      padding: 2px 6px !important;
      min-width: 30px;
    }
    .call-btn.active { background: var(--primary); }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg-messages);
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      word-wrap: break-word;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .msg-sent {
      align-self: flex-end;
      background: var(--msg-sent);
      color: var(--msg-sent-text);
      border-bottom-right-radius: 4px;
    }
    .msg-received {
      align-self: flex-start;
      background: var(--msg-received);
      color: var(--msg-received-text);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }
    .msg-name { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
    .msg-sent .msg-name { color: #bfdbfe; }
    .msg-time { font-size: 0.65rem; opacity: 0.7; margin-top: 4px; text-align: right; }
    .msg-audio audio { max-width: 200px; height: 36px; }
    .msg-photo img {
      max-width: 200px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    #emoji-picker {
      display: none;
      padding: 8px;
      background: var(--bg-app);
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 8px;
      max-height: 110px;
      overflow-y: auto;
    }
    #emoji-picker span { font-size: 1.3rem; cursor: pointer; padding: 4px; }

    #input-area {
      padding: 10px 12px;
      background: var(--bg-app);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    #input-area input {
      flex: 1;
      border: 1px solid var(--border-color);
      background: var(--bg-body);
      color: var(--text-main);
      border-radius: 24px;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      min-width: 120px;
    }
    .icon-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      color: var(--text-main);
    }
    #sendBtn {
      background: var(--primary);
      border: none;
      color: white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* Модалка для селфи */
    #selfie-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92);
      z-index: 50;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #selfie-video {
      width: 100%;
      max-width: 320px;
      border-radius: 20px;
      background: #000;
      transform: scaleX(-1); /* Зеркальное отображение */
    }
    #selfie-controls {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    #selfie-controls button {
      background: var(--primary);
      border: none;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    #selfie-controls .close-btn { background: #ef4444; }

    /* Звонки */
    #call-container {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }
    #call-container video {
      width: 100%; max-width: 360px;
      background: #1e293b;
      border-radius: 12px;
    }
    #call-controls button {
      background: #ef4444; border: none; color: white;
      border-radius: 50%; width: 56px; height: 56px;
      font-size: 1.4rem; cursor: pointer; margin-top: 20px;
    }
    .call-info { color: white; font-size: 1.1rem; margin-bottom: 15px; font-weight: 600; }

    #incoming-call-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 40;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .call-modal-box {
      background: var(--bg-app);
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid var(--border-color);
    }
    .call-modal-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 20px;
    }
    .btn-accept { background: #22c55e; color: white; }
    .btn-reject { background: #ef4444; color: white; }
  </style>
</head>
<body>
<div id="app">
  <div id="home">
    <h1>📱 Chat Test</h1>
    <p>Аудиозвонки × 5 конфигураций</p>
    <button class="btn" id="createRoomBtn">➕ Создать комнату</button>
  </div>

  <div id="chat">
    <div id="header">
      <h2 id="roomTitle">Комната</h2>
      <div id="header-actions">
        <button id="copyLinkBtn" title="Скопировать ссылку">🔗</button>
        <!-- 5 кнопок для аудиозвонков -->
        <button class="call-btn" data-config="0">📞1</button>
        <button class="call-btn" data-config="1">📞2</button>
        <button class="call-btn" data-config="2">📞3</button>
        <button class="call-btn" data-config="3">📞4</button>
        <button class="call-btn" data-config="4">📞5</button>
        <!-- Видеозвонок (стандартный) -->
        <button id="videoCallBtn" title="Видеозвонок">📹</button>
        <button id="leaveRoomBtn" title="Выйти">✕</button>
      </div>
    </div>
    <div id="messages"></div>

    <div id="emoji-picker">
      <span>😀</span><span>😂</span><span>😍</span><span>👍</span><span>❤️</span>
      <span>🔥</span><span>🎉</span><span>😎</span><span>🙏</span><span>💩</span>
    </div>

    <div id="input-area">
      <button class="icon-btn" id="emojiBtn">😀</button>
      <button class="icon-btn" id="recordBtn" title="Голосовое">🎤</button>
      <button class="icon-btn" id="selfieBtn" title="Селфи">🤳</button>
      <input id="msgInput" placeholder="Сообщение..." autocomplete="off">
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <!-- Модалка для селфи -->
  <div id="selfie-modal">
    <video id="selfie-video" autoplay playsinline muted></video>
    <div id="selfie-controls">
      <button id="takeSelfieBtn">📸 Сделать</button>
      <button class="close-btn" id="closeSelfieBtn">✕ Закрыть</button>
    </div>
  </div>

  <!-- Звонки -->
  <div id="call-container">
    <div class="call-info" id="callInfo">Звонок...</div>
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted style="width:100px; position:absolute; bottom:90px; right:20px; border-radius:10px; background:#1e293b;"></video>
    <audio id="remoteAudio" autoplay></audio>
    <div id="call-controls">
      <button id="hangupBtn">📴</button>
    </div>
  </div>

  <div id="incoming-call-modal">
    <div class="call-modal-box">
      <h3 id="incomingCallText">Входящий звонок</h3>
      <div class="call-modal-actions">
        <button class="btn btn-accept" id="acceptCallBtn">📞 Ответить</button>
        <button class="btn btn-reject" id="rejectCallBtn">📴 Отклонить</button>
      </div>
    </div>
  </div>
</div>

<script>
window.global = window;

// ============================ FIREBASE ============================
const firebaseConfig = {
  apiKey: "AIzaSyDYRkGlyl5ySs4AyCuJEM39M-4FPok9sKA",
  authDomain: "chatt-6d410.firebaseapp.com",
  projectId: "chatt-6d410",
  storageBucket: "chatt-6d410.firebasestorage.app",
  messagingSenderId: "901741126959",
  appId: "1:901741126959:web:97734153fa537a5ab16dda"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ============================ СОСТОЯНИЯ ============================
let roomId = '', myName = '', myUserId = '';
let roomRef = null, messagesRef = null, participantsRef = null, signalRef = null;
let unsubscribeMessages = null, unsubscribeParticipants = null, unsubscribeSignals = null;
const processedMsgIds = new Set();
let participants = {};

let peer = null, localStream = null, isCallActive = false, pendingCallData = null;

let mediaRecorder = null, audioChunks = [], isRecording = false;

// Для селфи
let selfieStream = null;

// DOM
const home = document.getElementById('home');
const chat = document.getElementById('chat');
const messagesDiv = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const createRoomBtn = document.getElementById('createRoomBtn');
const roomTitle = document.getElementById('roomTitle');
const leaveRoomBtn = document.getElementById('leaveRoomBtn');
const videoCallBtn = document.getElementById('videoCallBtn');
const recordBtn = document.getElementById('recordBtn');
const selfieBtn = document.getElementById('selfieBtn');
const emojiBtn = document.getElementById('emojiBtn');
const emojiPicker = document.getElementById('emoji-picker');
const copyLinkBtn = document.getElementById('copyLinkBtn');

const callContainer = document.getElementById('call-container');
const remoteVideo = document.getElementById('remoteVideo');
const localVideo = document.getElementById('localVideo');
const remoteAudio = document.getElementById('remoteAudio');
const hangupBtn = document.getElementById('hangupBtn');
const callInfo = document.getElementById('callInfo');

const incomingCallModal = document.getElementById('incoming-call-modal');
const incomingCallText = document.getElementById('incomingCallText');
const acceptCallBtn = document.getElementById('acceptCallBtn');
const rejectCallBtn = document.getElementById('rejectCallBtn');

const selfieModal = document.getElementById('selfie-modal');
const selfieVideo = document.getElementById('selfie-video');
const takeSelfieBtn = document.getElementById('takeSelfieBtn');
const closeSelfieBtn = document.getElementById('closeSelfieBtn');

// ============================ ВСПОМОГАТЕЛЬНЫЕ ============================
function generateRandomName() {
  const adjs = ['Быстрый', 'Тихий', 'Умный', 'Сильный', 'Весёлый', 'Смелый'];
  const nouns = ['Лис', 'Волк', 'Заяц', 'Сокол', 'Дельфин', 'Тигр'];
  return adjs[Math.floor(Math.random() * adjs.length)] + ' ' + nouns[Math.floor(Math.random() * nouns.length)];
}
function generateUserId() { return 'usr_' + Math.random().toString(36).substring(2, 9); }
function formatTime(timestamp) {
  if (!timestamp) return '';
  const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

// ============================ ВХОД / ВЫХОД ============================
async function enterRoom(roomIdParam) {
  roomId = roomIdParam;
  myUserId = generateUserId();
  myName = generateRandomName();

  roomRef = db.collection('rooms').doc(roomId);
  messagesRef = roomRef.collection('messages');
  participantsRef = roomRef.collection('participants');
  signalRef = roomRef.collection('signals');

  await participantsRef.doc(myUserId).set({ name: myName, joinedAt: firebase.firestore.FieldValue.serverTimestamp() });

  unsubscribeParticipants = participantsRef.onSnapshot(snapshot => {
    participants = {};
    snapshot.forEach(doc => { participants[doc.id] = doc.data(); });
    roomTitle.textContent = `Комната (${Object.keys(participants).length})`;
  });

  unsubscribeMessages = messagesRef.orderBy('createdAt', 'asc').onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === 'added') {
        const doc = change.doc;
        if (!processedMsgIds.has(doc.id)) {
          processedMsgIds.add(doc.id);
          renderSingleMessage(doc.id, doc.data());
        }
      }
    });
  });

  unsubscribeSignals = signalRef.where('target', '==', myUserId).onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === 'added') {
        const data = change.doc.data();
        change.doc.ref.delete().catch(() => {});
        handleIncomingSignal(data);
      }
    });
  });

  window.location.hash = roomId;
  home.style.display = 'none';
  chat.style.display = 'flex';
  msgInput.focus();
}

window.addEventListener('beforeunload', () => {
  if (participantsRef && myUserId) participantsRef.doc(myUserId).delete();
});

function leaveRoom() {
  if (participantsRef && myUserId) participantsRef.doc(myUserId).delete().catch(() => {});
  if (unsubscribeMessages) unsubscribeMessages();
  if (unsubscribeParticipants) unsubscribeParticipants();
  if (unsubscribeSignals) unsubscribeSignals();
  processedMsgIds.clear();
  participants = {};
  roomId = ''; myUserId = '';
  hangupCall();
  home.style.display = 'flex';
  chat.style.display = 'none';
  window.location.hash = '';
}
leaveRoomBtn.addEventListener('click', leaveRoom);
createRoomBtn.addEventListener('click', () => {
  const newRoomId = Math.random().toString(36).substring(2, 8);
  enterRoom(newRoomId);
});
copyLinkBtn.addEventListener('click', () => {
  const link = `${window.location.origin}${window.location.pathname}#${roomId}`;
  navigator.clipboard.writeText(link).then(() => alert('Ссылка скопирована!'));
});

// ============================ ОТРИСОВКА СООБЩЕНИЙ ============================
function renderSingleMessage(id, msg) {
  const isOwn = msg.senderId === myUserId;
  const div = document.createElement('div');
  div.className = `msg ${isOwn ? 'msg-sent' : 'msg-received'}`;

  const nameSpan = document.createElement('div');
  nameSpan.className = 'msg-name';
  nameSpan.textContent = isOwn ? 'Вы' : (msg.senderName || 'Участник');
  div.appendChild(nameSpan);

  const content = msg.content || '';

  if (msg.type === 'audio') {
    const container = document.createElement('div');
    container.className = 'msg-audio';
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.src = content;
    container.appendChild(audio);
    div.appendChild(container);
  } else if (msg.type === 'photo') {
    const img = document.createElement('img');
    img.src = content;
    img.style.maxWidth = '200px';
    img.style.borderRadius = '12px';
    div.appendChild(img);
  } else {
    const textSpan = document.createElement('div');
    textSpan.textContent = content;
    div.appendChild(textSpan);
  }

  const timeSpan = document.createElement('div');
  timeSpan.className = 'msg-time';
  timeSpan.textContent = formatTime(msg.createdAt);
  div.appendChild(timeSpan);

  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// ============================ ОТПРАВКА СООБЩЕНИЙ ============================
async function sendTextMessage(text) {
  if (!text.trim() || !roomId) return;
  await messagesRef.add({
    senderId: myUserId,
    senderName: myName,
    content: text,
    type: 'text',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  msgInput.value = '';
  emojiPicker.style.display = 'none';
  msgInput.focus();
}

async function sendMediaMessage(base64Data, type) {
  if (!roomId) return;
  if (base64Data.length > 900000) {
    alert('Файл слишком большой для Firestore.');
    return;
  }
  await messagesRef.add({
    senderId: myUserId,
    senderName: myName,
    content: base64Data,
    type: type,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

sendBtn.addEventListener('click', () => sendTextMessage(msgInput.value));
msgInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendTextMessage(msgInput.value); });

emojiBtn.addEventListener('click', () => {
  emojiPicker.style.display = emojiPicker.style.display === 'flex' ? 'none' : 'flex';
});
emojiPicker.addEventListener('click', e => {
  if (e.target.tagName === 'SPAN') {
    msgInput.value += e.target.textContent;
    msgInput.focus();
  }
});

// ============================ ГОЛОСОВЫЕ ============================
recordBtn.addEventListener('click', async () => {
  if (isRecording) {
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    isRecording = false;
    recordBtn.textContent = '🎤';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
    mediaRecorder = new MediaRecorder(stream, { audioBitsPerSecond: 24000 });
    audioChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onload = () => sendMediaMessage(reader.result, 'audio');
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start();
    isRecording = true;
    recordBtn.textContent = '⏹️';
  } catch (e) {
    alert('Микрофон недоступен');
  }
});

// ============================ СЕЛФИ (ЗЕРКАЛЬНАЯ КАМЕРА) ============================
selfieBtn.addEventListener('click', async () => {
  try {
    selfieStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 320 } },
      audio: false
    });
    selfieVideo.srcObject = selfieStream;
    selfieModal.style.display = 'flex';
  } catch (e) {
    alert('Не удалось получить доступ к камере.');
  }
});

closeSelfieBtn.addEventListener('click', closeSelfie);

function closeSelfie() {
  if (selfieStream) {
    selfieStream.getTracks().forEach(t => t.stop());
    selfieStream = null;
  }
  selfieModal.style.display = 'none';
}

takeSelfieBtn.addEventListener('click', () => {
  if (!selfieStream) return;
  // Захватываем кадр с зеркальным отражением
  const canvas = document.createElement('canvas');
  canvas.width = 320;
  canvas.height = 320;
  const ctx = canvas.getContext('2d');
  // Отражаем по горизонтали (зеркально)
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(selfieVideo, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
  sendMediaMessage(dataUrl, 'photo');
  closeSelfie();
});

// ============================ АУДИОЗВОНКИ (5 КОНФИГУРАЦИЙ) ============================
// Массив конфигураций
const callConfigs = [
  { name: 'Стандартный', iceServers: [{ urls: 'stun:stun.l.google.com:19302' }], trickle: true },
  { name: 'Только STUN', iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }], trickle: true },
  { name: 'Доп. STUN', iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun.ekiga.net' }], trickle: true },
  { name: 'Trickle: false', iceServers: [{ urls: 'stun:stun.l.google.com:19302' }], trickle: false },
  { name: 'С TURN', iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'turn:turn.anyfirewall.com:3478?transport=udp' }], trickle: true }
];

// Назначаем обработчики на 5 кнопок
document.querySelectorAll('.call-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const idx = parseInt(btn.dataset.config);
    const config = callConfigs[idx];
    console.log(`📞 Аудиозвонок с конфигурацией #${idx+1}: ${config.name}`);
    startAudioCall(config);
  });
});

function startAudioCall(config) {
  const targetId = Object.keys(participants).find(id => id !== myUserId);
  if (!targetId) {
    alert('Нет второго участника в комнате!');
    return;
  }
  startPeerConnection(true, targetId, false, null, config);
}

// Видеозвонок (стандартный)
videoCallBtn.addEventListener('click', () => {
  const targetId = Object.keys(participants).find(id => id !== myUserId);
  if (!targetId) return alert('Нет второго участника!');
  startPeerConnection(true, targetId, true, null, { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }], trickle: true });
});

// ============================ WEBRTC (ОБЩАЯ ФУНКЦИЯ) ============================
async function startPeerConnection(isInitiator, targetUserId, wantVideo, incomingSignal = null, config = null) {
  if (peer) hangupCall();

  // Если конфиг не передан, используем стандартный
  if (!config) {
    config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }], trickle: true };
  }

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: wantVideo ? { width: 480, height: 360 } : false
    });
  } catch (e) {
    alert('Ошибка доступа к камере/микрофону');
    return;
  }

  localVideo.srcObject = localStream;

  peer = new SimplePeer({
    initiator: isInitiator,
    trickle: config.trickle !== undefined ? config.trickle : true,
    stream: localStream,
    config: { iceServers: config.iceServers || [{ urls: 'stun:stun.l.google.com:19302' }] }
  });

  peer.on('signal', signal => {
    signalRef.add({
      from: myUserId,
      fromName: myName,
      target: targetUserId,
      callType: wantVideo ? 'video' : 'audio',
      signal: signal,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  });

  peer.on('stream', rStream => {
    remoteVideo.srcObject = rStream;
    remoteAudio.srcObject = rStream;
    remoteVideo.play().catch(() => {});
    remoteAudio.play().catch(() => {});
  });

  peer.on('error', err => {
    console.error('Peer error:', err);
    hangupCall();
  });
  peer.on('close', () => hangupCall());

  if (incomingSignal) peer.signal(incomingSignal);

  isCallActive = true;
  callContainer.style.display = 'flex';
  callInfo.textContent = isInitiator ? 'Звоним собеседнику...' : 'Идет разговор';
}

function hangupCall() {
  isCallActive = false;
  pendingCallData = null;
  if (peer) { try { peer.destroy(); } catch(e){} peer = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  remoteVideo.srcObject = null;
  remoteAudio.srcObject = null;
  localVideo.srcObject = null;
  callContainer.style.display = 'none';
}

hangupBtn.addEventListener('click', hangupCall);

// ============================ ВХОДЯЩИЕ ЗВОНКИ ============================
function handleIncomingSignal(data) {
  const { signal, from, fromName, callType } = data;

  if (!isCallActive && !peer) {
    pendingCallData = data;
    const isVideo = callType === 'video';
    incomingCallText.textContent = `Входящий ${isVideo ? 'видеозвонок' : 'аудиозвонок'} от ${fromName || 'участника'}`;
    incomingCallModal.style.display = 'flex';
  } else if (peer) {
    try { peer.signal(signal); } catch(e) {}
  }
}

acceptCallBtn.addEventListener('click', () => {
  incomingCallModal.style.display = 'none';
  if (pendingCallData) {
    const { from, callType, signal } = pendingCallData;
    startPeerConnection(false, from, callType === 'video', signal);
    pendingCallData = null;
  }
});

rejectCallBtn.addEventListener('click', () => {
  incomingCallModal.style.display = 'none';
  pendingCallData = null;
});

// ============================ АВТО-ВХОД ============================
window.addEventListener('load', () => {
  const hash = window.location.hash.replace('#', '').trim();
  if (hash) enterRoom(hash);
});
</script>
