<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Чат и Звонки</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --chat-bg: #ffffff;
      --msg-my: #4f46e5;
      --msg-peer: #f3f4f6;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    
    body { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      background: var(--bg-gradient);
      padding: 10px;
    }

    .chat-card { 
      width: 100%; 
      max-width: 480px; 
      height: 680px; 
      background: var(--chat-bg); 
      border-radius: 20px; 
      display: flex; 
      flex-direction: column; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04); 
      overflow: hidden; 
    }
    
    /* Шапка */
    .header { 
      padding: 16px 20px; 
      background: #ffffff; 
      color: #1f2937; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid #f3f4f6;
    }
    .header h3 { font-size: 18px; font-weight: 700; color: #111827; }
    .header-btns { display: flex; gap: 8px; }
    
    .btn {
      border: none;
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .call-btn { background: #10b981; color: white; }
    .call-btn:hover { background: #059669; }
    .log-btn { background: #f3f4f6; color: #4b5563; }
    .log-btn:hover { background: #e5e7eb; }

    /* Информационная панель */
    .invite-bar { 
      padding: 10px 16px; 
      background: #f9fafb; 
      font-size: 13px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      gap: 12px; 
      border-bottom: 1px solid #f3f4f6; 
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      color: #6b7280;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
    }
    .status-dot.online { background: #10b981; }
    .status-dot.error { background: #ef4444; }

    .invite-btn { 
      padding: 6px 12px; 
      background: #edf2f7; 
      color: #319795; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600;
      font-size: 12px;
    }
    .invite-btn:hover { background: #e2e8f0; }

    /* Панель логов */
    .logs-container { 
      display: none; 
      flex-direction: column; 
      background: #1e293b; 
      border-bottom: 1px solid #334155; 
    }
    .logs-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 8px 12px; 
      background: #0f172a; 
      color: #94a3b8; 
      font-size: 11px; 
    }
    .copy-log-btn { 
      background: var(--primary); 
      color: white; 
      border: none; 
      padding: 4px 8px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 10px; 
    }
    .logs-panel { 
      height: 120px; 
      color: #38bdf8; 
      font-family: ui-monospace, SFMono-Regular, monospace; 
      font-size: 11px; 
      padding: 10px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
    }
    .logs-panel .log-entry.err { color: #f87171; }

    /* Окно сообщений */
    .messages { 
      flex: 1; 
      padding: 16px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      background: #fafafa;
    }
    .msg { 
      max-width: 75%; 
      padding: 10px 14px; 
      border-radius: 16px; 
      word-break: break-word; 
      font-size: 14px; 
      line-height: 1.4;
      position: relative;
    }
    .msg-time {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 4px;
      text-align: right;
    }
    .msg.my { 
      align-self: flex-end; 
      background: var(--msg-my); 
      color: white; 
      border-bottom-right-radius: 4px;
    }
    .msg.peer { 
      align-self: flex-start; 
      background: var(--msg-peer); 
      color: #1f2937; 
      border-bottom-left-radius: 4px;
    }
    .msg.system { 
      align-self: center; 
      background: #e0e7ff; 
      color: #3730a3; 
      font-size: 12px; 
      border-radius: 20px;
      padding: 4px 12px;
    }

    /* Футер ввода */
    .footer { 
      padding: 12px 16px; 
      display: flex; 
      gap: 10px; 
      border-top: 1px solid #f3f4f6; 
      align-items: center; 
      background: #ffffff;
    }
    .footer input { 
      flex: 1; 
      padding: 10px 16px; 
      border: 1px solid #e5e7eb; 
      border-radius: 24px; 
      outline: none; 
      font-size: 14px;
      transition: border 0.2s;
    }
    .footer input:focus { border-color: var(--primary); }
    
    .emoji-btn, .send-btn { 
      background: none; 
      border: none; 
      cursor: pointer; 
      transition: transform 0.1s;
    }
    .emoji-btn { font-size: 22px; }
    .send-btn { 
      background: var(--primary); 
      color: white; 
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .send-btn:hover { background: var(--primary-hover); }

    .emoji-picker { 
      display: none; 
      padding: 10px; 
      background: #ffffff; 
      border-top: 1px solid #f3f4f6; 
      gap: 12px; 
      font-size: 22px; 
      justify-content: space-around; 
    }
    .emoji-picker span { cursor: pointer; transition: transform 0.1s; }
    .emoji-picker span:hover { transform: scale(1.2); }
  </style>
</head>
<body>

<div class="chat-card">
  <!-- Шапка -->
  <div class="header">
    <h3>P2P Чат</h3>
    <div class="header-btns">
      <button class="btn log-btn" onclick="toggleLogs()">📜 Логи</button>
      <button class="btn call-btn" onclick="startCall()">📞 Звонок</button>
    </div>
  </div>

  <!-- Статус и приглашение -->
  <div class="invite-bar">
    <div class="status-badge">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text">Инициализация...</span>
    </div>
    <button class="invite-btn" onclick="copyInviteLink()">📋 Ссылка-приглашение</button>
  </div>

  <!-- Контейнер логов -->
  <div class="logs-container" id="logs-container">
    <div class="logs-header">
      <span>Журнал событий</span>
      <button class="copy-log-btn" onclick="copyAllLogs()">Копировать</button>
    </div>
    <div class="logs-panel" id="logs-panel"></div>
  </div>

  <!-- Чат -->
  <div class="messages" id="messages"></div>

  <!-- Панель эмодзи -->
  <div class="emoji-picker" id="emoji-picker">
    <span onclick="addEmoji('😀')">😀</span>
    <span onclick="addEmoji('😂')">😂</span>
    <span onclick="addEmoji('❤️')">❤️</span>
    <span onclick="addEmoji('👍')">👍</span>
    <span onclick="addEmoji('🔥')">🔥</span>
    <span onclick="addEmoji('🎉')">🎉</span>
  </div>

  <!-- Поле ввода -->
  <div class="footer">
    <button class="emoji-btn" onclick="toggleEmoji()">😊</button>
    <input type="text" id="message-input" placeholder="Введите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<audio id="remote-audio" autoplay></audio>

<script>
  let rawLogs = [];

  function log(msg, isErr = false) {
    const time = new Date().toLocaleTimeString();
    const formatted = `[${time}] ${msg}`;
    rawLogs.push(formatted);

    const logsPanel = document.getElementById('logs-panel');
    const entry = document.createElement('div');
    entry.className = `log-entry ${isErr ? 'err' : ''}`;
    entry.innerText = formatted;
    logsPanel.appendChild(entry);
    logsPanel.scrollTop = logsPanel.scrollHeight;
    console.log(`[LOG] ${msg}`);
  }

  function setStatus(text, state = 'default') {
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    statusText.innerText = text;
    statusDot.className = `status-dot ${state}`;
  }

  function copyAllLogs() {
    if (rawLogs.length === 0) return alert("Логи пусты!");
    navigator.clipboard.writeText(rawLogs.join('\n')).then(() => {
      alert("Логи скопированы!");
    });
  }

  log("Инициализация PeerJS...");

  const peer = new Peer({
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:global.stun.twilio.com:3478' }
      ]
    }
  });

  let conn = null;
  let targetPeerId = null;

  peer.on('open', (id) => {
    log(`Мой Peer ID: ${id}`);
    const remoteId = window.location.hash.substring(1);
    
    if (remoteId && remoteId !== id) {
      targetPeerId = remoteId;
      log(`Подключение к ID из URL: ${remoteId}...`);
      setStatus('Подключение...', 'default');
      connectToPeer(remoteId);
    } else {
      log("Ожидание подключения...");
      setStatus('Готов к подключению', 'default');
    }
  });

  peer.on('error', (err) => {
    log(`Ошибка PeerJS (${err.type}): ${err.message}`, true);
    if (err.type === 'peer-unavailable') {
      setStatus('Собеседник не найден', 'error');
      appendMessage('Собеседник недоступен. Отправьте новую ссылку.', 'system');
    }
  });

  peer.on('connection', (c) => {
    log(`Входящее подключение от: ${c.peer}`);
    conn = c;
    targetPeerId = c.peer; // Фикс: запоминаем ID собеседника для обратного вызова
    bindConnectionEvents();
  });

  function connectToPeer(remoteId) {
    conn = peer.connect(remoteId, { reliable: true });
    bindConnectionEvents();
  }

  function bindConnectionEvents() {
    if (!conn) return;

    conn.on('open', () => {
      log("Канал связи открыт!");
      setStatus('В сети', 'online');
      appendMessage('Соединение установлено!', 'system');
    });

    conn.on('data', (data) => {
      log(`Сообщение: "${data}"`);
      appendMessage(data, 'peer');
    });

    conn.on('close', () => {
      log("Соединение закрыто", true);
      setStatus('Собеседник отключился', 'error');
      appendMessage('Собеседник вышел из чата', 'system');
      conn = null;
    });

    conn.on('error', (err) => {
      log(`Ошибка канала: ${err}`, true);
      setStatus('Ошибка подключения', 'error');
    });
  }

  peer.on('call', async (call) => {
    log(`Входящий звонок от: ${call.peer}`);
    if (confirm("Входящий голосовой вызов! Ответить?")) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        call.answer(stream);
        call.on('stream', (remoteStream) => {
          document.getElementById('remote-audio').srcObject = remoteStream;
        });
      } catch (e) {
        log(`Ошибка микрофона: ${e.message}`, true);
        alert("Не удалось получить доступ к микрофону");
      }
    }
  });

  function copyInviteLink() {
    if (!peer.id) return alert("Сеть еще не готова!");
    const baseUrl = window.location.href.split('#')[0];
    const link = `${baseUrl}#${peer.id}`;
    
    navigator.clipboard.writeText(link).then(() => {
      alert("Ссылка скопирована! Отправьте её собеседнику.");
    });
  }

  function sendMessage() {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    
    if (text && conn && conn.open) {
      conn.send(text);
      appendMessage(text, 'my');
      input.value = '';
    } else if (!conn || !conn.open) {
      alert("Собеседник не подключен.");
    }
  }

  function appendMessage(text, type) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `msg ${type}`;
    
    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    msgDiv.innerHTML = `<div>${text}</div>${type !== 'system' ? `<div class="msg-time">${timeStr}</div>` : ''}`;
    
    const container = document.getElementById('messages');
    container.appendChild(msgDiv);
    container.scrollTop = container.scrollHeight;
  }

  async function startCall() {
    if (!targetPeerId) return alert("Нет подключенного собеседника!");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const call = peer.call(targetPeerId, stream);
      call.on('stream', (remoteStream) => {
        document.getElementById('remote-audio').srcObject = remoteStream;
      });
    } catch (err) {
      alert("Не удалось получить доступ к микрофону");
    }
  }

  function toggleLogs() {
    const container = document.getElementById('logs-container');
    container.style.display = container.style.display === 'flex' ? 'none' : 'flex';
  }

  function toggleEmoji() {
    const picker = document.getElementById('emoji-picker');
    picker.style.display = picker.style.display === 'flex' ? 'none' : 'flex';
  }

  function addEmoji(emoji) {
    const input = document.getElementById('message-input');
    input.value += emoji;
    toggleEmoji();
    input.focus();
  }
</script>

</body>
</html>
