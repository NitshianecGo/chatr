<!DOCTYPE html>

<head>

  <style>

    .splash-content .logo span { display: block; font-size: 1.8rem; letter-spacing: 4px; margin-top: 8px; color: #b8860b; }
    .splash-content .subtitle {

<script>
// ======================================================================
// 1. КОНФИГУРАЦИЯ
// ======================================================================
const PEER_OPTIONS = {
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  }
};

// ======================================================================
// 2. ШИФРОВАНИЕ (tweetnacl)
// ======================================================================
function generateKeyPair() {
  const pair = nacl.box.keyPair();
  return { 
    publicKey: nacl.util.encodeBase64(pair.publicKey), 
    secretKey: nacl.util.encodeBase64(pair.secretKey) 
  };
}

function encryptMessage(msgText, recipientPubKey, senderSecKey) {
  try {
    const recipientPub = nacl.util.decodeBase64(recipientPubKey);
    const senderSec = nacl.util.decodeBase64(senderSecKey);
    const nonce = nacl.randomBytes(24);
    const msgUint8 = nacl.util.decodeUTF8(msgText);
    const encrypted = nacl.box(msgUint8, nonce, recipientPub, senderSec);
    return { 
      nonce: nacl.util.encodeBase64(nonce), 
      encrypted: nacl.util.encodeBase64(encrypted) 
    };
  } catch(e) {
    console.error('Encryption error:', e);
    return null;
  }
}

function decryptMessage(pkg, senderPubKey, recipientSecKey) {
  try {
    const { nonce, encrypted } = pkg;
    const senderPub = nacl.util.decodeBase64(senderPubKey);
    const recipientSec = nacl.util.decodeBase64(recipientSecKey);
    const nonceUint8 = nacl.util.decodeBase64(nonce);
    const encryptedUint8 = nacl.util.decodeBase64(encrypted);
    const decrypted = nacl.box.open(encryptedUint8, nonceUint8, senderPub, recipientSec);
    if (!decrypted) throw new Error('Decryption failed');
    return nacl.util.encodeUTF8(decrypted);
  } catch (e) { 
    console.warn('Decryption error:', e); 
    return null; 
  }
}

// ======================================================================
// 3. СОСТОЯНИЕ ПРИЛОЖЕНИЯ
// ======================================================================
let currentRoom = null;
let peer = null;
let conn = null;
let call = null;
let localStream = null;
let remoteStream = null;
let hasVideo = false, hasAudio = false;
let myKeyPair = null;
let peerPublicKey = null;

// DOM Элементы
const splash = document.getElementById('splashScreen');
const app = document.getElementById('app');
const initBlock = document.getElementById('initBlock');

const emojiToggleBtn = document.getElementById('emojiToggleBtn');
const emojiPicker = document.getElementById('emojiPicker');

// ======================================================================
// 4. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
// ======================================================================
function addMessage(sender, content, mediaType = 'text', timestamp = Date.now()) {
  const div = document.createElement('div');
  div.className = 'msg';
  const timeStr = new Date(timestamp).toLocaleTimeString();
  let displayContent = content;
  if (mediaType === 'image') displayContent = `<img src="${content}" alt="Изображение" />`;
  else if (mediaType === 'video') displayContent = `<video src="${content}" controls style="max-width:160px;max-height:160px;"></video>`;
  
  div.innerHTML = `<span class="sender">${sender}</span> <span class="time">${timeStr}</span><br>${displayContent}`;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

async function testDevices() {
  statusInit.textContent = '🔍 Проверка устройств...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
    stream.getTracks().forEach(t => t.stop());
    statusInit.textContent = '✅ Все устройства работают!';
  } catch (e) {
    statusInit.textContent = '⚠️ Ошибка доступа: ' + e.message;
  }
}

async function getMedia() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
    hasVideo = true; hasAudio = true;
    return stream;
  } catch (e1) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      hasVideo = false; hasAudio = true;
      return stream;
    } catch (e2) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
        hasVideo = true; hasAudio = false;
        return stream;
      } catch (e3) {
        hasVideo = false; hasAudio = false;
        // Создаем пустышку Canvas Stream чтобы WebRTC не падал при отсутствии медиа
        const canvas = document.createElement('canvas');
        canvas.width = 320; canvas.height = 240;
        return canvas.captureStream();
      }
    }
  }
}

function showCallBlock() {
  initBlock.style.display = 'none';
  callBlock.style.display = 'block';
  document.getElementById('videoGrid').classList.add('active');
  document.getElementById('callControls').classList.add('active');
  document.getElementById('chatArea').classList.add('active');
  document.getElementById('inviteArea').classList.add('active');
}

function hideCallBlock() {
  initBlock.style.display = 'block';
  callBlock.style.display = 'none';
  document.getElementById('videoGrid').classList.remove('active');
  document.getElementById('callControls').classList.remove('active');
  document.getElementById('chatArea').classList.remove('active');
  document.getElementById('inviteArea').classList.remove('active');
}

// ======================================================================
// 5. СОЗДАНИЕ И ПРИСОЕДИНЕНИЕ K КОМНАТЕ
// ======================================================================
async function createRoom() {
  try {
    statusInit.textContent = '🛠 Создаём комнату...';
    const roomId = 'chat-' + Math.random().toString(36).substring(2, 10);
    currentRoom = roomId;
    myKeyPair = generateKeyPair();

    localStream = await getMedia();
    localVideo.srcObject = localStream;

    peer = new Peer(roomId, PEER_OPTIONS);
    await new Promise((resolve, reject) => {
      peer.on('open', resolve);
      peer.on('error', reject);
    });

    peer.on('connection', (dataConn) => {
      conn = dataConn;
      setupConnectionHandlers();
    });

    peer.on('call', (incomingCall) => {
      call = incomingCall;
      call.answer(localStream);
      setupCallHandlers();
    });

    const link = window.location.origin + window.location.pathname + '?room=' + encodeURIComponent(roomId);
    inviteLink.href = link;
    inviteLink.textContent = link;

    showCallBlock();
    statusDisplay.textContent = '⏳ Ожидаем подключения собеседника...';
    statusInit.textContent = 'Готов к связи';

  } catch (err) {
    console.error(err);
    statusInit.textContent = '❌ Ошибка: ' + err.message;
  }
}

async function joinRoom(roomId) {
  try {
    if (!roomId) {
      statusInit.textContent = '❌ Введите ID комнаты.';
      return;
    }
    currentRoom = roomId;
    myKeyPair = generateKeyPair();

    localStream = await getMedia();
    localVideo.srcObject = localStream;

    peer = new Peer(PEER_OPTIONS);
    await new Promise((resolve, reject) => {
      peer.on('open', resolve);
      peer.on('error', reject);
    });

    conn = peer.connect(roomId);
    setupConnectionHandlers();

    call = peer.call(roomId, localStream);
    setupCallHandlers();

    showCallBlock();
    document.getElementById('inviteArea').classList.remove('active');
    statusDisplay.textContent = '⏳ Устанавливаем соединение...';
    statusInit.textContent = 'Готов к связи';

  } catch (err) {
    console.error(err);
    statusInit.textContent = '❌ Ошибка: ' + err.message;
  }
}

function setupConnectionHandlers() {
  conn.on('open', () => {
    statusDisplay.textContent = '✅ Соединение для чата установлено!';
    // Обмениваемся публичными ключами
    conn.send({ type: 'key', publicKey: myKeyPair.publicKey });
  });

  conn.on('data', handleIncomingData);
  
  conn.on('close', () => {
    conn = null;
    statusDisplay.textContent = '⚠️ Соединение чата разорвано.';
  });
  
  conn.on('error', (err) => {
    console.error('DataConnection error:', err);
    statusDisplay.textContent = '❌ Ошибка соединения: ' + err.message;
  });
}

function setupCallHandlers() {
  call.on('stream', (remote) => {
    remoteStream = remote;
    remoteVideo.srcObject = remote;
    statusDisplay.textContent = '📞 Собеседник на связи!';
  });
  
  call.on('close', () => {
    remoteVideo.srcObject = null;
    statusDisplay.textContent = '🔴 Звонок завершён.';
    call = null;
  });
  
  call.on('error', (err) => {
    console.error('Call error:', err);
    call = null;
  });
}

// ======================================================================
// 6. ОБРАБОТКА ДАННЫХ И ШИФРОВАНИЕ
// ======================================================================
function handleIncomingData(data) {
  try {
    let parsed = typeof data === 'string' ? JSON.parse(data) : data;

    if (parsed.type === 'key') {
      peerPublicKey = parsed.publicKey;
      console.log('🔑 Публичный ключ собеседника получен');
      return;
    }

    if (parsed.type === 'message') {
      let content = parsed.content;
      if (parsed.encrypted && peerPublicKey) {
        const decrypted = decryptMessage(parsed.encrypted, peerPublicKey, myKeyPair.secretKey);
        if (decrypted) content = decrypted;
      }
      addMessage(parsed.sender || 'Товарищ', content, parsed.mediaType || 'text', parsed.timestamp);
    }
  } catch (e) {
    console.error('Data error:', e);
  }
}

function sendMessage(text, mediaType = 'text', fileData = null) {
  if (!conn || !conn.open) {
    statusDisplay.textContent = '⚠️ Нет открытого соединения!';
    return;
  }

  const rawContent = fileData || text;
  let encrypted = null;
  let finalContent = rawContent;

  if (peerPublicKey) {
    encrypted = encryptMessage(rawContent, peerPublicKey, myKeyPair.secretKey);
    // При зашифрованном канале скрываем открытое содержимое в пакете
    if (encrypted) finalContent = '[Encrypted]';
  }

  const msg = {
    type: 'message',
    sender: 'Я',
    content: finalContent,
    mediaType,
    timestamp: Date.now(),
    encrypted
  };

  try {
    conn.send(msg);
    addMessage('Я', rawContent, mediaType, msg.timestamp);
  } catch (e) {
    console.error('Send error:', e);
    statusDisplay.textContent = '❌ Ошибка отправки: ' + e.message;
  }
}

function exitRoom() {
  if (call) call.close();
  if (conn) conn.close();
  if (peer) peer.destroy();
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  
  remoteVideo.srcObject = null;
  localVideo.srcObject = null;
  hideCallBlock();
  chatMessages.innerHTML = '';
  currentRoom = null;
  peerPublicKey = null;
  statusDisplay.textContent = '';
  statusInit.textContent = 'Вы вышли из комнаты.';
}

// ======================================================================
// 7. СОБЫТИЯ И ИНТЕРФЕЙС
// ======================================================================
createRoomBtn.addEventListener('click', createRoom);

joinRoomBtn.addEventListener('click', () => {
  joinPanel.style.display = joinPanel.style.display === 'none' ? 'flex' : 'none';
});

doJoinBtn.addEventListener('click', () => {
  joinRoom(roomInput.value.trim());
});

testDeviceBtn.addEventListener('click', testDevices);

toggleAudioBtn.addEventListener('click', () => {
  if (localStream) {
    const tracks = localStream.getAudioTracks();
    if (tracks.length) {
      tracks[0].enabled = !tracks[0].enabled;
      toggleAudioBtn.textContent = tracks[0].enabled ? '🔇 Заглушить' : '🔊 Включить';
    }
  }
});

toggleVideoBtn.addEventListener('click', () => {
  if (localStream) {
    const tracks = localStream.getVideoTracks();
    if (tracks.length) {
      tracks[0].enabled = !tracks[0].enabled;
      toggleVideoBtn.textContent = tracks[0].enabled ? '📷 Выключить' : '📷 Включить';
    }
  }
});

hangupBtn.addEventListener('click', exitRoom);
exitRoomBtn.addEventListener('click', exitRoom);

copyLinkBtn.addEventListener('click', () => {
  if (inviteLink.href) {
    navigator.clipboard.writeText(inviteLink.href);
    statusDisplay.textContent = '✅ Ссылка скопирована!';
  }
});

sendChatBtn.addEventListener('click', () => {
  const text = chatInput.value.trim();
  if (text) {
    sendMessage(text);
    chatInput.value = '';
  }
});

chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChatBtn.click();
});

fileInput.addEventListener('change', (e) => {
  const files = e.target.files;
  for (let file of files) {
    if (file.size > 2 * 1024 * 1024) {
      alert('Файл слишком большой! Лимит для P2P DataChannel — 2MB.');
      continue;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      let mediaType = file.type.startsWith('video/') ? 'video' : 'image';
      sendMessage('', mediaType, ev.target.result);
    };
    reader.readAsDataURL(file);
  }
  fileInput.value = '';
});

emojiToggleBtn.addEventListener('click', () => {
  emojiPicker.classList.toggle('active');
});

emojiPicker.addEventListener('click', (e) => {
  if (e.target.tagName === 'SPAN') {
    chatInput.value += e.target.textContent;
    chatInput.focus();
    emojiPicker.classList.remove('active');
  }
});

window.addEventListener('load', () => {
  setTimeout(() => {
    splash.classList.add('hidden');
    app.classList.add('visible');
  }, 1200);

  const params = new URLSearchParams(window.location.search);
  const room = params.get('room');
  if (room) {
    setTimeout(() => joinRoom(room), 1500);
  }
});
</script>
