<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Secure Chat</title>
  <!-- Socket.IO client -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <!-- tweetnacl + util -->
  <script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tweetnacl-util@0.15.1/nacl-util.min.js"></script>
  <!-- simple-peer -->
  <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f5f7fa;
      color: #1e293b;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #app {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 800px;
      background: white;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }
    /* Создание комнаты */
    #home {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      text-align: center;
    }
    #home h1 { font-size: 2rem; margin-bottom: 10px; }
    #home p { color: #64748b; margin-bottom: 30px; }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover { background: #2563eb; transform: scale(1.02); }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }

    /* Чат */
    #chat { display: none; flex-direction: column; height: 100%; }
    #header {
      padding: 16px 20px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    #header h2 { font-size: 1.1rem; font-weight: 600; }
    #header-actions { display: flex; gap: 8px; }
    #header-actions button {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    #header-actions button:hover { background: #f1f5f9; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f8fafc;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      word-wrap: break-word;
      position: relative;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .msg-sent {
      align-self: flex-end;
      background: #3b82f6;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg-received {
      align-self: flex-start;
      background: white;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
    }
    .msg-name {
      font-size: 0.7rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 2px;
    }
    .msg-sent .msg-name { color: #bfdbfe; }
    .msg-time {
      font-size: 0.6rem;
      color: #94a3b8;
      margin-top: 2px;
      text-align: right;
    }
    .msg-audio {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .msg-audio audio { max-width: 180px; height: 30px; }

    #input-area {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    #input-area input {
      flex: 1;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }
    #input-area input:focus { border-color: #3b82f6; }
    #input-area button {
      background: #3b82f6;
      border: none;
      color: white;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #input-area button:hover { background: #2563eb; }
    #input-area .icon-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    #input-area .icon-btn:hover { background: #f1f5f9; }

    /* Видео-звонок */
    #call-container {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #call-container video {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      border-radius: 12px;
      margin: 10px;
    }
    #call-controls {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    #call-controls button {
      background: #ef4444;
      border: none;
      color: white;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 1.5rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    #call-controls button:hover { background: #dc2626; }
    #call-container .call-info {
      color: white;
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    /* Адаптив */
    @media (max-width: 480px) {
      #app { border-radius: 0; max-height: 100vh; }
      .msg { max-width: 90%; }
    }
  </style>
</head>
<body>
<div id="app">
  <!-- Главный экран (создание комнаты) -->
  <div id="home">
    <h1>🔒 Secure Chat</h1>
    <p>Анонимный чат с шифрованием и звонками</p>
    <button class="btn" id="createRoomBtn">➕ Создать комнату</button>
    <div style="margin-top: 20px; font-size: 0.9rem; color: #94a3b8;">
      Или введите ID комнаты:
      <input id="roomIdInput" placeholder="например, abc123" style="margin-top: 8px; padding: 8px; border-radius: 20px; border:1px solid #e2e8f0; width:200px;">
      <button class="btn btn-secondary" id="joinRoomBtn" style="margin-top: 8px;">Войти</button>
    </div>
  </div>

  <!-- Чат -->
  <div id="chat">
    <div id="header">
      <h2 id="roomTitle">Комната</h2>
      <div id="header-actions">
        <button id="audioCallBtn" title="Аудиозвонок">📞</button>
        <button id="videoCallBtn" title="Видеозвонок">📹</button>
        <button id="leaveRoomBtn" title="Выйти">✕</button>
      </div>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <button class="icon-btn" id="recordBtn" title="Аудиосообщение">🎤</button>
      <input id="msgInput" placeholder="Сообщение..." autocomplete="off">
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <!-- Окно звонка -->
  <div id="call-container">
    <div class="call-info" id="callInfo">Звонок...</div>
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted style="width:120px; position:absolute; bottom:100px; right:20px; border-radius:10px; background:#1e293b;"></video>
    <div id="call-controls">
      <button id="hangupBtn">📴</button>
    </div>
  </div>
</div>

<script>
// ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
let socket = null;
let roomId = '';
let myName = '';
let myKeyPair = null;
let participants = new Map(); // socketId -> { publicKey, name }
let messages = [];
let peer = null;
let localStream = null;
let remoteStream = null;
let callType = null; // 'audio' или 'video'
let isCallActive = false;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let currentRoom = '';

// DOM элементы
const home = document.getElementById('home');
const chat = document.getElementById('chat');
const messagesDiv = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const createRoomBtn = document.getElementById('createRoomBtn');
const joinRoomBtn = document.getElementById('joinRoomBtn');
const roomIdInput = document.getElementById('roomIdInput');
const roomTitle = document.getElementById('roomTitle');
const leaveRoomBtn = document.getElementById('leaveRoomBtn');
const audioCallBtn = document.getElementById('audioCallBtn');
const videoCallBtn = document.getElementById('videoCallBtn');
const recordBtn = document.getElementById('recordBtn');
const callContainer = document.getElementById('call-container');
const remoteVideo = document.getElementById('remoteVideo');
const localVideo = document.getElementById('localVideo');
const hangupBtn = document.getElementById('hangupBtn');
const callInfo = document.getElementById('callInfo');

// ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
function generateRandomName() {
  const adjs = ['Быстрый', 'Смелый', 'Тихий', 'Умный', 'Добрый', 'Сильный', 'Весёлый', 'Спокойный'];
  const nouns = ['Лис', 'Волк', 'Медведь', 'Заяц', 'Сокол', 'Дельфин', 'Тигр', 'Панда'];
  return adjs[Math.floor(Math.random() * adjs.length)] + nouns[Math.floor(Math.random() * nouns.length)];
}

function generateKeyPair() {
  const pair = nacl.box.keyPair();
  return {
    publicKey: nacl.util.encodeBase64(pair.publicKey),
    secretKey: nacl.util.encodeBase64(pair.secretKey),
  };
}

function encryptMessage(message, recipientPublicKeyBase64, senderSecretKeyBase64) {
  const recipientPublicKey = nacl.util.decodeBase64(recipientPublicKeyBase64);
  const senderSecretKey = nacl.util.decodeBase64(senderSecretKeyBase64);
  const nonce = nacl.randomBytes(24);
  const msgUint8 = new TextEncoder().encode(message);
  const encrypted = nacl.box(msgUint8, nonce, recipientPublicKey, senderSecretKey);
  return {
    nonce: nacl.util.encodeBase64(nonce),
    encrypted: nacl.util.encodeBase64(encrypted),
  };
}

function decryptMessage(encryptedPackage, senderPublicKeyBase64, recipientSecretKeyBase64) {
  try {
    const { nonce, encrypted } = encryptedPackage;
    const senderPublicKey = nacl.util.decodeBase64(senderPublicKeyBase64);
    const recipientSecretKey = nacl.util.decodeBase64(recipientSecretKeyBase64);
    const nonceUint8 = nacl.util.decodeBase64(nonce);
    const encryptedUint8 = nacl.util.decodeBase64(encrypted);
    const decrypted = nacl.box.open(encryptedUint8, nonceUint8, senderPublicKey, recipientSecretKey);
    if (!decrypted) throw new Error('Decryption failed');
    return new TextDecoder().decode(decrypted);
  } catch (e) {
    console.error('Decryption error:', e);
    return null;
  }
}

function formatTime(date) {
  return new Date(date).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

// ==================== РАБОТА С СОКЕТАМИ И КОМНАТОЙ ====================
function connectToRoom(roomIdParam) {
  roomId = roomIdParam;
  myName = generateRandomName();
  myKeyPair = generateKeyPair();

  socket = io();

  socket.on('connect', () => {
    console.log('Socket connected');
    socket.emit('join-room', {
      roomId,
      publicKey: myKeyPair.publicKey,
      name: myName,
    });
  });

  socket.on('chat-history', (history) => {
    messages = history;
    renderMessages();
  });

  socket.on('new-message', (msg) => {
    messages.push(msg);
    renderMessages();
  });

  socket.on('user-joined', ({ socketId, publicKey, name }) => {
    participants.set(socketId, { publicKey, name });
    addSystemMessage(`➡️ ${name} присоединился`);
  });

  socket.on('participants-list', (list) => {
    list.forEach(p => participants.set(p.socketId, { publicKey: p.publicKey, name: p.name }));
    const names = Array.from(participants.values()).map(p => p.name).join(', ');
    roomTitle.textContent = `Комната ${roomId} (${participants.size})`;
  });

  socket.on('user-left', (socketId) => {
    const name = participants.get(socketId)?.name || 'Кто-то';
    participants.delete(socketId);
    addSystemMessage(`⬅️ ${name} вышел`);
    roomTitle.textContent = `Комната ${roomId} (${participants.size})`;
  });

  socket.on('webrtc-signal', ({ signal, from, fromName }) => {
    if (!peer) {
      // Если мы не инициировали, значит входящий звонок – надо создать peer как отвечающий
      startPeer(false, from, signal);
    } else {
      peer.signal(signal);
    }
  });

  // Переключение интерфейса
  home.style.display = 'none';
  chat.style.display = 'flex';
  roomTitle.textContent = `Комната ${roomId} (подключение...)`;
  msgInput.focus();
}

function addSystemMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg msg-received';
  div.style.textAlign = 'center';
  div.style.background = 'transparent';
  div.style.border = 'none';
  div.style.color = '#94a3b8';
  div.style.fontSize = '0.8rem';
  div.textContent = text;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function renderMessages() {
  messagesDiv.innerHTML = '';
  messages.forEach(msg => {
    const isOwn = msg.senderId === socket.id;
    const div = document.createElement('div');
    div.className = `msg ${isOwn ? 'msg-sent' : 'msg-received'}`;

    // Имя
    const nameSpan = document.createElement('div');
    nameSpan.className = 'msg-name';
    nameSpan.textContent = msg.senderName || 'Неизвестный';
    div.appendChild(nameSpan);

    // Содержимое
    if (msg.type === 'audio') {
      const audioContainer = document.createElement('div');
      audioContainer.className = 'msg-audio';
      try {
        const decrypted = decryptMessage(
          JSON.parse(msg.encryptedMessage),
          participants.get(msg.senderId)?.publicKey,
          myKeyPair.secretKey
        );
        if (decrypted) {
          const audio = document.createElement('audio');
          audio.controls = true;
          audio.src = decrypted; // base64 аудио
          audio.style.maxWidth = '180px';
          audioContainer.appendChild(audio);
        } else {
          audioContainer.textContent = '🔒 Зашифровано';
        }
      } catch {
        audioContainer.textContent = '🔒 Ошибка';
      }
      div.appendChild(audioContainer);
    } else {
      // Текст
      try {
        const decrypted = decryptMessage(
          JSON.parse(msg.encryptedMessage),
          participants.get(msg.senderId)?.publicKey,
          myKeyPair.secretKey
        );
        const textSpan = document.createElement('div');
        textSpan.textContent = decrypted || '🔒 Не удалось расшифровать';
        div.appendChild(textSpan);
      } catch {
        div.innerHTML += '🔒 Ошибка расшифровки';
      }
    }

    const timeSpan = document.createElement('div');
    timeSpan.className = 'msg-time';
    timeSpan.textContent = formatTime(msg.createdAt);
    div.appendChild(timeSpan);

    messagesDiv.appendChild(div);
  });
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// ==================== ОТПРАВКА СООБЩЕНИЙ ====================
function sendTextMessage(text) {
  if (!text.trim() || !socket) return;
  // Выбираем первого получателя (для простоты шифруем для всех? В реальном чате надо шифровать для каждого.
  // Для демонстрации шифруем для первого участника, кроме себя.
  const recipient = Array.from(participants.values()).find(p => p.publicKey);
  if (!recipient) {
    alert('Нет получателей');
    return;
  }
  const encrypted = encryptMessage(text, recipient.publicKey, myKeyPair.secretKey);
  socket.emit('send-message', {
    roomId,
    encryptedMessage: JSON.stringify(encrypted),
    type: 'text',
  });
  msgInput.value = '';
  msgInput.focus();
}

function sendAudioMessage(base64Audio) {
  if (!socket) return;
  const recipient = Array.from(participants.values()).find(p => p.publicKey);
  if (!recipient) {
    alert('Нет получателей');
    return;
  }
  const encrypted = encryptMessage(base64Audio, recipient.publicKey, myKeyPair.secretKey);
  socket.emit('send-message', {
    roomId,
    encryptedMessage: JSON.stringify(encrypted),
    type: 'audio',
  });
}

// ==================== ЗАПИСЬ АУДИО ====================
recordBtn.addEventListener('click', async () => {
  if (isRecording) {
    // Остановить запись
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
    }
    isRecording = false;
    recordBtn.textContent = '🎤';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = event => {
      if (event.data.size > 0) audioChunks.push(event.data);
    };
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        sendAudioMessage(base64);
      };
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(track => track.stop());
    };
    mediaRecorder.start();
    isRecording = true;
    recordBtn.textContent = '⏹️';
  } catch (e) {
    alert('Нет доступа к микрофону');
  }
});

// ==================== ОТПРАВКА ПО КНОПКЕ И ENTER ====================
sendBtn.addEventListener('click', () => sendTextMessage(msgInput.value));
msgInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendTextMessage(msgInput.value);
});

// ==================== СОЗДАНИЕ / ВХОД В КОМНАТУ ====================
createRoomBtn.addEventListener('click', () => {
  const newRoomId = Math.random().toString(36).substring(2, 8);
  connectToRoom(newRoomId);
  // Обновить URL без перезагрузки
  window.history.pushState({}, '', `/?room=${newRoomId}`);
});

joinRoomBtn.addEventListener('click', () => {
  const id = roomIdInput.value.trim();
  if (id) {
    connectToRoom(id);
    window.history.pushState({}, '', `/?room=${id}`);
  }
});

// Автоматический вход по параметру room в URL
window.addEventListener('load', () => {
  const params = new URLSearchParams(window.location.search);
  const room = params.get('room');
  if (room) {
    connectToRoom(room);
  }
});

// ==================== ВЫХОД ИЗ КОМНАТЫ ====================
leaveRoomBtn.addEventListener('click', () => {
  if (socket) socket.disconnect();
  participants.clear();
  messages = [];
  home.style.display = 'flex';
  chat.style.display = 'none';
  window.history.pushState({}, '', '/');
  if (peer) {
    peer.destroy();
    peer = null;
  }
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  callContainer.style.display = 'none';
  isCallActive = false;
});

// ==================== ЗВОНКИ (WebRTC) ====================
function startPeer(isInitiator, targetSocketId, incomingSignal = null) {
  // Находим получателя
  const target = participants.get(targetSocketId);
  if (!target) {
    alert('Собеседник не найден');
    return;
  }

  // Получаем медиа
  const constraints = { audio: true, video: callType === 'video' };
  navigator.mediaDevices.getUserMedia(constraints)
    .then(stream => {
      localStream = stream;
      localVideo.srcObject = stream;

      peer = new SimplePeer({
        initiator: isInitiator,
        trickle: false,
        stream: stream,
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
      });

      peer.on('signal', signal => {
        if (socket) {
          socket.emit('webrtc-signal', {
            roomId,
            signal,
            targetSocketId: targetSocketId,
          });
        }
      });

      peer.on('stream', remoteStream => {
        remoteVideo.srcObject = remoteStream;
        remoteVideo.play();
      });

      peer.on('error', err => {
        console.error('Peer error:', err);
        hangupCall();
      });

      peer.on('close', () => {
        hangupCall();
      });

      // Если входящий звонок, обрабатываем сигнал
      if (incomingSignal) {
        peer.signal(incomingSignal);
      }

      isCallActive = true;
      callContainer.style.display = 'flex';
      callInfo.textContent = `Звонок с ${target.name || 'собеседником'}`;
    })
    .catch(err => {
      alert('Не удалось получить доступ к медиа: ' + err.message);
    });
}

function hangupCall() {
  if (peer) {
    peer.destroy();
    peer = null;
  }
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  remoteVideo.srcObject = null;
  localVideo.srcObject = null;
  callContainer.style.display = 'none';
  isCallActive = false;
  callType = null;
}

// Инициация звонка
audioCallBtn.addEventListener('click', () => {
  if (isCallActive) return;
  // Выбираем первого участника кроме себя
  const targetId = Array.from(participants.keys()).find(id => id !== socket.id);
  if (!targetId) {
    alert('Нет собеседника');
    return;
  }
  callType = 'audio';
  startPeer(true, targetId);
});

videoCallBtn.addEventListener('click', () => {
  if (isCallActive) return;
  const targetId = Array.from(participants.keys()).find(id => id !== socket.id);
  if (!targetId) {
    alert('Нет собеседника');
    return;
  }
  callType = 'video';
  startPeer(true, targetId);
});

hangupBtn.addEventListener('click', hangupCall);

// Обработка входящего сигнала (если звонят нам) – логика в socket.on('webrtc-signal') выше
// При получении сигнала от другого участника мы создаём peer как отвечающий, если его нет
// Дополним обработчик в socket.on('webrtc-signal') – он уже есть, но надо создать peer при входящем
// Модифицируем его: если peer нет, то вызываем startPeer(false, from, signal)
// Для этого переопределим обработчик после инициализации socket.
// Сделаем это внутри connectToRoom, перезаписав обработчик.
// Так как мы уже написали обработчик выше, заменим его динамически.
// В коде выше есть socket.on('webrtc-signal', ...), заменим на следующую реализацию.
// Для удобства перепишем функцию connectToRoom целиком с правильным обработчиком.

// Переопределим функцию connectToRoom с корректным обработчиком звонков:
const originalConnect = connectToRoom;
connectToRoom = function(roomIdParam) {
  roomId = roomIdParam;
  myName = generateRandomName();
  myKeyPair = generateKeyPair();

  socket = io();

  socket.on('connect', () => {
    socket.emit('join-room', {
      roomId,
      publicKey: myKeyPair.publicKey,
      name: myName,
    });
  });

  socket.on('chat-history', (history) => {
    messages = history;
    renderMessages();
  });

  socket.on('new-message', (msg) => {
    messages.push(msg);
    renderMessages();
  });

  socket.on('user-joined', ({ socketId, publicKey, name }) => {
    participants.set(socketId, { publicKey, name });
    addSystemMessage(`➡️ ${name} присоединился`);
  });

  socket.on('participants-list', (list) => {
    list.forEach(p => participants.set(p.socketId, { publicKey: p.publicKey, name: p.name }));
    roomTitle.textContent = `Комната ${roomId} (${participants.size})`;
  });

  socket.on('user-left', (socketId) => {
    const name = participants.get(socketId)?.name || 'Кто-то';
    participants.delete(socketId);
    addSystemMessage(`⬅️ ${name} вышел`);
    roomTitle.textContent = `Комната ${roomId} (${participants.size})`;
  });

  // Обработка сигналов WebRTC – создаём peer если входящий
  socket.on('webrtc-signal', ({ signal, from, fromName }) => {
    if (!isCallActive && !peer) {
      // Входящий звонок – предлагаем принять
      if (confirm(`Входящий звонок от ${fromName || 'собеседника'}. Принять?`)) {
        // Определяем тип – можно спросить, но для простоты делаем аудио
        callType = 'audio'; // можно расширить
        // Запускаем peer как отвечающий
        startPeer(false, from, signal);
      } else {
        // Отправляем сигнал отказа (не реализовано, просто игнорируем)
      }
    } else if (peer && isCallActive) {
      peer.signal(signal);
    }
  });

  // Переключение интерфейса
  home.style.display = 'none';
  chat.style.display = 'flex';
  roomTitle.textContent = `Комната ${roomId} (подключение...)`;
  msgInput.focus();
};

// Заново вызываем функцию для обработки автовхода
// Но так как мы переопределили, нужно заново инициализировать при загрузке
// Однако код загрузки уже есть, он вызывает connectToRoom. Всё должно работать.

// Для совместимости, переопределим обработчик записи, чтобы не было конфликтов.
// Также нужно учесть, что в функции startPeer используется participants.get(targetSocketId) – надо передавать имя.

// Исправим startPeer, чтобы отображать имя вызывающего
const originalStartPeer = startPeer;
startPeer = function(isInitiator, targetSocketId, incomingSignal = null) {
  const target = participants.get(targetSocketId);
  if (!target) {
    alert('Собеседник не найден');
    return;
  }

  const constraints = { audio: true, video: callType === 'video' };
  navigator.mediaDevices.getUserMedia(constraints)
    .then(stream => {
      localStream = stream;
      localVideo.srcObject = stream;

      peer = new SimplePeer({
        initiator: isInitiator,
        trickle: false,
        stream: stream,
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
      });

      peer.on('signal', signal => {
        if (socket) {
          socket.emit('webrtc-signal', {
            roomId,
            signal,
            targetSocketId: targetSocketId,
          });
        }
      });

      peer.on('stream', remoteStream => {
        remoteVideo.srcObject = remoteStream;
        remoteVideo.play();
      });

      peer.on('error', err => {
        console.error('Peer error:', err);
        hangupCall();
      });

      peer.on('close', () => {
        hangupCall();
      });

      if (incomingSignal) {
        peer.signal(incomingSignal);
      }

      isCallActive = true;
      callContainer.style.display = 'flex';
      callInfo.textContent = isInitiator ? `Звонок ${target.name}...` : `Входящий звонок от ${target.name}`;
    })
    .catch(err => {
      alert('Не удалось получить доступ к медиа: ' + err.message);
    });
};

console.log('Приложение загружено. Для теста создайте комнату или перейдите по ссылке с параметром ?room=...');
</script>
