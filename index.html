<script>

};
const SECRET = "SecureChat2026_SecretKey";

// ======================================================================
// 2. FIREBASE (для хранения сообщений)
// ======================================================================
const firebaseConfig = {
  apiKey: "AIzaSyDYRkGlyl5ySs4AyCuJEM39M-4FPok9sKA",

};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ======================================================================
// 3. ШИФРОВАНИЕ (tweetnacl)
// ======================================================================
function generateKeyPair() {
  const pair = nacl.box.keyPair();
  return {
    publicKey: nacl.util.encodeBase64(pair.publicKey),
    secretKey: nacl.util.encodeBase64(pair.secretKey)
  };
}
function encryptMessage(message, recipientPublicKey, senderSecretKey) {
  const recipientPub = nacl.util.decodeBase64(recipientPublicKey);
  const senderSec = nacl.util.decodeBase64(senderSecretKey);
  const nonce = nacl.randomBytes(24);
  const msgUint8 = new TextEncoder().encode(message);
  const encrypted = nacl.box(msgUint8, nonce, recipientPub, senderSec);
  return {
    nonce: nacl.util.encodeBase64(nonce),
    encrypted: nacl.util.encodeBase64(encrypted)
  };
}
function decryptMessage(encryptedPackage, senderPublicKey, recipientSecretKey) {
  try {
    const { nonce, encrypted } = encryptedPackage;
    const senderPub = nacl.util.decodeBase64(senderPublicKey);
    const recipientSec = nacl.util.decodeBase64(recipientSecretKey);
    const nonceUint8 = nacl.util.decodeBase64(nonce);
    const encryptedUint8 = nacl.util.decodeBase64(encrypted);
    const decrypted = nacl.box.open(encryptedUint8, nonceUint8, senderPub, recipientSec);
    if (!decrypted) throw new Error('Decryption failed');
    return new TextDecoder().decode(decrypted);
  } catch (e) {
    console.warn('Decryption error:', e);
    return null;
  }
}

// ======================================================================
// 4. УПРАВЛЕНИЕ ТОКЕНАМИ И ПРИГЛАШЕНИЯМИ
// ======================================================================
function getCurrentWindow() {
  return Math.floor(Date.now() / 1000 / 300);
}
function generateToken(roomId, windowMinutes) {
  const data = roomId + ':' + windowMinutes + ':' + SECRET;
  let hash = 0;
  for (let i = 0; i < data.length; i++) {
    const ch = data.charCodeAt(i);
    hash = ((hash << 5) - hash) + ch;
    hash |= 0;
  }
  return 't' + Math.abs(hash).toString(36).substring(0, 8);
}
function getValidTokens(roomId) {
  const cur = getCurrentWindow();
  return [generateToken(roomId, cur), generateToken(roomId, cur - 1)];
}
function isTokenValid(roomId, token) {
  return getValidTokens(roomId).includes(token);
}
function buildInviteLink(roomId, token) {
  const base = window.location.origin + window.location.pathname;
  return base + '?room=' + encodeURIComponent(roomId) + '&token=' + encodeURIComponent(token);
}

// ======================================================================
// 5. СОСТОЯНИЕ ПРИЛОЖЕНИЯ
// ======================================================================
let currentRoom = null;
let currentToken = null;
let peer = null;
let conn = null;
let call = null;
let localStream = null;
let remoteStream = null;
let isInitiator = false;
let timerInterval = null;
let lifetimeTimer = null;
let roomLifetimeMs = 15 * 60000;
let messages = [];
let hasVideo = false;
let hasAudio = false;
let myKeyPair = null;
let peerPublicKey = null;

// DOM элементы
const initBlock = document.getElementById('initBlock');
const callBlock = document.getElementById('callBlock');
const statusInit = document.getElementById('statusInit');
const statusDisplay = document.getElementById('statusDisplay');

const remoteVideo = document.getElementById('remoteVideo');

const chatInput = document.getElementById('chatInput');
const sendChatBtn = document.getElementById('sendChatBtn');
const fileInput = document.getElementById('fileInput');

const joinRoomBtn = document.getElementById('joinRoomBtn');

const testDeviceBtn = document.getElementById('testDeviceBtn');

const toggleVideoBtn = document.getElementById('toggleVideoBtn');
const hangupBtn = document.getElementById('hangupBtn');
const copyLinkBtn = document.getElementById('copyLinkBtn');
const refreshLinkBtn = document.getElementById('refreshLinkBtn');
const exitRoomBtn = document.getElementById('exitRoomBtn');
const emojiToggleBtn = document.getElementById('emojiToggleBtn');
const emojiPicker = document.getElementById('emojiPicker');

// ======================================================================
// 6. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
// ======================================================================
function addMessage(sender, content, mediaType = 'text', timestamp = Date.now()) {
  const div = document.createElement('div');
  div.className = 'msg';
  const timeStr = new Date(timestamp).toLocaleTimeString();
  let displayContent = content;
  if (mediaType === 'image') {
    displayContent = `<img src="${content}" alt="Изображение" />`;
  } else if (mediaType === 'video') {
    displayContent = `<video src="${content}" controls style="max-width:120px;max-height:120px;"></video>`;
  }
  div.innerHTML = `<span class="sender">${sender}</span> <span class="time">${timeStr}</span><br>${displayContent}`;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  if (currentRoom) {
    db.collection('rooms').doc(currentRoom).collection('messages').add({
      sender,
      content,
      mediaType,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(err => console.warn('Firestore save error:', err));
  }
}

function loadHistoryFromFirestore() {
  if (!currentRoom) return;
  db.collection('rooms').doc(currentRoom).collection('messages')
    .orderBy('timestamp', 'asc')
    .limit(50)
    .get()
    .then(snapshot => {
      chatMessages.innerHTML = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        addMessage(data.sender, data.content, data.mediaType, data.timestamp?.toMillis?.() || Date.now());
      });
    })
    .catch(err => console.warn('Load history error:', err));
}

// ======================================================================
// 7. ПРОВЕРКА УСТРОЙСТВ
// ======================================================================
async function testDevices() {
  statusInit.textContent = '🔍 Проверка устройств...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
    stream.getTracks().forEach(t => t.stop());
    statusInit.textContent = '✅ Все устройства работают!';
  } catch (e) {
    statusInit.textContent = '⚠️ Частичная ошибка: ' + e.message + '. Попробуйте войти без видео.';
    console.warn(e);
  }
}

// ======================================================================
// 8. ЗАПУСК МЕДИА (с отказоустойчивостью)
// ======================================================================
async function getMedia() {
  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
    hasVideo = true; hasAudio = true;
    return stream;
  } catch (e1) {
    console.warn('Видео+аудио не доступны, пробуем только аудио:', e1.message);
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      hasVideo = false; hasAudio = true;
      return stream;
    } catch (e2) {
      console.warn('Аудио не доступно, пробуем только видео:', e2.message);
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
        hasVideo = true; hasAudio = false;
        return stream;
      } catch (e3) {
        console.warn('Ничего не доступно, создаём пустой поток:', e3.message);
        return new MediaStream();
      }
    }
  }
}

// ======================================================================
// 9. ПОКАЗАТЬ/СКРЫТЬ БЛОКИ
// ======================================================================
function showCallBlock() {
  initBlock.style.display = 'none'; // скрываем главное меню
  callBlock.style.display = 'block';
  document.getElementById('videoGrid').classList.add('active');
  document.getElementById('callControls').classList.add('active');
  document.getElementById('chatArea').classList.add('active');
  document.getElementById('inviteArea').classList.add('active');
  if (!hasVideo) {
    localVideo.style.display = 'none';
    remoteVideo.style.display = 'none';
  } else {
    localVideo.style.display = 'block';
    remoteVideo.style.display = 'block';
  }
}
function hideCallBlock() {
  initBlock.style.display = 'block'; // показываем главное меню при выходе
  callBlock.style.display = 'none';
  document.getElementById('videoGrid').classList.remove('active');
  document.getElementById('callControls').classList.remove('active');
  document.getElementById('chatArea').classList.remove('active');
  document.getElementById('inviteArea').classList.remove('active');
  localVideo.style.display = 'block';
  remoteVideo.style.display = 'block';
}

// ======================================================================
// 10. СОЗДАНИЕ КОМНАТЫ
// ======================================================================
async function createRoom() {
  try {
    statusInit.textContent = '🛠 Создаём комнату...';
    const roomId = 'chat-' + Math.random().toString(36).substring(2, 10);
    currentRoom = roomId;
    isInitiator = true;

    myKeyPair = generateKeyPair();

    const stream = await getMedia();
    localStream = stream;
    if (hasVideo) localVideo.srcObject = stream;

    peer = new Peer(roomId, PEER_OPTIONS);
    await new Promise((resolve, reject) => {
      peer.on('open', () => resolve());
      peer.on('error', reject);
    });

    peer.on('connection', (dataConn) => {
      if (conn) { dataConn.close(); return; }
      conn = dataConn;
      conn.on('open', () => {
        statusDisplay.textContent = '✅ Соединение для чата установлено!';
        conn.send(JSON.stringify({ type: 'key', publicKey: myKeyPair.publicKey }));
        loadHistoryFromFirestore();
      });
      conn.on('data', (data) => handleIncomingData(data));
      conn.on('close', () => { conn = null; statusDisplay.textContent = '⚠️ Соединение чата разорвано.'; });
    });

    peer.on('call', (incomingCall) => {
      if (call) { incomingCall.answer(); return; }
      call = incomingCall;
      call.answer(localStream);
      call.on('stream', (remote) => {
        remoteStream = remote;
        remoteVideo.srcObject = remote;
        statusDisplay.textContent = '📞 Товарищ на связи!';
      });
      call.on('close', () => { remoteVideo.srcObject = null; statusDisplay.textContent = '🔴 Сеанс завершён.'; call = null; });
      call.on('error', (err) => { statusDisplay.textContent = '❌ Ошибка звонка: ' + err.message; });
    });

    showCallBlock();
    updateInviteUI();
    startTimer();
    statusDisplay.textContent = '⏳ Ожидаем подключения товарища...';
    statusInit.textContent = 'Готов к связи';
    startLifetimeTimer();

  } catch (err) {
    console.error(err);
    statusInit.textContent = '❌ Ошибка: ' + err.message;
  }
}

// ======================================================================
// 11. ПРИСОЕДИНЕНИЕ К КОМНАТЕ
// ======================================================================
async function joinRoom(roomId, token) {
  try {
    if (!roomId || !token) {
      statusInit.textContent = '❌ Введите ID и токен.';
      return;
    }
    if (!isTokenValid(roomId, token)) {
      statusInit.textContent = '❌ Недействительная ссылка. Попросите товарища обновить приглашение.';
      return;
    }
    currentRoom = roomId;
    isInitiator = false;

    myKeyPair = generateKeyPair();

    const stream = await getMedia();
    localStream = stream;
    if (hasVideo) localVideo.srcObject = stream;

    peer = new Peer(PEER_OPTIONS);
    await new Promise((resolve, reject) => {
      peer.on('open', () => resolve());
      peer.on('error', reject);
    });

    conn = peer.connect(roomId);
    conn.on('open', () => {
      statusDisplay.textContent = '✅ Соединение с комнатой установлено.';
      conn.send(JSON.stringify({ type: 'key', publicKey: myKeyPair.publicKey }));
      loadHistoryFromFirestore();
    });
    conn.on('data', (data) => handleIncomingData(data));
    conn.on('close', () => { conn = null; statusDisplay.textContent = '⚠️ Соединение чата разорвано.'; });

    const callObj = peer.call(roomId, localStream);
    call = callObj;
    call.on('stream', (remote) => {
      remoteStream = remote;
      remoteVideo.srcObject = remote;
      statusDisplay.textContent = '📞 Товарищ на связи!';
    });
    call.on('close', () => { remoteVideo.srcObject = null; statusDisplay.textContent = '🔴 Сеанс завершён.'; call = null; });
    call.on('error', (err) => { statusDisplay.textContent = '❌ Ошибка звонка: ' + err.message; });

    showCallBlock();
    document.getElementById('inviteArea').classList.remove('active');
    statusDisplay.textContent = '⏳ Устанавливаем соединение...';
    statusInit.textContent = 'Готов к связи';

  } catch (err) {
    console.error(err);
    statusInit.textContent = '❌ Ошибка: ' + err.message;
  }
}

// ======================================================================
// 12. ОБРАБОТКА ВХОДЯЩИХ ДАННЫХ
// ======================================================================
function handleIncomingData(data) {
  try {
    const parsed = typeof data === 'string' ? JSON.parse(data) : data;
    if (parsed.type === 'key') {
      peerPublicKey = parsed.publicKey;
      console.log('Получен публичный ключ собеседника');
      return;
    }
    if (parsed.type === 'message') {
      let decryptedContent = parsed.content;
      if (parsed.encrypted && peerPublicKey) {
        const decrypted = decryptMessage(parsed.encrypted, peerPublicKey, myKeyPair.secretKey);
        if (decrypted) decryptedContent = decrypted;
      }
      addMessage(parsed.sender || 'Товарищ', decryptedContent, parsed.mediaType || 'text', parsed.timestamp);
      return;
    }
  } catch (e) {
    console.warn('Ошибка обработки данных:', e);
  }
}

// ======================================================================
// 13. ОТПРАВКА СООБЩЕНИЯ (с шифрованием)
// ======================================================================
function sendMessage(text, mediaType = 'text', fileData = null) {
  if (!conn) {
    statusDisplay.textContent = '⚠️ Нет соединения для чата.';
    return;
  }
  let content = fileData || text;
  let encrypted = null;
  if (peerPublicKey) {
    encrypted = encryptMessage(content, peerPublicKey, myKeyPair.secretKey);
    content = '';
  }
  const msg = {
    type: 'message',
    sender: 'Я',
    content: content,
    mediaType: mediaType,
    timestamp: Date.now(),
    encrypted: encrypted
  };
  conn.send(JSON.stringify(msg));
  addMessage('Я', fileData || text, mediaType, msg.timestamp);
}

// ======================================================================
// 14. ТАЙМЕР ОБНОВЛЕНИЯ ТОКЕНА
// ======================================================================
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  function update() {
    const now = Date.now();
    const msInWindow = 300000;
    const windowStart = Math.floor(now / msInWindow) * msInWindow;
    const nextChange = windowStart + msInWindow;
    const diff = nextChange - now;
    if (diff <= 0) { updateInviteUI(); setTimeout(update, 100); return; }
    const mins = Math.floor(diff / 60000);
    const secs = Math.floor((diff % 60000) / 1000);
    timerDisplay.textContent = `(до смены: ${mins}:${secs.toString().padStart(2, '0')})`;
  }
  update();
  timerInterval = setInterval(update, 1000);
}

function updateInviteUI() {
  if (!currentRoom) return;
  const token = generateToken(currentRoom, getCurrentWindow());
  currentToken = token;
  const link = buildInviteLink(currentRoom, token);
  inviteLink.href = link;
  inviteLink.textContent = link;
}

// ======================================================================
// 15. ТАЙМЕР ЖИЗНИ КОМНАТЫ
// ======================================================================
function startLifetimeTimer() {
  if (lifetimeTimer) clearTimeout(lifetimeTimer);
  const lifetime = 15 * 60000; // 15 минут
  lifetimeTimer = setTimeout(() => {
    statusDisplay.textContent = '⏰ Время комнаты истекло. Сеанс завершён.';
    exitRoom();
  }, lifetime);
}

// ======================================================================
// 16. ВЫХОД ИЗ КОМНАТЫ
// ======================================================================
function exitRoom() {
  if (call) call.close();
  if (conn) conn.close();
  if (peer) peer.destroy();
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  remoteVideo.srcObject = null;
  localVideo.srcObject = null;
  hideCallBlock();
  if (timerInterval) clearInterval(timerInterval);
  if (lifetimeTimer) clearTimeout(lifetimeTimer);
  chatMessages.innerHTML = '';
  messages = [];
  currentRoom = null;
  peerPublicKey = null;
  statusDisplay.textContent = '';
  statusInit.textContent = 'Вы вышли из комнаты.';
}

// ======================================================================
// 17. ОБРАБОТЧИКИ ИНТЕРФЕЙСА
// ======================================================================
createRoomBtn.addEventListener('click', createRoom);

joinRoomBtn.addEventListener('click', () => {
  joinPanel.style.display = joinPanel.style.display === 'none' ? 'flex' : 'none';
});

doJoinBtn.addEventListener('click', () => {
  const room = roomInput.value.trim();
  const token = tokenInput.value.trim();
  joinRoom(room, token);
});

testDeviceBtn.addEventListener('click', testDevices);

toggleAudioBtn.addEventListener('click', () => {
  if (localStream) {
    const tracks = localStream.getAudioTracks();
    if (tracks.length) {
      const en = !tracks[0].enabled;
      tracks[0].enabled = en;
      toggleAudioBtn.textContent = en ? '🔇 Заглушить' : '🔊 Включить';
    }
  }
});

toggleVideoBtn.addEventListener('click', () => {
  if (localStream) {
    const tracks = localStream.getVideoTracks();
    if (tracks.length) {
      const en = !tracks[0].enabled;
      tracks[0].enabled = en;
      toggleVideoBtn.textContent = en ? '📷 Выключить' : '📷 Включить';
    }
  }
});

hangupBtn.addEventListener('click', exitRoom);

copyLinkBtn.addEventListener('click', () => {
  const link = inviteLink.href;
  if (link) {
    navigator.clipboard.writeText(link).then(() => {
      statusDisplay.textContent = '✅ Ссылка скопирована!';
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = link;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      statusDisplay.textContent = '✅ Ссылка скопирована!';
    });
  }
});

refreshLinkBtn.addEventListener('click', () => {
  updateInviteUI();
  statusDisplay.textContent = '🔄 Ссылка обновлена!';
});

exitRoomBtn.addEventListener('click', exitRoom);

sendChatBtn.addEventListener('click', () => {
  const text = chatInput.value.trim();
  if (text) {
    sendMessage(text);
    chatInput.value = '';
  }
});

chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChatBtn.click();
});

fileInput.addEventListener('change', (e) => {
  const files = e.target.files;
  for (let file of files) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const base64 = ev.target.result;
      let mediaType = 'image';
      if (file.type.startsWith('video/')) mediaType = 'video';
      sendMessage(base64, mediaType);
    };
    reader.readAsDataURL(file);
  }
  fileInput.value = '';
});

// Эмодзи
emojiToggleBtn.addEventListener('click', () => {
  emojiPicker.classList.toggle('active');
});

emojiPicker.addEventListener('click', (e) => {
  if (e.target.tagName === 'SPAN') {
    chatInput.value += e.target.textContent;
    chatInput.focus();
    emojiPicker.classList.remove('active');
  }
});

// ======================================================================
// 18. АВТОМАТИЧЕСКИЙ ВХОД ПО ССЫЛКЕ
// ======================================================================
window.addEventListener('load', () => {
  const params = new URLSearchParams(window.location.search);
  const room = params.get('room');
  const token = params.get('token');
  if (room && token) {
    setTimeout(() => joinRoom(room, token), 500);
  }
});

console.log('Secure Chat загружен. Создайте комнату или присоединитесь по ссылке.');
</script>
